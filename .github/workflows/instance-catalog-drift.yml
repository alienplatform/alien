name: Instance Catalog Drift

# Regenerates the instance catalog from the clouds' machine APIs and fails when the committed
# catalog no longer matches, for example when a provider corrects a size's memory or GPU. GitHub
# emails a failed scheduled run to whoever last edited the schedule; on drift, rerun the
# generator locally and commit the result.

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    name: Instance catalog matches the clouds
    # GitHub's Ubuntu image ships the aws, gcloud and az CLIs the generator calls.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: cloud-tests
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_wrapper: false
          terraform_version: 1.14.5

      - name: Test cloud configuration
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
          GCP_PROJECT_ID: ${{ vars.TEST_GCP_MGMT_PROJECT_ID }}
        run: |
          echo "::add-mask::$GCP_PROJECT_ID"
          terraform -chdir=infra/test init -input=false
          ./scripts/gen-env-test.sh
          # gcp-target-3 is the cloud tests' default GCP target.
          ./scripts/select-e2e-targets.sh --env-file .env.test \
            --aws aws-target-1 --gcp gcp-target-3 --azure azure-target-1

      - name: Sign in to the test clouds
        uses: ./.github/actions/cloud-test-credentials
        with:
          management: "false"

      - name: Use the target identity in the CLIs
        run: |
          set -euo pipefail
          set -a; . ./.env.test; set +a
          export AWS_ACCESS_KEY_ID="$AWS_TARGET_ACCESS_KEY_ID" \
            AWS_SECRET_ACCESS_KEY="$AWS_TARGET_SECRET_ACCESS_KEY" \
            AWS_SESSION_TOKEN="$AWS_TARGET_SESSION_TOKEN"
          # Not secrets, so nothing masks them, and CLI errors print them into this public log.
          echo "::add-mask::$(aws sts get-caller-identity --query Account --output text)"
          echo "::add-mask::$GOOGLE_TARGET_PROJECT_ID"
          echo "::add-mask::$AZURE_TARGET_SUBSCRIPTION_ID"
          {
            echo "AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID"
            echo "AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY"
            echo "AWS_SESSION_TOKEN=$AWS_SESSION_TOKEN"
          } >> "$GITHUB_ENV"

          gcloud auth login --cred-file="$GOOGLE_TARGET_CREDENTIALS_FILE" --quiet
          # The generator lists GCP machine types in the CLI's current project.
          gcloud config set project "$GOOGLE_TARGET_PROJECT_ID"

          az login --service-principal --username "$AZURE_TARGET_CLIENT_ID" \
            --tenant "$AZURE_TARGET_TENANT_ID" \
            --federated-token "$(cat "$AZURE_TARGET_FEDERATED_TOKEN_FILE")" --output none
          az account set --subscription "$AZURE_TARGET_SUBSCRIPTION_ID"

      - name: Regenerate the catalog
        run: python3 scripts/instance-catalog/generate.py

      - name: Compare with the committed catalog
        run: |
          if ! git diff --quiet; then
            git diff --stat
            git diff
            echo "::error title=Instance catalog drift::the clouds no longer match the committed catalog; run python3 scripts/instance-catalog/generate.py and commit the result"
            exit 1
          fi
