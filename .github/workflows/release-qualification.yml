name: Release qualification

on:
  pull_request:
    branches: [main]

permissions:
  # The reusable release workflow also serves the prepare/publish entrypoint
  # and declares contents: write. GitHub requires callers to grant at least the
  # permissions declared by a called workflow, even when qualification itself
  # only checks out source and uploads artifacts.
  contents: write
  packages: write
  id-token: write

jobs:
  detect:
    runs-on: depot-ubuntu-24.04-arm
    outputs:
      is_release: ${{ steps.release.outputs.is_release }}
      source_ref: ${{ steps.release.outputs.source_ref }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Detect version-only release pull request
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REF_INPUT: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          SOURCE_REF="$SOURCE_REF_INPUT"
          if ! grep -qE '^[0-9a-f]{40}$' <<< "$SOURCE_REF"; then
            echo "::error::Release qualification requires an exact 40-character commit"
            exit 1
          fi
          HEAD_REPOSITORY="$PR_HEAD_REPOSITORY"
          HEAD_REF="$PR_HEAD_REF"
          BASE_SHA="$PR_BASE_SHA"

          CURRENT_VERSION=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          BASE_VERSION=$(git show "${BASE_SHA}:Cargo.toml" |
            sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p')
          if [ "$CURRENT_VERSION" != "$BASE_VERSION" ]; then
            if [ "$HEAD_REPOSITORY" != "$GITHUB_REPOSITORY" ]; then
              echo "::error::Release qualification only runs for repository-owned branches"
              exit 1
            fi
            if ! grep -qE '^[a-z0-9][a-z0-9._-]*/alien-[0-9]+-[a-z0-9]+(-[a-z0-9]+)*$' <<< "$HEAD_REF"; then
              echo "::error::Release qualification requires a Linear-derived branch"
              exit 1
            fi
            allowed='^(Cargo.toml|Cargo.lock|packages/(core|commands|sdk|testing|bindings|ai-gateway)/package.json|crates/alien-bindings-node/package.json|client-sdks/(platform|manager)/typescript/(package.json|jsr.json|package-lock.json|\.speakeasy/(gen.yaml|gen.lock))|packages/bindings/npm/(darwin-arm64|darwin-x64|linux-x64-gnu|linux-arm64-gnu)/package.json)$'
            unexpected=$(git diff --name-only "$BASE_SHA" "$SOURCE_REF" | grep -Ev "$allowed" || true)
            if [ -n "$unexpected" ]; then
              echo "::error::Release PR contains non-version files:"
              echo "$unexpected"
              exit 1
            fi
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi
          echo "source_ref=$SOURCE_REF" >> "$GITHUB_OUTPUT"

  qualify:
    needs: detect
    if: needs.detect.outputs.is_release == 'true'
    uses: ./.github/workflows/release.yml
    with:
      mode: stable
      stable_action: qualification
      source_ref: ${{ needs.detect.outputs.source_ref }}
    secrets: inherit

  release-qualification:
    name: Release qualification
    needs: [detect, qualify]
    if: always()
    runs-on: depot-ubuntu-24.04-arm
    steps:
      - name: Require qualification for release pull requests
        env:
          DETECT_RESULT: ${{ needs.detect.result }}
          IS_RELEASE: ${{ needs.detect.outputs.is_release }}
          QUALIFY_RESULT: ${{ needs.qualify.result }}
        run: |
          if [ "$DETECT_RESULT" != "success" ]; then
            echo "::error::Release qualification detection failed"
            exit 1
          fi
          if [ "$IS_RELEASE" = "true" ] && [ "$QUALIFY_RESULT" != "success" ]; then
            echo "::error::Release qualification did not complete successfully"
            exit 1
          fi
