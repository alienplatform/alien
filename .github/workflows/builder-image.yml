name: Builder image

# Builds ghcr.io/alienplatform/alien-builder for linux/amd64 and linux/arm64, each on a
# runner of its own architecture, and joins the two into one manifest list under `tag`.
# The image runs rustc, cargo and node while it builds, and rustc crashes under QEMU
# emulation, so neither half can be built on a runner of the other architecture.
# Release qualification calls it (`workflow_call`).
on:
  workflow_call:
    inputs:
      ref:
        description: Commit to build the image from
        type: string
        required: true
      tag:
        description: Tag the joined manifest list is pushed under
        type: string
        required: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/alienplatform/alien-builder

jobs:
  build:
    name: Build (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # Pushed by digest only: the tag goes on the joined manifest list below.
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: docker/Dockerfile.alien-builder
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: true
          sbom: true

      - name: Record the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          if ! grep -qE '^sha256:[0-9a-f]{64}$' <<< "$DIGEST"; then
            echo "::error::The build returned no image digest (got '${DIGEST}')"
            exit 1
          fi
          mkdir -p digests
          printf '%s\n' "$DIGEST" > "digests/${{ matrix.arch }}"

      - uses: actions/upload-artifact@v7
        with:
          name: builder-image-digest-${{ matrix.arch }}
          path: digests/${{ matrix.arch }}
          retention-days: 1
          if-no-files-found: error

  merge:
    name: Join the manifests
    needs: build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: builder-image-digest-*
          path: digests
          merge-multiple: true

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # Each source is an index holding one image and its attestation manifest; the joined
      # list keeps both images and both attestations.
      - name: Push the manifest list
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE}:${TAG}" \
            "${IMAGE}@$(cat digests/amd64)" \
            "${IMAGE}@$(cat digests/arm64)"

      - name: Check both platforms are in the list
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          platforms=$(docker buildx imagetools inspect "${IMAGE}:${TAG}" --format '{{json .Manifest}}' |
            jq -r '[.manifests[] | select(.platform.os == "linux") | .platform.architecture] | sort | join(",")')
          if [ "$platforms" != "amd64,arm64" ]; then
            echo "::error::${IMAGE}:${TAG} holds platforms '${platforms}', expected amd64,arm64"
            exit 1
          fi
          echo "${IMAGE}:${TAG}: ${platforms}"
