name: Cloud Tests

# Real-cloud tests of the cloud clients, bindings and the manager's registry proxy.
#
# Runs on demand (any branch; the `cloud-tests` environment decides who may) and nightly when main
# has a commit that has not passed yet. It never runs on pull requests.
#
# Jobs sign in with GitHub OIDC: AWS role sessions, Google workload identity federation and Azure
# federated credentials, all scoped to the `cloud-tests` environment of this repository. No cloud
# key is stored as a secret or written to `.env.test`, which holds configuration only. The test
# infrastructure (infra/test) is applied by a person, never by this workflow.

on:
  schedule:
    - cron: "37 2 * * *"
  workflow_dispatch:
    inputs:
      aws_target:
        description: "AWS target account"
        type: choice
        default: aws-target-1
        options: [aws-target-1]
      gcp_target:
        description: "GCP target project"
        type: choice
        default: gcp-target-3
        options: [gcp-target-1, gcp-target-2, gcp-target-3]
      azure_target:
        description: "Azure target subscription"
        type: choice
        default: azure-target-1
        options: [azure-target-1]

permissions:
  contents: read

env:
  # Fall back to local compilation when the shared sccache backend returns a
  # transient error (e.g. an HTTP 403) instead of failing the whole build.
  SCCACHE_IGNORE_SERVER_IO_ERROR: "1"

jobs:
  changed:
    name: Main changed since the last green run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        uses: ./.github/actions/changed-since-last-success

  setup:
    needs: [changed]
    if: needs.changed.outputs.changed == 'true'
    # The OIDC `sub` becomes `repo:OWNER/REPO:environment:cloud-tests` whatever the branch or
    # event, which is what the cloud-side trust matches. Only members can use the environment.
    environment: cloud-tests
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_wrapper: false
          terraform_version: 1.14.5

      - name: Generate .env.test
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
          TEST_GCP_MGMT_PROJECT_ID: ${{ vars.TEST_GCP_MGMT_PROJECT_ID }}
        run: |
          echo "::add-mask::$TEST_GCP_MGMT_PROJECT_ID"
          terraform -chdir=infra/test init -input=false
          ./scripts/gen-env-test.sh

      - name: Sign in to the test clouds
        uses: ./.github/actions/cloud-test-credentials
        with:
          target: "false"

      - name: Registry endpoints
        id: registries
        working-directory: infra/test
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
        run: |
          AWS_LAMBDA_IMAGE=$(terraform output -raw aws_lambda_image_uri)
          GCP_CLOUDRUN_IMAGE=$(terraform output -raw gcp_cloudrun_image_uri)
          AZURE_CONTAINER_APP_IMAGE=$(terraform output -raw azure_container_app_image_uri)
          {
            echo "aws_lambda_image=$AWS_LAMBDA_IMAGE"
            echo "gcp_cloudrun_image=$GCP_CLOUDRUN_IMAGE"
            echo "azure_container_app_image=$AZURE_CONTAINER_APP_IMAGE"
            echo "ecr_registry=$(echo "$AWS_LAMBDA_IMAGE" | cut -d/ -f1)"
            echo "ecr_region=$(echo "$AWS_LAMBDA_IMAGE" | cut -d/ -f1 | cut -d. -f4)"
            echo "gcr_registry=$(echo "$GCP_CLOUDRUN_IMAGE" | cut -d/ -f1)"
            echo "acr_registry=$(echo "$AZURE_CONTAINER_APP_IMAGE" | cut -d/ -f1)"
          } >> "$GITHUB_OUTPUT"

      - name: Login to registries
        env:
          ECR_REGISTRY: ${{ steps.registries.outputs.ecr_registry }}
          ECR_REGION: ${{ steps.registries.outputs.ecr_region }}
          GCR_REGISTRY: ${{ steps.registries.outputs.gcr_registry }}
          ACR_REGISTRY: ${{ steps.registries.outputs.acr_registry }}
        run: |
          set -euo pipefail
          set -a; . ./.env.test; set +a
          AWS_ACCESS_KEY_ID="$AWS_MANAGEMENT_ACCESS_KEY_ID" \
          AWS_SECRET_ACCESS_KEY="$AWS_MANAGEMENT_SECRET_ACCESS_KEY" \
          AWS_SESSION_TOKEN="$AWS_MANAGEMENT_SESSION_TOKEN" \
            aws ecr get-login-password --region "$ECR_REGION" \
            | docker login --username AWS --password-stdin "$ECR_REGISTRY"
          # Google: the impersonated service account's short-lived access token.
          GCP_TOKEN=$(GOOGLE_APPLICATION_CREDENTIALS="$GOOGLE_MANAGEMENT_CREDENTIALS_FILE" \
            gcloud auth print-access-token)
          echo "::add-mask::$GCP_TOKEN"
          printf '%s' "$GCP_TOKEN" | docker login -u oauth2accesstoken --password-stdin "https://$GCR_REGISTRY"
          ./scripts/ci-acr-login.sh "$ACR_REGISTRY" "$AZURE_MANAGEMENT_TENANT_ID" \
            "$AZURE_MANAGEMENT_CLIENT_ID" "$AZURE_MANAGEMENT_FEDERATED_TOKEN_FILE"

      # The Dockerfiles copy prebuilt binaries, so emulation only touches the final
      # stages of the non-native architecture.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build and push Lambda image (AWS ECR, linux/arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: infra/test/test-images/lambda
          platforms: linux/arm64
          push: true
          tags: ${{ steps.registries.outputs.aws_lambda_image }}
          provenance: false

      - name: Build and push http-server image (GCP AR + Azure ACR, linux/amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: infra/test/test-images/http-server
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.registries.outputs.gcp_cloudrun_image }}
            ${{ steps.registries.outputs.azure_container_app_image }}
          provenance: false

  test:
    needs: [setup]
    # See `setup` job for why this environment is declared.
    environment: cloud-tests
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: aws-clients
            test_cmd: cargo nextest run -p alien-aws-clients
          - name: gcp-clients
            test_cmd: cargo nextest run -p alien-gcp-clients --features gcp
          - name: azure-clients
            test_cmd: cargo nextest run -p alien-azure-clients
          - name: bindings
            test_cmd: cargo nextest run -p alien-bindings --features local-artifact-registry
          - name: manager-proxy
            test_cmd: cargo nextest run -p alien-manager --test registry_proxy_cloud_test
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - uses: actions/checkout@v7

      - name: Configure git credentials
        run: git config --global url."https://x-access-token:${{ secrets.REPO_ACCESS_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_wrapper: false
          terraform_version: 1.14.5

      - name: Terraform init
        working-directory: infra/test
        run: terraform init
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}

      - name: Generate .env.test
        env:
          TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
          TEST_GCP_MGMT_PROJECT_ID: ${{ vars.TEST_GCP_MGMT_PROJECT_ID }}
        run: |
          echo "::add-mask::$TEST_GCP_MGMT_PROJECT_ID"
          terraform -chdir=infra/test init -input=false
          ./scripts/gen-env-test.sh
          ./scripts/select-e2e-targets.sh \
            --env-file .env.test \
            --aws "${{ inputs.aws_target || 'aws-target-1' }}" \
            --gcp "${{ inputs.gcp_target || 'gcp-target-3' }}" \
            --azure "${{ inputs.azure_target || 'azure-target-1' }}"

      - name: Mask all .env.test values
        run: |
          while IFS= read -r line; do
            [[ "$line" =~ ^#.*$ || -z "$line" ]] && continue
            val="${line#*=}"
            val="${val#\'}" && val="${val%\'}"
            val="${val#\"}" && val="${val%\"}"
            [ -n "$val" ] && echo "::add-mask::$val"
          done < .env.test

      - name: Sign in to the test clouds
        uses: ./.github/actions/cloud-test-credentials

      - name: Install Rust toolchain
        uses: jdx/mise-action@v5
        env:
          MISE_DATA_DIR: ${{ runner.temp }}/mise-rust
        with:
          version: 2026.10.1
          add_shims_to_path: false
          install_args: rust
          cache: false

      - name: Install sccache
        uses: ./.github/actions/setup-sccache

      - uses: taiki-e/install-action@cargo-nextest

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "27.x"
          repo-token: ${{ github.token }}

      # S3-compatible object storage for the Kubernetes storage binding tests
      # (a bucket behind a custom endpoint, as on-prem clusters provide).
      - name: Start S3-compatible store
        if: matrix.name == 'bindings'
        run: |
          printf '%s' '{"identities":[{"name":"alien","credentials":[{"accessKey":"alien","secretKey":"alien-secret"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' > /tmp/s3.json
          docker run -d --name s3 -p 19000:8333 -v /tmp/s3.json:/etc/s3.json \
            chrislusf/seaweedfs server -s3 -s3.config=/etc/s3.json \
            -master.volumeSizeLimitMB=64 -volume.max=100
          for _ in $(seq 1 30); do curl -sf -o /dev/null -X PUT --aws-sigv4 "aws:amz:us-east-1:s3" -u alien:alien-secret http://127.0.0.1:19000/alien-test && break; sleep 2; done
          {
            echo "ALIEN_TEST_S3_COMPATIBLE_ENDPOINT=http://127.0.0.1:19000"
            echo "ALIEN_TEST_S3_COMPATIBLE_ACCESS_KEY_ID=alien"
            echo "ALIEN_TEST_S3_COMPATIBLE_SECRET_ACCESS_KEY=alien-secret"
            echo "ALIEN_TEST_S3_COMPATIBLE_BUCKET=alien-test"
          } >> "$GITHUB_ENV"

      # Third-party test keys go to this step only, never to .env.test. A test that needs one
      # skips with a message when it is not set.
      - run: ${{ matrix.test_cmd }}
        env:
          AXIOM_TOKEN: ${{ secrets.AXIOM_CI_API_KEY }}
          OPENAI_TEST_API_KEY: ${{ secrets.OPENAI_TEST_API_KEY }}
          ANTHROPIC_TEST_API_KEY: ${{ secrets.ANTHROPIC_TEST_API_KEY }}
          DATABRICKS_TEST_WORKSPACE_URL: ${{ secrets.DATABRICKS_TEST_WORKSPACE_URL }}
          DATABRICKS_TEST_CLIENT_ID: ${{ secrets.DATABRICKS_TEST_CLIENT_ID }}
          DATABRICKS_TEST_CLIENT_SECRET: ${{ secrets.DATABRICKS_TEST_CLIENT_SECRET }}
