name: Manager schema qualification

on:
  push:
    branches: [alon/alien-1209-manager-setup-node-identity]

permissions:
  contents: read

concurrency:
  group: manager-schema-qualification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    runs-on: depot-ubuntu-24.04-arm-8
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "6"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install development tools
        uses: jdx/mise-action@v5
        env:
          MISE_DATA_DIR: ${{ runner.temp }}/mise-tools
          MISE_DISABLE_TOOLS: rust
        with:
          version: 2026.10.1
          add_shims_to_path: false
          install_args: node pnpm bun
      - name: Install Rust toolchain
        uses: jdx/mise-action@v5
        env:
          MISE_DATA_DIR: ${{ runner.temp }}/mise-rust
        with:
          version: 2026.10.1
          add_shims_to_path: false
          install_args: rust
          cache: false
      - uses: mozilla-actions/sccache-action@v0.0.11
        continue-on-error: true
        with:
          version: v0.16.0
      - uses: rui314/setup-mold@10ca16bf91dc22e05ebdc935cad9c75ea248f621
        with:
          mold-version: 2.42.1
      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "35.x"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Generate Core packages
        env:
          NODE_OPTIONS: "--max-old-space-size=12288"
        run: pnpm --filter @alienplatform/core generate
      - name: Generate manager Rust SDK inputs
        run: pnpm run generate:manager-rust-sdk
      - name: Validate published binding schemas
        run: node --test client-sdks/manager/scripts/binding-schema.test.mjs
      - name: Capture public schema outputs and provenance
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import pathlib
          import shutil
          import subprocess

          paths = [
              "crates/alien-manager/openapi.json",
              "client-sdks/manager/openapi.json",
              "client-sdks/manager/openapi-3.0.json",
              "client-sdks/manager/rust/openapi-3.0.json",
          ]
          output = pathlib.Path("schema-qualification")
          hashes = {}
          for name in paths:
              source = pathlib.Path(name)
              destination = output / name
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(source, destination)
              hashes[name] = hashlib.sha256(source.read_bytes()).hexdigest()
          subprocess.check_call(["git", "add", "-N", "--", "packages/core/src/generated"])
          patch = subprocess.check_output(["git", "diff", "--binary", "--", "packages/core"])
          (output / "core-generated.patch").write_bytes(patch)
          hashes["core-generated.patch"] = hashlib.sha256(patch).hexdigest()
          core_spec = pathlib.Path("packages/core/openapi.json")
          shutil.copyfile(core_spec, output / "core-openapi.json")
          hashes["core-openapi.json"] = hashlib.sha256(core_spec.read_bytes()).hexdigest()
          core_files = {}
          changed = subprocess.check_output(["git", "diff", "--name-only", "--", "packages/core"], text=True).splitlines()
          for name in changed:
              source = pathlib.Path(name)
              core_files[name] = hashlib.sha256(source.read_bytes()).hexdigest() if source.is_file() else None
          receipt = {
              "source": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "commands": ["pnpm --filter @alienplatform/core generate", "pnpm run generate:manager-rust-sdk", "node --test client-sdks/manager/scripts/binding-schema.test.mjs"],
              "coreGeneratedFiles": core_files,
              "rustc": subprocess.check_output(["rustc", "-Vv"], text=True).strip(),
              "node": subprocess.check_output(["node", "--version"], text=True).strip(),
              "pnpm": subprocess.check_output(["pnpm", "--version"], text=True).strip(),
              "sha256": hashes,
          }
          (output / "receipt.json").write_text(json.dumps(receipt, indent=2) + "\n")
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: manager-schema-qualification-${{ github.sha }}
          path: schema-qualification/
          retention-days: 1
          if-no-files-found: error
