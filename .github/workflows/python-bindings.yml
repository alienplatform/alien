name: Python bindings

# Pull requests do not run this. The merge queue runs the Linux tests when a merge touches the
# bindings, and a nightly run (only when main changed) adds macOS and the release wheels matrix.
on:
  merge_group:
  schedule:
    - cron: "37 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Skips the scheduled run when main has not changed since this workflow last passed on it.
  gate:
    name: Main changed since the last green run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      changed: ${{ steps.gate.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false
      - id: gate
        uses: ./.github/actions/changed-since-last-success

  changes:
    name: Detect Python binding changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      python: ${{ steps.filter.outputs.python }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          base: ${{ github.event.merge_group.base_sha }}
          filters: |
            python:
              - "Cargo.lock"
              - "Cargo.toml"
              - "mise*.toml"
              - "rust-toolchain.toml"
              - "crates/alien-bindings/**"
              - "crates/alien-ai-gateway/**"
              - "crates/alien-core/src/bindings/**"
              - "crates/alien-bindings-python/**"
              - "crates/alien-local/**"
              - "scripts/queue-test-server.py"
              - "examples/python-bindings/**"
              - ".github/workflows/python-bindings.yml"

  test:
    needs: [gate, changes]
    if: >-
      needs.gate.outputs.changed == 'true' &&
      (github.event_name != 'merge_group' || needs.changes.outputs.python == 'true')
    strategy:
      fail-fast: false
      matrix:
        # macOS only nightly and on demand: its minutes are the slow, expensive part.
        os: ${{ fromJSON(github.event_name == 'merge_group' && '["ubuntu-latest"]' || '["ubuntu-latest","macos-15"]') }}
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: jdx/mise-action@v5
        env:
          MISE_DATA_DIR: ${{ runner.temp }}/mise-rust
          MISE_ENV: stable
        with:
          version: 2026.10.1
          add_shims_to_path: false
          install_args: rust
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install test tools
        run: python -m pip install 'maturin>=1.9,<2' 'mypy>=1.18,<2' 'pytest>=8,<10' 'pytest-asyncio>=1,<2' 'redis>=5,<8' 'ruff>=0.13,<1' types-grpcio types-protobuf
      - name: Install protoc for the real local queue owner fixture
        uses: arduino/setup-protoc@v3
        with:
          version: "35.x"
          repo-token: ${{ github.token }}
      - name: Build and install local-provider wheel
        run: |
          maturin build --manifest-path crates/alien-bindings-python/Cargo.toml --no-default-features --features local --out dist
          for wheel in dist/*.whl; do
            python -m pip install --force-reinstall "${wheel}[worker]"
          done
      - name: Check Python sources
        run: |
          ruff check crates/alien-bindings-python/python crates/alien-bindings-python/tests examples/python-bindings
          mypy crates/alien-bindings-python/python examples/python-bindings
          cargo fmt -p alien-bindings-python --check
          cargo clippy -p alien-bindings-python --no-default-features --features local --no-deps -- -D warnings
      - name: Test Python bindings
        run: pytest -q crates/alien-bindings-python/tests

  # The release wheels matrix: nightly and on demand only.
  wheels:
    needs: gate
    if: needs.gate.outputs.changed == 'true' && github.event_name != 'merge_group'
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
            manylinux: "2014"
          - os: ubuntu-24.04-arm
            target: aarch64
            manylinux: "2_28"
          - os: macos-15
            target: aarch64
            manylinux: "off"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: jdx/mise-action@v5
        env:
          MISE_DATA_DIR: ${{ runner.temp }}/mise-rust
          MISE_ENV: stable
        with:
          version: 2026.10.1
          add_shims_to_path: false
          install_args: rust
          cache: false
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          rust-toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --manifest-path crates/alien-bindings-python/Cargo.toml --release --out dist --no-default-features --features all-platforms,platform-sdk
      - uses: actions/upload-artifact@v4
        with:
          name: alienplatform-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error
