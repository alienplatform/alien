name: Tests

# Two tiers share one required check, `All tests passed`:
#
# - Pull requests (draft or ready) and the merge queue run the fast tier: format, lint,
#   typecheck, generated-file drift, `cargo check` of the whole workspace and its tests, and
#   the tests of only the crates the change touches. It runs on GitHub-hosted runners and is
#   meant to finish in a few minutes.
# - The full tier runs nightly (only when main changed since the last green nightly run), at
#   release qualification (`workflow_call` with `full: true`) and on demand
#   (`workflow_dispatch`): every crate's tests, Worker integration, the whole TypeScript suite,
#   the Node addon portability builds, and the Python bindings and TPM suites.
# - Pushes to main do not run this workflow: the nightly run covers main.
# - A pull request with the `ci:full` label tests the whole workspace (RUN_ALL) on every later
#   push. Adding the label starts a run through ci-full-label.yml, whose checks never replace
#   this workflow's `All tests passed`. See README.md.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  workflow_call:
    inputs:
      ref:
        description: Commit to test (default the triggering commit)
        type: string
        default: ""
      full:
        description: Run the full tier on the whole workspace
        type: boolean
        default: true
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR makes the previous run's result useless. Any other run (a merge group, or a
# call from the nightly run, release qualification or a deploy gate) gets a group of its own: the
# commit it tests plus the run, so overlapping calls never cancel each other's pending run.
concurrency:
  group: ci-fast-${{ github.workflow }}-${{ github.event.pull_request.number || format('{0}-{1}', inputs.ref || github.sha, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Skips the scheduled run when main has not changed since this workflow last passed on it.
  gate:
    name: Main changed since the last green run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      changed: ${{ steps.gate.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false
      - id: gate
        uses: ./.github/actions/changed-since-last-success

  pr-conventions:
    name: PR conventions
    needs: gate
    if: >-
      needs.gate.outputs.changed == 'true' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.fork != true)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository with its tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Pull-target next release is newer than the latest release
        run: .github/scripts/check-next-release.sh

      - name: Validate PR title and branch
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BRANCH: ${{ github.head_ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          if ! grep -qE '^(feat|fix|refactor|chore|docs|test|ci|perf|build|revert)(\([^)]+\))?!?: .+' <<< "$TITLE"; then
            echo "::error::PR title must follow Conventional Commits: <type>: <description>"
            echo "  Example: feat: add Azure container deployment support"
            exit 1
          fi
          if [[ "$PR_AUTHOR" != "dependabot[bot]" && "$PR_AUTHOR" != "renovate[bot]" ]] &&
             ! grep -qE '^[a-z0-9][a-z0-9._-]*/alien-[0-9]+-[a-z0-9]+(-[a-z0-9]+)*$' <<< "$BRANCH"; then
            echo "::error::Branch must include its Linear issue, for example: alon/alien-123-azure-containers"
            exit 1
          fi

  changes:
    name: Detect test areas
    needs: pr-conventions
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # Ready (non-draft) pull requests, the merge queue, release pushes and manual runs run the
      # full tier. Draft pull requests run the fast tier only.
      full_tier: ${{ steps.tier.outputs.full_tier }}
      # Manual runs also ignore the path filters and test everything.
      run_all: ${{ steps.tier.outputs.run_all }}
      rust: ${{ steps.filter.outputs.rust }}
      typescript: ${{ steps.filter.outputs.typescript }}
      worker_integration: ${{ steps.filter.outputs.worker_integration }}
      platform_sdk: ${{ steps.filter.outputs.platform_sdk }}
      node_addon: ${{ steps.filter.outputs.node_addon }}
      python: ${{ steps.filter.outputs.python }}
      tpm: ${{ steps.filter.outputs.tpm }}
      rust_mode: ${{ steps.rust_selection.outputs.mode }}
      rust_packages: ${{ steps.rust_selection.outputs.packages }}
      rust_features: ${{ steps.rust_selection.outputs.features }}
      rust_core: ${{ steps.rust_selection.outputs.core }}
      rust_agent: ${{ steps.rust_selection.outputs.agent }}
      rust_test_filter: ${{ steps.rust_selection.outputs.test_filter }}
      ts_filters: ${{ steps.rust_selection.outputs.ts_filters }}
      repo_wide: ${{ steps.rust_selection.outputs.repo_wide }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}

      - name: Select the test tier
        id: tier
        env:
          EVENT: ${{ github.event_name }}
          FULL_INPUT: ${{ inputs.full }}
          # The `ci:full` label on a pull request runs the whole workspace (RUN_ALL).
          FULL_LABEL: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:full') }}
        run: |
          # Pull requests and the merge queue run the fast tier. The nightly run, manual runs
          # and callers that ask for `full` run both tiers on the whole workspace.
          full_tier=false
          run_all=false
          case "$EVENT" in
            workflow_dispatch) full_tier=true; run_all=true ;;
          esac
          if [[ "$FULL_INPUT" == "true" ]]; then
            full_tier=true
            run_all=true
          fi
          if [[ "$FULL_LABEL" == "true" ]]; then
            run_all=true
          fi
          echo "full_tier=$full_tier" >> "$GITHUB_OUTPUT"
          echo "run_all=$run_all" >> "$GITHUB_OUTPUT"
          echo "Tier: full=$full_tier, whole workspace=$run_all ($EVENT)"

      # Pull requests and the merge queue test only the crates they changed (and compile the
      # whole workspace in `Rust check`). Any change outside the packages (other than docs) is
      # only checked there. The nightly run, release qualification and manual runs test the
      # whole workspace.
      - name: Select Rust packages to test
        id: rust_selection
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          QUEUE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          EVENT: ${{ github.event_name }}
          RUN_ALL: ${{ steps.tier.outputs.run_all }}
          # The repo pins a nightly; stable cargo reads the metadata without installing it.
          RUSTUP_TOOLCHAIN: stable
        run: |
          if [[ "$RUN_ALL" == "true" ]] || [[ "$EVENT" != "pull_request" && "$EVENT" != "merge_group" ]]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          flags=(--own-only)
          BASE_SHA="$QUEUE_BASE_SHA"
          if [[ "$EVENT" == "pull_request" ]]; then
            BASE_SHA="$PR_BASE_SHA"
          fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          python3 scripts/affected-rust-packages.py "$BASE_SHA" HEAD "${flags[@]}" >> "$GITHUB_OUTPUT"

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # A merge group compares against the queue's base, as a pull request does.
          base: ${{ github.event.merge_group.base_sha }}
          filters: |
            rust:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'mise*.toml'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              - '.config/hakari.toml'
              - 'crates/**'
              - 'packages/**'
              - 'client-sdks/**'
              - 'examples/**'
              - 'tests/e2e/test-apps/**'
              - '.github/actions/setup-rust/**'
              - '.github/actions/setup-sccache/**'
              - '.github/workflows/ci-fast.yml'
              - '.github/workflows/ci-fork.yml'
              # The image contract tests read the Dockerfiles as text, so a change
              # to one of those is a change this job has to see.
              - 'docker/**'
              # The smoke test qualifies the published images, and its own harness
              # is what proves it fails loudly. Both run in this job.
              - 'scripts/smoke-sandbox-agent*'
            # A dependency bump can break the full client, which workspace builds don't compile.
            platform_sdk:
              - 'client-sdks/platform/rust/**'
              - 'crates/alien-core/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            # Build inputs of the Node addon (Rust changes trigger the job through `rust`).
            node_addon:
              - 'crates/alien-bindings-node/**'
              - 'crates/alien-bindings/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'packages/bindings/package.json'
              - 'packages/bindings/scripts/verify-addon-portability.sh'
              - 'packages/bindings/scripts/build-linux-addon.sh'
              - '.github/actions/setup-zigbuild/**'
              - '.github/workflows/ci-fast.yml'
            # JavaScript inputs of the Worker integration job; Rust changes trigger it through `rust`.
            worker_integration:
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'packages/**'
              - 'examples/package.json'
              - 'examples/pnpm-lock.yaml'
              - 'examples/pnpm-workspace.yaml'
              - 'examples/basic-worker-ts/**'
              - '.github/actions/setup-sccache/**'
              - '.github/workflows/ci-fast.yml'
            python:
              - 'Cargo.lock'
              - 'Cargo.toml'
              - 'mise*.toml'
              - 'rust-toolchain.toml'
              - 'crates/alien-bindings/**'
              - 'crates/alien-ai-gateway/**'
              - 'crates/alien-core/src/bindings/**'
              - 'crates/alien-bindings-python/**'
              - 'crates/alien-local/**'
              - 'scripts/queue-test-server.py'
              - 'examples/python-bindings/**'
              - '.github/workflows/python-bindings.yml'
            tpm:
              - 'crates/alien-cli/src/signing/**'
              - 'crates/alien-cli/src/commands/signing.rs'
              - 'crates/alien-cli/tests/signing_flow.rs'
              - 'crates/alien-manager/src/routes/signing.rs'
              - 'crates/alien-signing/**'
              - '.github/workflows/tpm-device-key.yml'
            typescript:
              - 'mise*.toml'
              - 'rust-toolchain.toml'
              - '.github/actions/setup-sccache/**'
              - '.github/workflows/ci-fast.yml'
              - '.github/workflows/ci-fork.yml'
              # `pnpm format-and-lint` runs Biome from the repository root.
              # Match its source formats repository-wide instead of trying to
              # enumerate every directory that may contain linted files.
              - '**/*.js'
              - '**/*.cjs'
              - '**/*.mjs'
              - '**/*.jsx'
              - '**/*.ts'
              - '**/*.tsx'
              - '**/*.json'
              - '**/*.jsonc'
              - '**/*.css'
              - '**/*.graphql'
              - '**/*.gql'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'biome.json'
              - 'packages/**'
              - 'client-sdks/**'
              - 'examples/**'
              - 'tests/e2e/test-apps/**'
              - 'crates/alien-cli/**'
              - 'crates/alien-deploy-cli/**'
              - 'crates/alien-operator/**'
              - 'crates/alien-bindings-node/**'
              - 'crates/alien-bindings/**'
              - 'crates/alien-build/**'
              # packages/permissions/generated is compiled from this crate. The
              # check that the generated files are committed runs in the
              # TypeScript job, so a Rust-only change here has to select it.
              - 'crates/alien-permissions/**'

  rust:
    name: Rust crates
    needs: [pr-conventions, changes]
    # A pull request that changed only documentation, or only files outside the crates (which
    # `Rust check` still compiles), skips the tests.
    if: >-
      needs.changes.outputs.run_all == 'true' ||
      (needs.changes.outputs.rust == 'true' &&
      (needs.changes.outputs.rust_mode == 'affected' || needs.changes.outputs.rust_mode == 'full'))
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      # Bound peak compiler memory so the runner agent remains responsive
      # while the workspace's large test binaries compile and link. Four jobs
      # fit the 16 GB runner with debug info off.
      CARGO_BUILD_JOBS: "4"
      NEXTEST_TEST_THREADS: "4"
      # Debug info makes linking ~120 test binaries much slower and nothing in CI reads it.
      CARGO_PROFILE_DEV_DEBUG: "0"
      # The packages and features to build and test (see `Select Rust packages to test`).
      RUST_TEST_FILTER: ${{ needs.changes.outputs.rust_test_filter }}
      RUST_SELECTION: >-
        ${{ needs.changes.outputs.rust_mode == 'affected'
        && format('{0}{1}', needs.changes.outputs.rust_packages,
             needs.changes.outputs.rust_features != '' && format(' --features {0}', needs.changes.outputs.rust_features) || '')
        || '--workspace --features alien-manager/openapi,alien-bindings/platform-sdk,alien-client-core/no-retry-delay' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}

      - name: Install development tools
        id: mise
        uses: jdx/mise-action@v5
        env:
          MISE_DATA_DIR: ${{ runner.temp }}/mise-tools
          MISE_DISABLE_TOOLS: rust
        with:
          version: 2026.10.1
          add_shims_to_path: false
          install_args: node pnpm bun
          cache_key: "{{default}}-${{ hashFiles('package.json') }}"

      - name: Cache pnpm dependencies
        uses: actions/setup-node@v7
        with:
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            examples/pnpm-lock.yaml

      - name: Install Rust toolchain
        uses: jdx/mise-action@v5
        env:
          MISE_DATA_DIR: ${{ runner.temp }}/mise-rust
        with:
          version: 2026.10.1
          add_shims_to_path: false
          install_args: rust
          cache: false

      - name: Install Rust targets
        # alien-hooks-runtime's tests build their hooks module for wasm32-wasip1.
        run: rustup target add wasm32-wasip1

      - name: Install sccache
        uses: ./.github/actions/setup-sccache

      - uses: taiki-e/install-action@nextest

      # Rust on aarch64 Linux links with GNU ld by default; mold is much faster.
      - uses: rui314/setup-mold@10ca16bf91dc22e05ebdc935cad9c75ea248f621 # main
        with:
          mold-version: 2.42.1

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "35.x"
          repo-token: ${{ github.token }}

      - name: Install CloudFormation linter
        run: pipx install cfn-lint==1.59.0

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.3
          terraform_wrapper: false

      # The generator tests run `terraform init` in a fresh directory per stack. Serve the
      # providers from a read-only local mirror instead of downloading them each time.
      - name: Terraform provider mirror
        run: |
          scripts/terraform-provider-mirror.sh "$RUNNER_TEMP/terraform-mirror" "$RUNNER_TEMP/terraform.rc"
          echo "TF_CLI_CONFIG_FILE=$RUNNER_TEMP/terraform.rc" >> "$GITHUB_ENV"

      # Generated modules declare `required_version >= 1.9.0`. Terraform before 1.12 evaluates
      # both sides of `&&` and `||`, which the newer Terraform above hides, so the
      # `terraform_1_9` generator tests plan the registered module on the oldest supported one.
      - name: Terraform 1.9 for the generator compatibility tests
        run: |
          case "$(uname -m)" in
            x86_64) TF_ARCH=amd64; TF_SHA256=186e0145f5e5f2eb97cbd785bc78f21bae4ef15119349f6ad4fa535b83b10df8 ;;
            aarch64|arm64) TF_ARCH=arm64; TF_SHA256=f85868798834558239f6148834884008f2722548f84034c9b0f62934b2d73ebb ;;
            *) echo "Unsupported Terraform architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          mkdir -p "$RUNNER_TEMP/terraform-1.9"
          curl -fsSL "https://releases.hashicorp.com/terraform/1.9.8/terraform_1.9.8_linux_${TF_ARCH}.zip" -o "$RUNNER_TEMP/terraform-1.9.zip"
          echo "${TF_SHA256}  $RUNNER_TEMP/terraform-1.9.zip" | sha256sum --check -
          unzip -q "$RUNNER_TEMP/terraform-1.9.zip" -d "$RUNNER_TEMP/terraform-1.9"
          echo "ALIEN_TERRAFORM_1_9_DIR=$RUNNER_TEMP/terraform-1.9" >> "$GITHUB_ENV"

      - uses: azure/setup-helm@v5

      - name: Install kubeconform
        run: |
          case "$(uname -m)" in
            x86_64) KUBECONFORM_ARCH=amd64 ;;
            aarch64|arm64) KUBECONFORM_ARCH=arm64 ;;
            *) echo "Unsupported kubeconform architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          curl -L "https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-${KUBECONFORM_ARCH}.tar.gz" \
            | tar xz kubeconform
          sudo mv kubeconform /usr/local/bin/kubeconform

      # Builds of Linux musl Rust resources run `zig` directly, so it has to be on
      # PATH, which `pip3 install ziglang` does not do.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # The tests build Linux musl images in parallel. Without cargo-zigbuild installed the
      # builder runs `cargo install` in each of them, and one install replaces the binary
      # another build is running ("cargo-zigbuild (deleted)", exit 127).
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2
        with:
          tool: cargo-zigbuild@0.24.1

      - name: Configure git credentials for cargo
        run: git config --global url."https://x-access-token:${{ secrets.REPO_ACCESS_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build TypeScript dependencies for Rust tests
        run: pnpm exec turbo run build --filter=@alienplatform/sdk --filter=@alienplatform/commands

      - name: Install zsh for deployer command tests
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Rust fast tests (non-cloud)
        env:
          AXIOM_OTLP_ENDPOINT: https://api.axiom.co/v1/logs
          AXIOM_TOKEN: ${{ secrets.AXIOM_CI_API_KEY }}
          AXIOM_DATASET: dev
        run: |
          # On pull requests this builds only the affected packages ($RUST_SELECTION); the
          # `Rust check` job then compiles every package so none can rot.
          #
          # Never use `--exclude` here. It drops a package from *compilation*, not just
          # from the test run, so the package rots silently until something else builds
          # it. Skip tests with `--filter-expr` instead: the package still compiles, so
          # a break in it fails this job. `alien-test-server` (the default app for the
          # manually dispatched e2e-cloud workflow, and so not built anywhere else) sat
          # broken behind `--exclude` exactly this way from #169 until ALIEN-335 found it.
          #
          # `alien-test-server` has no Rust unit tests; it is filtered out rather than
          # merely uncovered so that tests added to it later don't start running here by
          # accident — it is exercised by the e2e-cloud workflow against real clouds.
          #
          # One clause per line, joined with spaces into a single nextest filterset, so
          # that a missing or mistyped clause is visible when reading the diff.
          FILTER_CLAUSES=(
            'not package(alien-test-server)'

            # Cloud client and bindings crates: their `tests/` targets only — the unit
            # tests under `src/` still run here. cloud-tests.yml runs these targets
            # with real cloud credentials.
            'and not (package(alien-aws-clients) and kind(test))'
            'and not (package(alien-gcp-clients) and kind(test))'
            'and not (package(alien-azure-clients) and kind(test))'
            'and not (package(alien-bindings) and kind(test))'

            # alien-build integration suites: they build real images, so they need
            # Docker and network access to pull base images.
            'and not binary_id(alien-build::build_integration_tests)'
            'and not binary_id(alien-build::image_shape_tests)'
            'and not binary_id(alien-build::rust_integration_tests)'
            'and not binary_id(alien-build::typescript_integration_tests)'

            # alien-worker-runtime platform transport suites (Lambda, Cloud Run).
            'and not binary_id(alien-worker-runtime::cloudrun)'
            'and not binary_id(alien-worker-runtime::lambda)'

            # alien-test registry suites: e2e-cloud.yml runs them against real clouds.
            'and not binary_id(alien-test::distribution)'
            'and not binary_id(alien-test::pull)'
            'and not binary_id(alien-test::push)'

            # Manager registry proxy against a real cloud registry: cloud-tests.yml.
            'and not binary_id(alien-manager::registry_proxy_cloud_test)'

            # AI gateway suites that hit real model endpoints: they need .env.test creds.
            'and not binary_id(alien-ai-gateway::live_bedrock)'
            'and not binary_id(alien-ai-gateway::live_databricks)'
            'and not binary_id(alien-ai-gateway::live_direct_providers)'
            'and not binary_id(alien-ai-gateway::live_foundry_claude)'
            'and not binary_id(alien-ai-gateway::live_vertex_claude)'

            # Real TypeScript workers through alien build, and the worker runtime driving a real
            # alien-test-app process: the Worker integration job runs them.
            'and not binary_id(alien-local::worker_integration)'
            'and not binary_id(alien-worker-runtime::container_app)'

            # Each test builds an example extension with cargo into one shared target directory, so
            # they wait on each other's build lock: 7-18 min each, about 50 min of this job. The
            # CLI extensions job runs them in parallel with this one.
            'and not binary_id(alien-cli::extensions)'
          )
          # Compile non-default feature coverage in the same unified graph. Running
          # these as later `cargo test` commands adds two serial recompilation tails.
          read -r -a SELECTION <<< "$RUST_SELECTION"
          FILTER="${FILTER_CLAUSES[*]}"
          # Pull requests also select named test targets of dependents (scripts/ci-checks.json):
          # keep only those targets in the packages that were selected for them.
          if [[ -n "$RUST_TEST_FILTER" ]]; then
            FILTER="($FILTER) and ($RUST_TEST_FILTER)"
          fi
          cargo nextest run "${SELECTION[@]}" --no-fail-fast --filter-expr "$FILTER"

      # Workspace-wide builds unify features, so alien-bindings is always built with
      # `local-artifact-registry` there (alien-local turns it on). Check alien-sdk
      # alone so its default features (`local` without the OCI client) keep compiling,
      # and fail if jwt (RUSTSEC-2016-0007, pulled in by oci-client) comes back.
      - name: Check alien-sdk default features
        run: |
          cargo check --locked -p alien-sdk
          if cargo tree --locked -p alien-sdk -e normal,build --target all --prefix none --format '{p}' | grep -E '^(jwt|oci-client) '; then
            echo "::error::alien-sdk default features must not depend on oci-client or jwt"
            exit 1
          fi

      - name: Platform SDK full-api tests
        # The workspace builds the filtered client; tests that need operations outside it
        # (`#![cfg(feature = "full-api")]`) run here, when the SDK changes.
        if: needs.changes.outputs.run_all == 'true' || needs.changes.outputs.platform_sdk == 'true'
        run: cargo test --locked -p alien-platform-api --features full-api

      - name: alien-cli with the full-api client
        # Another crate in a build can turn on `full-api`; alien-cli must still compile
        # against the complete client's type names.
        if: needs.changes.outputs.run_all == 'true' || needs.changes.outputs.platform_sdk == 'true'
        run: cargo check --locked -p alien-cli --features alien-platform-api/full-api

      - name: Egress gateway link tests
        if: needs.changes.outputs.rust_mode != 'affected' || contains(needs.changes.outputs.rust_packages, '-p alien-egress-gateway ') || endsWith(needs.changes.outputs.rust_packages, '-p alien-egress-gateway')
        # The link tests need the gateway's `local` feature, which no other package turns on,
        # and the socket test needs the linked service's address on a local interface.
        run: |
          sudo ip addr add 10.244.7.9/32 dev lo
          cargo nextest run --locked -p alien-egress-gateway --features local --test links --run-ignored all --no-tests=fail

      - name: Local Redis integration tests
        if: needs.changes.outputs.rust_mode != 'affected' || needs.changes.outputs.rust_core == 'true'
        # Runs the pinned Valkey image through the runner's Docker engine: start, password,
        # persistence across restarts, settings changes, recovery and delete. About a minute
        # plus one image pull; the tests are `#[ignore]`d so the default run needs no Docker.
        run: cargo nextest run --locked -p alien-local --test redis_integration --run-ignored only --test-threads 1 --no-tests=fail

      - name: Enable user namespaces for sandbox security tests
        if: needs.changes.outputs.rust_mode != 'affected' || needs.changes.outputs.rust_agent == 'true'
        # These tests exercise nested user namespaces after dropping privileges.
        # Ubuntu's AppArmor restriction can deny uid_map before the assertions run.
        # Change only this disposable CI host; keep every security assertion enabled.
        run: |
          uname -a
          key=kernel.apparmor_restrict_unprivileged_userns
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sysctl "$key"
            sudo sysctl -w "$key=0"
            test "$(sysctl -n "$key")" = 0
          else
            echo "$key is unavailable on this kernel; running all security tests unchanged"
          fi
          sysctl user.max_user_namespaces

      - name: Sandbox agent privileged tests
        if: needs.changes.outputs.rust_mode != 'affected' || needs.changes.outputs.rust_agent == 'true'
        # The agent runs as root and drops to a different uid before every spawn.
        # The sandbox's file and working-directory handling turns on those two
        # identities differing, which nothing running under a single uid can
        # observe, so these are `#[ignore]`d and need root. Built as the runner
        # and only the test binary re-run under sudo: a root `cargo` would leave
        # root-owned artifacts behind for the cache upload.
        run: |
          read -r -a SELECTION <<< "$RUST_SELECTION"
          binary=$(cargo test "${SELECTION[@]}" --no-run --message-format=json \
            | sed -n 's/.*"executable":"\([^"]*privileged-[^"]*\)".*/\1/p' | head -1)
          test -x "$binary"
          # The tests re-execute the agent binary as an unprivileged uid, which
          # needs search permission on every directory above it. The hosted
          # runner's home directory is not world-searchable by default.
          dir=$(dirname "$binary")
          while [ "$dir" != / ]; do
            case "$dir" in /home/*) chmod o+x "$dir" ;; esac
            dir=$(dirname "$dir")
          done
          sudo "$binary" --ignored
          library=$(cargo test --locked -p alien-sandbox-agent --lib --no-run --message-format=json \
            | python3 -c 'import json,sys; print(next(item["executable"] for line in sys.stdin if (item := json.loads(line)).get("executable") and item.get("target", {}).get("kind") == ["lib"]))')
          test -x "$library"
          # The routing check remounts cgroups and changes nftables. The script
          # requires private network/mount/cgroup namespaces before executing it.
          sudo ./scripts/test-sandbox-agent-security.sh "$library"
          # The mount broker against a real kernel NFS server (knfsd in a disposable
          # privileged container); the agent binary provides the mount commands.
          agent=$(cargo build --locked -p alien-sandbox-agent --bin alien-sandbox-agent --message-format=json \
            | python3 -c 'import json,sys; print(next(item["executable"] for line in sys.stdin if (item := json.loads(line)).get("executable") and item.get("target", {}).get("kind") == ["bin"]))')
          test -x "$agent"
          sudo modprobe nfsd
          sudo modprobe nfsv4
          sudo ./scripts/test-sandbox-mount-broker.sh "$library" "$agent"

      - name: Sandbox agent image contract
        if: needs.changes.outputs.rust_mode != 'affected' || needs.changes.outputs.rust_core == 'true'
        # The committed GCP Dockerfiles are generated from the contract, and this
        # compares the two. Named here so a Dockerfile-only change still fails
        # visibly rather than inside the workspace run.
        run: |
          read -r -a SELECTION <<< "$RUST_SELECTION"
          cargo nextest run "${SELECTION[@]}" \
            --filter-expr 'package(alien-core) and kind(lib) and test(sandbox_image)'

      - name: Sandbox agent smoke test harness
        # Its inputs are scripts and Dockerfiles, which always select the full run.
        if: needs.changes.outputs.rust_mode != 'affected'
        # Drives the release smoke test against a stub docker, once per failure
        # mode, asserting each exits nonzero AND annotates. Needs no daemon.
        run: |
          ./scripts/smoke-sandbox-agent.test.sh

      - name: Compiler cache statistics
        if: always()
        run: sccache --show-stats || true

  cli-extensions:
    name: CLI extensions (${{ matrix.part }})
    needs: [pr-conventions, changes]
    # The `alien-cli::extensions` tests, which the Rust crates job skips. They run whenever Rust
    # crates would test alien-cli.
    if: >-
      needs.changes.outputs.run_all == 'true' ||
      (needs.changes.outputs.rust == 'true' &&
      (needs.changes.outputs.rust_mode == 'full' ||
      (needs.changes.outputs.rust_mode == 'affected' &&
      contains(format(' {0} ', needs.changes.outputs.rust_packages), ' -p alien-cli '))))
    # The 19 tests take 1-28 min each and run one at a time on a 4-vCPU hosted runner (each
    # reserves 4 threads; see .config/nextest.toml), after about 8 min of setup. The two longest
    # get a runner each, so neither waits behind other tests; the controller module test alone
    # takes about 36 min with setup. The other 17 (about 46 min) split four ways, about 22 min each.
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: dev zone
            filter: test(=dev_runs_the_zone_with_the_extensions_local_controller_as_a_process)
          - part: controller module
            filter: test(=the_controller_module_is_built_into_the_bundle_and_test_loads_each_import_into_it)
          - { part: 1/4, partition: count:1/4 }
          - { part: 2/4, partition: count:2/4 }
          - { part: 3/4, partition: count:3/4 }
          - { part: 4/4, partition: count:4/4 }
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_BUILD_JOBS: "4"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}

      - name: Install development tools
        id: mise
        uses: jdx/mise-action@v5
        env:
          MISE_DATA_DIR: ${{ runner.temp }}/mise-tools
          MISE_DISABLE_TOOLS: rust
        with:
          version: 2026.10.1
          add_shims_to_path: false
          install_args: node pnpm bun
          cache_key: "{{default}}-${{ hashFiles('package.json') }}"

      - name: Cache pnpm dependencies
        uses: actions/setup-node@v7
        with:
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            examples/pnpm-lock.yaml

      - name: Install Rust toolchain
        uses: jdx/mise-action@v5
        env:
          MISE_DATA_DIR: ${{ runner.temp }}/mise-rust
        with:
          version: 2026.10.1
          add_shims_to_path: false
          install_args: rust
          cache: false

      - name: Install Rust targets
        # alien-hooks-runtime's tests build their hooks module for wasm32-wasip1.
        run: rustup target add wasm32-wasip1

      # No RUSTC_WRAPPER here, unlike the other Rust jobs. The dev zone test runs
      # `alien dev`, which builds the extension controller inside its 1200 s
      # deadline and then waits about 15 more minutes before the zone runs
      # (ALIEN-3134). With the wrapper, that nested build is slow enough to pass
      # the deadline. Put the wrapper back once ALIEN-3134 is fixed.
      - uses: mozilla-actions/sccache-action@v0.0.11
        continue-on-error: true
        with:
          version: v0.16.0

      - uses: taiki-e/install-action@nextest

      # Rust on aarch64 Linux links with GNU ld by default; mold is much faster.
      - uses: rui314/setup-mold@10ca16bf91dc22e05ebdc935cad9c75ea248f621 # main
        with:
          mold-version: 2.42.1

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "35.x"
          repo-token: ${{ github.token }}

      - name: Install CloudFormation linter
        run: pipx install cfn-lint==1.59.0

      # The extension tests render Terraform, which runs only `terraform fmt`: no provider mirror
      # and no Terraform 1.9, which only the generator tests in `Rust crates` use.
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.3
          terraform_wrapper: false

      - uses: azure/setup-helm@v5

      - name: Install kubeconform
        run: |
          case "$(uname -m)" in
            x86_64) KUBECONFORM_ARCH=amd64 ;;
            aarch64|arm64) KUBECONFORM_ARCH=arm64 ;;
            *) echo "Unsupported kubeconform architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          curl -L "https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-${KUBECONFORM_ARCH}.tar.gz" \
            | tar xz kubeconform
          sudo mv kubeconform /usr/local/bin/kubeconform

      # Builds of Linux musl Rust resources run `zig` directly, so it has to be on
      # PATH, which `pip3 install ziglang` does not do.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # The tests build Linux musl images in parallel. Without cargo-zigbuild installed the
      # builder runs `cargo install` in each of them, and one install replaces the binary
      # another build is running ("cargo-zigbuild (deleted)", exit 127).
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2
        with:
          tool: cargo-zigbuild@0.24.1

      - name: Configure git credentials for cargo
        run: git config --global url."https://x-access-token:${{ secrets.REPO_ACCESS_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build TypeScript dependencies for Rust tests
        run: pnpm exec turbo run build --filter=@alienplatform/sdk --filter=@alienplatform/commands

      - name: CLI extension tests
        env:
          FILTER: ${{ matrix.filter || 'not (test(=dev_runs_the_zone_with_the_extensions_local_controller_as_a_process) | test(=the_controller_module_is_built_into_the_bundle_and_test_loads_each_import_into_it))' }}
          PARTITION: ${{ matrix.partition }}
        run: |
          cargo nextest run --locked -p alien-cli --test extensions --no-fail-fast \
            -E "$FILTER" ${PARTITION:+--partition "$PARTITION"}

  typescript:
    name: TypeScript packages and CLIs
    needs: [pr-conventions, changes]
    if: needs.changes.outputs.run_all == 'true' || needs.changes.outputs.typescript == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_BUILD_JOBS: "4"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}

      - uses: dorny/paths-filter@v4
        id: changes
        continue-on-error: true
        with:
          filters: |
            examples:
              - 'mise*.toml'
              - 'rust-toolchain.toml'
              - '.github/workflows/ci-fast.yml'
              - '.github/workflows/ci-fork.yml'
              - 'examples/**'
              - 'packages/**'
              # Changes to the generated Platform client can break the ordinary
              # filtered CLI graph while the workspace's all-features Rust job
              # still succeeds with the full API enabled.
              - 'client-sdks/platform/rust/**'
              - 'crates/alien-cli/**'
              - 'crates/alien-deploy-cli/**'
              - 'crates/alien-operator/**'
              - 'crates/alien-bindings-node/**'
              - 'crates/alien-bindings/**'
              - 'crates/alien-build/**'

      - name: Install development tools
        id: mise
        uses: jdx/mise-action@v5
        env:
          MISE_DATA_DIR: ${{ runner.temp }}/mise-tools
          MISE_DISABLE_TOOLS: rust
        with:
          version: 2026.10.1
          add_shims_to_path: false
          install_args: node pnpm bun
          cache_key: "{{default}}-${{ hashFiles('package.json') }}"

      - name: Cache pnpm dependencies
        uses: actions/setup-node@v7
        with:
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            examples/pnpm-lock.yaml

      - name: Install Rust toolchain
        uses: jdx/mise-action@v5
        env:
          MISE_DATA_DIR: ${{ runner.temp }}/mise-rust
        with:
          version: 2026.10.1
          add_shims_to_path: false
          install_args: rust
          cache: false

      # Rust on aarch64 Linux links with GNU ld by default; mold is much faster.
      - uses: rui314/setup-mold@10ca16bf91dc22e05ebdc935cad9c75ea248f621 # main
        with:
          mold-version: 2.42.1

      - name: Install sccache
        uses: ./.github/actions/setup-sccache

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "35.x"
          repo-token: ${{ github.token }}

      - name: Install CloudFormation linter
        run: pipx install cfn-lint==1.59.0

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.3
          terraform_wrapper: false

      - uses: azure/setup-helm@v5

      - name: Install kubeconform
        run: |
          case "$(uname -m)" in
            x86_64) KUBECONFORM_ARCH=amd64 ;;
            aarch64|arm64) KUBECONFORM_ARCH=arm64 ;;
            *) echo "Unsupported kubeconform architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          curl -L "https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-${KUBECONFORM_ARCH}.tar.gz" \
            | tar xz kubeconform
          sudo mv kubeconform /usr/local/bin/kubeconform

      - name: Install zig (needed by cargo-zigbuild for example builds)
        if: needs.changes.outputs.full_tier == 'true'
        run: pip3 install ziglang

      - name: Configure git credentials for cargo
        run: git config --global url."https://x-access-token:${{ secrets.REPO_ACCESS_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm format-and-lint

      - name: TypeScript typecheck
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
        run: pnpm turbo test:ts --concurrency 3

      # One cargo invocation, so the addon and the CLIs share their dependency builds.
      # `napi build --platform` would only add a generated index.js/index.d.ts, which this
      # crate does not use (see its .gitignore): packages/bindings loads the .node file.
      - name: Build bindings dev addon, CLIs and gateway
        if: needs.changes.outputs.full_tier == 'true'
        env:
          BUILD_CLIS: ${{ steps.changes.outcome != 'success' || steps.changes.outputs.examples == 'true' || needs.changes.outputs.run_all == 'true' }}
        run: |
          packages=(-p alien-bindings-node)
          if [[ "$BUILD_CLIS" == "true" ]]; then
            packages+=(-p alien-cli -p alien-deploy-cli -p alien-operator -p alien-ai-gateway)
          fi
          cargo build "${packages[@]}"
          cp target/debug/libalien_bindings_node.so \
            crates/alien-bindings-node/alien-bindings-node.linux-arm64-gnu.node

      - name: Build package-layout dependencies
        if: needs.changes.outputs.full_tier == 'true'
        run: pnpm --filter @alienplatform/sdk... build

      - name: Validate package layout
        if: needs.changes.outputs.full_tier == 'true'
        run: pnpm validate:package-layout

      - name: TypeScript unit tests
        if: needs.changes.outputs.full_tier == 'true'
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
        run: |
          pnpm --filter @alienplatform/core --filter @alienplatform/permissions --filter @alienplatform/bindings --filter @alienplatform/commands --filter @alienplatform/ai-gateway test

      # Pull requests (the fast tier) test the packages whose inputs changed: their own files,
      # their workspace dependencies, and the generated client and OpenAPI specs for core
      # (scripts/ci-checks.json). The full tier runs the step above for all of them.
      - name: TypeScript tests of changed inputs
        if: needs.changes.outputs.full_tier != 'true' && needs.changes.outputs.run_all != 'true' && needs.changes.outputs.ts_filters != ''
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
          TS_FILTERS: ${{ needs.changes.outputs.ts_filters }}
        run: |
          read -r -a FILTERS <<< "$TS_FILTERS"
          # Build the selected packages' dependencies (for example core's dist) first.
          build=()
          for name in "${FILTERS[@]}"; do
            [[ "$name" == "--filter" ]] || build+=(--filter "$name^...")
          done
          pnpm "${build[@]}" build
          pnpm "${FILTERS[@]}" test

      - name: TypeScript unit tests (every package, label ci:full)
        if: needs.changes.outputs.full_tier != 'true' && needs.changes.outputs.run_all == 'true'
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
        run: |
          pnpm --filter @alienplatform/sdk... build
          pnpm --filter @alienplatform/core --filter @alienplatform/permissions --filter @alienplatform/commands --filter @alienplatform/ai-gateway test

      - name: Build TypeScript packages
        if: needs.changes.outputs.full_tier == 'true' && (steps.changes.outcome != 'success' || steps.changes.outputs.examples == 'true' || needs.changes.outputs.run_all == 'true')
        env:
          NODE_OPTIONS: "--max-old-space-size=12288"
        run: pnpm turbo build && pnpm -C packages/package-layout check

      # The client's build emits without type-checking; this is its one full type-check
      # (about 14 GB of heap, so it runs alone).
      - name: Type-check the generated platform API client
        if: needs.changes.outputs.full_tier == 'true'
        env:
          NODE_OPTIONS: "--max-old-space-size=14336"
        run: pnpm -C client-sdks/platform/typescript typecheck

      # packages/core/tsconfig.json leaves out the one test that imports the generated client
      # (it pulls the client's types into core's check). Type-check it on its own here.
      - name: Type-check the binding serialization test
        if: needs.changes.outputs.full_tier == 'true'
        env:
          NODE_OPTIONS: "--max-old-space-size=14336"
        run: pnpm -C packages/core typecheck:binding-test

      - name: Rust and TypeScript command integration
        if: needs.changes.outputs.full_tier == 'true' && (steps.changes.outcome != 'success' || steps.changes.outputs.examples == 'true' || needs.changes.outputs.run_all == 'true')
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        # Drives the TypeScript command sender/receiver against the Rust command
        # server (test-command-server bin, test-utils feature). Cargo is already
        # set up and warm from the Rust fast-tests step above; the suite fails
        # loudly if the server can't build/start (no silent skip).
        run: pnpm -C packages/commands test:integration

      - name: Install operation compiler generation tools
        run: |
          MISE_DATA_DIR="$RUNNER_TEMP/mise-rust" mise -E release-prepare install rust
          VERSION=$(node -e 'const fs = require("node:fs"); console.log(fs.readFileSync("Cargo.lock", "utf8").match(/name = "wasm-bindgen"\nversion = "([^"]+)"/)[1])')
          MISE_DATA_DIR="$RUNNER_TEMP/mise-rust" mise -E release-prepare exec -- cargo install --locked --version "$VERSION" wasm-bindgen-cli

      - name: Regenerate local TypeScript APIs
        run: pnpm generate

      - name: Check generated files are committed
        # Kubb may change insignificant whitespace between environments. Keep
        # the gate focused on generated behavior and schema content.
        run: git diff --ignore-all-space --exit-code -- packages/core packages/sdk packages/permissions/generated

      - name: Check alien.toml fixtures match the TypeScript SDK
        # The differential fixtures pair each alien.toml with the stack its alien.ts builds.
        # Regenerating expected.json from the SDK source fails the job when an SDK change
        # leaves a snapshot stale.
        run: |
          bash crates/alien-stack-toml/tests/fixtures/regenerate.sh
          git diff --exit-code -- crates/alien-stack-toml/tests/fixtures

      - name: Bare-metal worker example tests
        if: needs.changes.outputs.full_tier == 'true' && (steps.changes.outcome != 'success' || steps.changes.outputs.examples == 'true' || needs.changes.outputs.run_all == 'true')
        # The example is a standalone Cargo workspace, so the repository's cargo commands skip it.
        working-directory: examples/bare-metal-worker
        run: cargo test --locked

  # Tests that read files outside their own package (the install-wait scan over every tracked
  # file, the release workflow checks). They need no Rust build, so they run on every pull
  # request that changes more than documentation. The list is `repo_wide` in scripts/ci-checks.json.
  repo-wide:
    name: Repository-wide checks
    needs: [pr-conventions, changes]
    if: needs.changes.outputs.run_all == 'true' || needs.changes.outputs.repo_wide != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}

      - name: Run the repository-wide checks
        run: python3 scripts/affected-rust-packages.py --run-repo-wide

  rust-check:
    name: Rust check
    needs: [pr-conventions, changes]
    # Whenever the tests cover only some packages (a pull request's changed crates, the merge
    # queue's affected ones), this keeps every package compiling.
    if: >-
      needs.changes.outputs.rust == 'true' &&
      (needs.changes.outputs.rust_mode == 'affected' || needs.changes.outputs.rust_mode == 'check-only')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_BUILD_JOBS: "4"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}

      - name: Install development tools
        uses: jdx/mise-action@v5
        env:
          MISE_DATA_DIR: ${{ runner.temp }}/mise-tools
          MISE_DISABLE_TOOLS: rust
        with:
          version: 2026.10.1
          add_shims_to_path: false
          install_args: node pnpm bun
          cache_key: "{{default}}-${{ hashFiles('package.json') }}"

      - name: Cache pnpm dependencies
        uses: actions/setup-node@v7
        with:
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            examples/pnpm-lock.yaml

      - name: Install Rust toolchain
        uses: jdx/mise-action@v5
        env:
          MISE_DATA_DIR: ${{ runner.temp }}/mise-rust
        with:
          version: 2026.10.1
          add_shims_to_path: false
          install_args: rust
          cache: false

      - name: Install sccache
        uses: ./.github/actions/setup-sccache

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "35.x"
          repo-token: ${{ github.token }}

      - name: Configure git credentials for cargo
        run: git config --global url."https://x-access-token:${{ secrets.REPO_ACCESS_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build TypeScript dependencies for Rust tests
        run: pnpm exec turbo run build --filter=@alienplatform/sdk --filter=@alienplatform/commands

      - name: Check every package and target
        run: cargo check --workspace --all-targets --features alien-manager/openapi,alien-bindings/platform-sdk --locked

  wasm32:
    name: WebAssembly crates
    needs: [pr-conventions, changes]
    # Extension hooks are wasm32-wasip1 modules built against these crates, and
    # nothing else in CI compiles them for that target.
    if: >-
      needs.changes.outputs.run_all == 'true' ||
      (needs.changes.outputs.rust == 'true' && needs.changes.outputs.rust_mode != 'none')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}

      - name: Install Rust toolchain
        uses: jdx/mise-action@v5
        env:
          MISE_DATA_DIR: ${{ runner.temp }}/mise-rust
        with:
          version: 2026.10.1
          add_shims_to_path: false
          install_args: rust
          cache: false

      - name: Install Rust targets
        run: rustup target add wasm32-wasip1

      - name: Configure git credentials for cargo
        run: git config --global url."https://x-access-token:${{ secrets.REPO_ACCESS_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Build for wasm32-wasip1
        env:
          # An extension's workspace lacks this repository's cargo config, so build without its
          # rustflags (`--cfg tokio_unstable`), as `alien extensions build` does.
          CARGO_ENCODED_RUSTFLAGS: ""
        run: >-
          cargo build --locked --target wasm32-wasip1
          -p alien-error -p alien-permission-types -p alien-core -p alien-permissions
          -p alien-cloudformation -p alien-terraform -p alien-operations-sdk -p alien-helm
          -p alien-extension-sdk

  workspace-hack:
    name: Workspace-hack up to date
    needs: [pr-conventions, changes]
    if: needs.changes.outputs.run_all == 'true' || needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}

      - name: Install Rust toolchain
        uses: jdx/mise-action@v5
        env:
          MISE_DATA_DIR: ${{ runner.temp }}/mise-rust
        with:
          version: 2026.10.1
          add_shims_to_path: false
          install_args: rust
          cache: false

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hakari@0.9.39

      - name: Configure git credentials for cargo
        run: git config --global url."https://x-access-token:${{ secrets.REPO_ACCESS_TOKEN }}@github.com/".insteadOf "https://github.com/"

      # The workspace-hack crate unifies dependency features so single-crate
      # cargo commands reuse the workspace build cache. If either command fails,
      # run `cargo hakari generate && cargo hakari manage-deps` and commit the result.
      - name: Check workspace-hack contents
        run: cargo hakari generate --diff

      - name: Check workspace-hack dependencies
        run: cargo hakari manage-deps --dry-run

  worker-integration:
    name: Worker integration
    needs: [pr-conventions, changes]
    # The tested packages, alien-test-app, the addon and the gateway depend on most workspace
    # crates, so any Rust change runs this job; worker_integration adds the JS inputs.
    # Full tier only: ready pull requests, the merge queue, release pushes and manual runs.
    if: >-
      needs.changes.outputs.full_tier == 'true' &&
      (needs.changes.outputs.run_all == 'true' ||
      needs.changes.outputs.rust == 'true' ||
      needs.changes.outputs.worker_integration == 'true')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_BUILD_JOBS: "4"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}

      - name: Install development tools
        uses: jdx/mise-action@v5
        env:
          MISE_DATA_DIR: ${{ runner.temp }}/mise-tools
          MISE_DISABLE_TOOLS: rust
        with:
          version: 2026.10.1
          add_shims_to_path: false
          install_args: node pnpm bun
          cache_key: "{{default}}-${{ hashFiles('package.json') }}"

      - name: Cache pnpm dependencies
        uses: actions/setup-node@v7
        with:
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            examples/pnpm-lock.yaml

      - name: Install Rust toolchain
        uses: jdx/mise-action@v5
        env:
          MISE_DATA_DIR: ${{ runner.temp }}/mise-rust
        with:
          version: 2026.10.1
          add_shims_to_path: false
          install_args: rust
          cache: false

      - uses: taiki-e/install-action@nextest

      - uses: ./.github/actions/setup-sccache

      # Rust on aarch64 Linux links with GNU ld by default; mold is much faster.
      - uses: rui314/setup-mold@10ca16bf91dc22e05ebdc935cad9c75ea248f621 # main
        with:
          mold-version: 2.42.1

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "35.x"
          repo-token: ${{ github.token }}

      - name: Configure git credentials for cargo
        run: git config --global url."https://x-access-token:${{ secrets.REPO_ACCESS_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build TypeScript dependencies for Rust tests
        run: pnpm exec turbo run build --filter=@alienplatform/sdk --filter=@alienplatform/commands

      # alien build stages the bindings addon and AI gateway it finds here. Without them it
      # builds both in release mode inside the first test, which takes minutes. The
      # container_app tests run alien-test-app; without ALIEN_TEST_APP_BIN each test process
      # would build it again.
      - name: Build the bindings addon, AI gateway and test app
        run: |
          cargo build --locked -p alien-bindings-node --lib -p alien-ai-gateway --bin alien-ai-gateway \
            -p alien-test-app --bin alien-test-app
          cp target/debug/libalien_bindings_node.so \
            crates/alien-bindings-node/alien-bindings-node.linux-arm64-gnu.node
          echo "ALIEN_TEST_APP_BIN=$PWD/target/debug/alien-test-app" >> "$GITHUB_ENV"

      - name: Worker integration tests
        run: |
          cargo nextest run --locked -p alien-local -p alien-worker-runtime \
            --test worker_integration --test container_app

      - name: Compiler cache statistics
        if: always()
        run: sccache --show-stats || true

  # The published linux-gnu addons must load on older base images (Debian 12, Amazon Linux 2023,
  # RHEL 9). Builds them the way release.yml does and checks the glibc floor plus a real load.
  node-addon-portability:
    name: Node addon (${{ matrix.triple }}, older glibc)
    needs: [pr-conventions, changes]
    # Full tier only: ready pull requests, the merge queue, release pushes and manual runs.
    if: >-
      needs.changes.outputs.full_tier == 'true' &&
      (needs.changes.outputs.run_all == 'true' ||
      needs.changes.outputs.rust == 'true' ||
      needs.changes.outputs.node_addon == 'true')
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            triple: linux-x64-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            triple: linux-arm64-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}

      - name: Install development tools
        uses: jdx/mise-action@v5
        env:
          MISE_DATA_DIR: ${{ runner.temp }}/mise-tools
          MISE_DISABLE_TOOLS: rust
        with:
          version: 2026.10.1
          add_shims_to_path: false
          install_args: node pnpm
          cache_key: "{{default}}-${{ hashFiles('package.json') }}"

      - name: Install Rust toolchain
        uses: jdx/mise-action@v5
        env:
          MISE_DATA_DIR: ${{ runner.temp }}/mise-rust
        with:
          version: 2026.10.1
          add_shims_to_path: false
          install_args: rust
          cache: false

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "35.x"
          repo-token: ${{ github.token }}

      - name: Configure git credentials for cargo
        run: git config --global url."https://x-access-token:${{ secrets.REPO_ACCESS_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: ./.github/actions/setup-zigbuild

      - name: Build addon
        run: |
          packages/bindings/scripts/build-linux-addon.sh ${{ matrix.target }}

      - name: Verify glibc floor and load on older base images
        run: packages/bindings/scripts/verify-addon-portability.sh "crates/alien-bindings-node/alien-bindings-node.${{ matrix.triple }}.node"

  # Full tier only (full-suite.yml and release qualification), so `All tests passed` covers
  # them there.
  python-bindings:
    name: Python bindings
    needs: [pr-conventions, changes]
    if: >-
      needs.changes.outputs.full_tier == 'true' &&
      (needs.changes.outputs.run_all == 'true' || needs.changes.outputs.python == 'true')
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/python-bindings.yml
    secrets: inherit
    with:
      ref: ${{ inputs.ref }}
      # Release qualification (`full`) adds macOS and the wheels.
      linux_only: ${{ inputs.full != true }}

  tpm-device-key:
    name: TPM device key
    needs: [pr-conventions, changes]
    if: >-
      needs.changes.outputs.full_tier == 'true' &&
      (needs.changes.outputs.run_all == 'true' || needs.changes.outputs.tpm == 'true')
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/tpm-device-key.yml
    secrets: inherit
    with:
      ref: ${{ inputs.ref }}

  all-tests-passed:
    name: All tests passed
    if: >-
      always() &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.fork != true)
    needs: [gate, pr-conventions, changes, rust, cli-extensions, repo-wide, rust-check, wasm32, workspace-hack, typescript, worker-integration, node-addon-portability, python-bindings, tpm-device-key]
    runs-on: ubuntu-latest
    steps:
      - name: Verify every test area
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          FULL_TIER: ${{ needs.changes.outputs.full_tier }}
          RUN_ALL: ${{ needs.changes.outputs.run_all }}
          RUST: ${{ needs.changes.outputs.rust }}
          RUST_MODE: ${{ needs.changes.outputs.rust_mode }}
          TYPESCRIPT: ${{ needs.changes.outputs.typescript }}
          WORKER_INTEGRATION: ${{ needs.changes.outputs.worker_integration }}
          NODE_ADDON: ${{ needs.changes.outputs.node_addon }}
          PYTHON: ${{ needs.changes.outputs.python }}
          TPM: ${{ needs.changes.outputs.tpm }}
          CHANGES: ${{ needs.changes.result }}
          RUST_TESTS: ${{ needs.rust.result }}
          CLI_EXTENSIONS: ${{ needs.cli-extensions.result }}
          RUST_PACKAGES: ${{ needs.changes.outputs.rust_packages }}
          REPO_WIDE: ${{ needs.changes.outputs.repo_wide }}
          REPO_WIDE_RESULT: ${{ needs.repo-wide.result }}
          RUST_CHECK: ${{ needs.rust-check.result }}
          WORKSPACE_HACK: ${{ needs.workspace-hack.result }}
          GATE: ${{ needs.gate.outputs.changed }}
          EVENT: ${{ github.event_name }}
          TYPESCRIPT_TESTS: ${{ needs.typescript.result }}
          WORKER_RESULT: ${{ needs.worker-integration.result }}
          ADDON_RESULT: ${{ needs.node-addon-portability.result }}
          PYTHON_RESULT: ${{ needs.python-bindings.result }}
          TPM_RESULT: ${{ needs.tpm-device-key.result }}
        run: |
          for result in $RESULTS; do
            [[ "$result" == "success" || "$result" == "skipped" ]] || exit 1
          done
          if [[ "$GATE" != "true" ]]; then
            echo "main has not changed since the last green nightly run; nothing to check"
            exit 0
          fi
          # A skipped job is fine only when its path filter says nothing it covers changed.
          # Without this, a failed or skipped `Detect test areas` run would pass as if the
          # suites had run.
          [[ "$CHANGES" == "success" ]] || { echo "::error::Detect test areas did not succeed"; exit 1; }
          need() {
            if [[ "$2" != "success" ]]; then
              echo "::error::$1 was required but its result is '$2'"
              exit 1
            fi
          }
          # Fast tier: every run.
          if [[ "$RUN_ALL" == "true" || ( "$RUST" == "true" && ( "$RUST_MODE" == "affected" || "$RUST_MODE" == "full" ) ) ]]; then
            need "Rust crates" "$RUST_TESTS"
            if [[ "$RUN_ALL" == "true" || "$RUST_MODE" == "full" || " $RUST_PACKAGES " == *" -p alien-cli "* ]]; then
              need "CLI extensions" "$CLI_EXTENSIONS"
            fi
          fi
          if [[ "$RUST" == "true" && ( "$RUST_MODE" == "affected" || "$RUST_MODE" == "check-only" ) ]]; then
            need "Rust check" "$RUST_CHECK"
          fi
          if [[ "$RUN_ALL" == "true" || -n "$REPO_WIDE" ]]; then
            need "Repository-wide checks" "$REPO_WIDE_RESULT"
          fi
          if [[ "$RUN_ALL" == "true" || "$RUST" == "true" ]]; then
            need "Workspace-hack up to date" "$WORKSPACE_HACK"
          fi
          if [[ "$RUN_ALL" == "true" || "$TYPESCRIPT" == "true" ]]; then
            need "TypeScript packages and CLIs" "$TYPESCRIPT_TESTS"
          fi
          # Full tier: nightly, release qualification and manual runs.
          [[ "$FULL_TIER" == "true" ]] || exit 0
          if [[ "$RUN_ALL" == "true" || "$RUST" == "true" || "$WORKER_INTEGRATION" == "true" ]]; then
            need "Worker integration" "$WORKER_RESULT"
          fi
          if [[ "$RUN_ALL" == "true" || "$RUST" == "true" || "$NODE_ADDON" == "true" ]]; then
            need "Node addon portability" "$ADDON_RESULT"
          fi
          if [[ "$RUN_ALL" == "true" || "$PYTHON" == "true" ]]; then
            need "Python bindings" "$PYTHON_RESULT"
          fi
          if [[ "$RUN_ALL" == "true" || "$TPM" == "true" ]]; then
            need "TPM device key" "$TPM_RESULT"
          fi
