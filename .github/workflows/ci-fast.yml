name: Tests

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR makes the previous run's result useless.
concurrency:
  group: ci-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Fall back to local compilation when the shared sccache backend returns a
  # transient error (e.g. webdav 403) instead of failing the whole build.
  SCCACHE_IGNORE_SERVER_IO_ERROR: "1"

jobs:
  pr-conventions:
    name: PR conventions
    if: >-
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.fork != true) &&
      (github.event_name != 'push' ||
      startsWith(github.event.head_commit.message, 'chore: release '))
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title and branch
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BRANCH: ${{ github.head_ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          if ! grep -qE '^(feat|fix|refactor|chore|docs|test|ci|perf|build|revert)(\([^)]+\))?!?: .+' <<< "$TITLE"; then
            echo "::error::PR title must follow Conventional Commits: <type>: <description>"
            echo "  Example: feat: add Azure container deployment support"
            exit 1
          fi
          if [[ "$PR_AUTHOR" != "dependabot[bot]" && "$PR_AUTHOR" != "renovate[bot]" ]] &&
             ! grep -qE '^[a-z0-9][a-z0-9._-]*/alien-[0-9]+-[a-z0-9]+(-[a-z0-9]+)*$' <<< "$BRANCH"; then
            echo "::error::Branch must include its Linear issue, for example: alon/alien-123-azure-containers"
            exit 1
          fi

  changes:
    name: Detect test areas
    needs: pr-conventions
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      typescript: ${{ steps.filter.outputs.typescript }}
      worker_integration: ${{ steps.filter.outputs.worker_integration }}
      platform_sdk: ${{ steps.filter.outputs.platform_sdk }}
      rust_mode: ${{ steps.rust_selection.outputs.mode }}
      rust_packages: ${{ steps.rust_selection.outputs.packages }}
      rust_features: ${{ steps.rust_selection.outputs.features }}
      rust_core: ${{ steps.rust_selection.outputs.core }}
      rust_agent: ${{ steps.rust_selection.outputs.agent }}
    steps:
      - uses: actions/checkout@v7

      # Pull requests build and test only the packages their changes can affect: the changed
      # packages and everything that depends on them. Any change outside the packages (other
      # than docs) runs the whole workspace, as do pushes, merge groups and manual runs.
      - name: Select Rust packages to test
        id: rust_selection
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          # The repo pins a nightly; stable cargo reads the metadata without installing it.
          RUSTUP_TOOLCHAIN: stable
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          python3 scripts/affected-rust-packages.py "$BASE_SHA" HEAD >> "$GITHUB_OUTPUT"

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            rust:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'mise*.toml'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              - 'crates/**'
              - 'packages/**'
              - 'client-sdks/**'
              - 'examples/**'
              - 'tests/e2e/test-apps/**'
              - '.github/actions/setup-rust/**'
              - '.github/workflows/ci-fast.yml'
              - '.github/workflows/ci-fork.yml'
              # The image contract tests read the Dockerfiles as text, so a change
              # to one of those is a change this job has to see.
              - 'docker/**'
              # The smoke test qualifies the published images, and its own harness
              # is what proves it fails loudly. Both run in this job.
              - 'scripts/smoke-sandbox-agent*'
            # A dependency bump can break the full client, which workspace builds don't compile.
            platform_sdk:
              - 'client-sdks/platform/rust/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            # JavaScript inputs of the Worker integration job; Rust changes trigger it through `rust`.
            worker_integration:
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'packages/**'
              - 'examples/package.json'
              - 'examples/pnpm-lock.yaml'
              - 'examples/pnpm-workspace.yaml'
              - 'examples/basic-worker-ts/**'
              - '.github/workflows/ci-fast.yml'
            typescript:
              - 'mise*.toml'
              - 'rust-toolchain.toml'
              - '.github/workflows/ci-fast.yml'
              - '.github/workflows/ci-fork.yml'
              # `pnpm format-and-lint` runs Biome from the repository root.
              # Match its source formats repository-wide instead of trying to
              # enumerate every directory that may contain linted files.
              - '**/*.js'
              - '**/*.cjs'
              - '**/*.mjs'
              - '**/*.jsx'
              - '**/*.ts'
              - '**/*.tsx'
              - '**/*.json'
              - '**/*.jsonc'
              - '**/*.css'
              - '**/*.graphql'
              - '**/*.gql'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'biome.json'
              - 'packages/**'
              - 'client-sdks/**'
              - 'examples/**'
              - 'tests/e2e/test-apps/**'
              - 'crates/alien-cli/**'
              - 'crates/alien-deploy-cli/**'
              - 'crates/alien-operator/**'
              - 'crates/alien-bindings-node/**'
              - 'crates/alien-bindings/**'
              - 'crates/alien-build/**'

  rust:
    name: Rust crates
    needs: [pr-conventions, changes]
    # Skipped when a pull request changed only documentation inside the Rust paths.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (needs.changes.outputs.rust == 'true' && needs.changes.outputs.rust_mode != 'none')
    runs-on: depot-ubuntu-24.04-arm-8
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      # Bound peak compiler memory so the runner agent remains responsive
      # while the workspace's large test binaries compile and link. Six jobs
      # fit the 8-vCPU runner with debug info off.
      CARGO_BUILD_JOBS: "6"
      NEXTEST_TEST_THREADS: "8"
      # Debug info makes linking ~120 test binaries much slower and nothing in CI reads it.
      CARGO_PROFILE_DEV_DEBUG: "0"
      # The packages and features to build and test (see `Select Rust packages to test`).
      RUST_SELECTION: >-
        ${{ needs.changes.outputs.rust_mode == 'affected'
        && format('{0}{1}', needs.changes.outputs.rust_packages,
             needs.changes.outputs.rust_features != '' && format(' --features {0}', needs.changes.outputs.rust_features) || '')
        || '--workspace --features alien-manager/openapi,alien-bindings/platform-sdk' }}

    steps:
      - uses: actions/checkout@v7

      - name: Install development tools
        id: mise
        uses: jdx/mise-action@v5
        env:
          MISE_DATA_DIR: ${{ runner.temp }}/mise-tools
          MISE_DISABLE_TOOLS: rust
        with:
          version: 2026.10.1
          add_shims_to_path: false
          install_args: node pnpm bun
          cache_key: "{{default}}-${{ hashFiles('package.json') }}"

      - name: Cache pnpm dependencies
        uses: actions/setup-node@v7
        with:
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            examples/pnpm-lock.yaml

      - name: Install Rust toolchain
        uses: jdx/mise-action@v5
        env:
          MISE_DATA_DIR: ${{ runner.temp }}/mise-rust
        with:
          version: 2026.10.1
          add_shims_to_path: false
          install_args: rust
          cache: false

      - uses: mozilla-actions/sccache-action@v0.0.11
        continue-on-error: true
        with:
          version: v0.16.0

      - uses: taiki-e/install-action@nextest

      # Rust on aarch64 Linux links with GNU ld by default; mold is much faster.
      - uses: rui314/setup-mold@10ca16bf91dc22e05ebdc935cad9c75ea248f621 # main
        with:
          mold-version: 2.42.1

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "35.x"
          repo-token: ${{ github.token }}

      - name: Install CloudFormation linter
        run: pipx install cfn-lint

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.3
          terraform_wrapper: false

      # The generator tests run `terraform init` in a fresh directory per stack. Serve the
      # providers from a read-only local mirror instead of downloading them each time.
      - name: Terraform provider mirror
        run: |
          scripts/terraform-provider-mirror.sh "$RUNNER_TEMP/terraform-mirror" "$RUNNER_TEMP/terraform.rc"
          echo "TF_CLI_CONFIG_FILE=$RUNNER_TEMP/terraform.rc" >> "$GITHUB_ENV"

      - uses: azure/setup-helm@v5

      - name: Install kubeconform
        run: |
          case "$(uname -m)" in
            x86_64) KUBECONFORM_ARCH=amd64 ;;
            aarch64|arm64) KUBECONFORM_ARCH=arm64 ;;
            *) echo "Unsupported kubeconform architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          curl -L "https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-${KUBECONFORM_ARCH}.tar.gz" \
            | tar xz kubeconform
          sudo mv kubeconform /usr/local/bin/kubeconform

      - name: Install zig (needed by cargo-zigbuild for example builds)
        run: pip3 install ziglang

      - name: Configure git credentials for cargo
        run: git config --global url."https://x-access-token:${{ secrets.REPO_ACCESS_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build TypeScript dependencies for Rust tests
        run: pnpm exec turbo run build --filter=@alienplatform/sdk --filter=@alienplatform/commands

      - name: Rust fast tests (non-cloud)
        env:
          AXIOM_OTLP_ENDPOINT: https://api.axiom.co/v1/logs
          AXIOM_TOKEN: ${{ secrets.AXIOM_CI_API_KEY }}
          AXIOM_DATASET: dev
        run: |
          # On pull requests this builds only the affected packages ($RUST_SELECTION); the
          # `Rust check` job then compiles every package so none can rot.
          #
          # Never use `--exclude` here. It drops a package from *compilation*, not just
          # from the test run, so the package rots silently until something else builds
          # it. Skip tests with `--filter-expr` instead: the package still compiles, so
          # a break in it fails this job. `alien-test-server` (the default app for the
          # manually dispatched e2e-cloud workflow, and so not built anywhere else) sat
          # broken behind `--exclude` exactly this way from #169 until ALIEN-335 found it.
          #
          # `alien-test-server` has no Rust unit tests; it is filtered out rather than
          # merely uncovered so that tests added to it later don't start running here by
          # accident — it is exercised by the e2e-cloud workflow against real clouds.
          #
          # One clause per line, joined with spaces into a single nextest filterset, so
          # that a missing or mistyped clause is visible when reading the diff.
          FILTER_CLAUSES=(
            'not package(alien-test-server)'

            # Cloud client and bindings crates: their `tests/` targets only — the unit
            # tests under `src/` still run here. cloud-tests.yml runs these targets
            # with real cloud credentials.
            # This target uses only signed HTTP requests to a local mock server.
            'and not (package(alien-aws-clients) and kind(test) and not binary_id(alien-aws-clients::aws_ec2_launch_template_tests))'
            'and not (package(alien-gcp-clients) and kind(test))'
            'and not (package(alien-azure-clients) and kind(test))'
            'and not (package(alien-bindings) and kind(test))'

            # alien-build integration suites: they build real images, so they need
            # Docker and network access to pull base images.
            'and not binary_id(alien-build::build_integration_tests)'
            'and not binary_id(alien-build::image_shape_tests)'
            'and not binary_id(alien-build::rust_integration_tests)'
            'and not binary_id(alien-build::typescript_integration_tests)'

            # alien-worker-runtime platform transport suites (Lambda, Cloud Run).
            'and not binary_id(alien-worker-runtime::cloudrun)'
            'and not binary_id(alien-worker-runtime::lambda)'

            # alien-test registry suites: e2e-cloud.yml runs them against real clouds.
            'and not binary_id(alien-test::distribution)'
            'and not binary_id(alien-test::pull)'
            'and not binary_id(alien-test::push)'

            # Manager registry proxy against a real cloud registry: cloud-tests.yml.
            'and not binary_id(alien-manager::registry_proxy_cloud_test)'

            # AI gateway suites that hit real model endpoints: they need .env.test creds.
            'and not binary_id(alien-ai-gateway::live_bedrock)'
            'and not binary_id(alien-ai-gateway::live_databricks)'
            'and not binary_id(alien-ai-gateway::live_direct_providers)'
            'and not binary_id(alien-ai-gateway::live_foundry_claude)'
            'and not binary_id(alien-ai-gateway::live_vertex_claude)'

            # Real TypeScript workers through alien build, and the worker runtime driving a real
            # alien-test-app process: the Worker integration job runs them.
            'and not binary_id(alien-local::worker_integration)'
            'and not binary_id(alien-worker-runtime::container_app)'
          )
          # Compile non-default feature coverage in the same unified graph. Running
          # these as later `cargo test` commands adds two serial recompilation tails.
          read -r -a SELECTION <<< "$RUST_SELECTION"
          cargo nextest run "${SELECTION[@]}" --filter-expr "${FILTER_CLAUSES[*]}"

      - name: Platform SDK full-api tests
        # The workspace builds the filtered client; tests that need operations outside it
        # (`#![cfg(feature = "full-api")]`) run here, when the SDK changes.
        if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.platform_sdk == 'true'
        run: cargo test --locked -p alien-platform-api --features full-api

      - name: Sandbox agent privileged tests
        if: needs.changes.outputs.rust_mode != 'affected' || needs.changes.outputs.rust_agent == 'true'
        # The agent runs as root and drops to a different uid before every spawn.
        # The sandbox's file and working-directory handling turns on those two
        # identities differing, which nothing running under a single uid can
        # observe, so these are `#[ignore]`d and need root. Built as the runner
        # and only the test binary re-run under sudo: a root `cargo` would leave
        # root-owned artifacts behind for the cache upload.
        run: |
          read -r -a SELECTION <<< "$RUST_SELECTION"
          binary=$(cargo test "${SELECTION[@]}" --no-run --message-format=json \
            | sed -n 's/.*"executable":"\([^"]*privileged-[^"]*\)".*/\1/p' | head -1)
          test -x "$binary"
          sudo "$binary" --ignored

      - name: Sandbox agent image contract
        if: needs.changes.outputs.rust_mode != 'affected' || needs.changes.outputs.rust_core == 'true'
        # The committed GCP Dockerfiles are generated from the contract, and this
        # compares the two. Named here so a Dockerfile-only change still fails
        # visibly rather than inside the workspace run.
        run: |
          read -r -a SELECTION <<< "$RUST_SELECTION"
          cargo nextest run "${SELECTION[@]}" \
            --filter-expr 'package(alien-core) and kind(lib) and test(sandbox_image)'

      - name: Sandbox agent smoke test harness
        # Its inputs are scripts and Dockerfiles, which always select the full run.
        if: needs.changes.outputs.rust_mode != 'affected'
        # Drives the release smoke test against a stub docker, once per failure
        # mode, asserting each exits nonzero AND annotates. Needs no daemon.
        run: |
          ./scripts/smoke-sandbox-agent.test.sh

  typescript:
    name: TypeScript packages and CLIs
    needs: [pr-conventions, changes]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.typescript == 'true'
    runs-on: depot-ubuntu-24.04-arm-8
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_BUILD_JOBS: "6"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: changes
        continue-on-error: true
        with:
          filters: |
            examples:
              - 'mise*.toml'
              - 'rust-toolchain.toml'
              - '.github/workflows/ci-fast.yml'
              - '.github/workflows/ci-fork.yml'
              - 'examples/**'
              - 'packages/**'
              # Changes to the generated Platform client can break the ordinary
              # filtered CLI graph while the workspace's all-features Rust job
              # still succeeds with the full API enabled.
              - 'client-sdks/platform/rust/**'
              - 'crates/alien-cli/**'
              - 'crates/alien-deploy-cli/**'
              - 'crates/alien-operator/**'
              - 'crates/alien-bindings-node/**'
              - 'crates/alien-bindings/**'
              - 'crates/alien-build/**'

      - name: Install development tools
        id: mise
        uses: jdx/mise-action@v5
        env:
          MISE_DATA_DIR: ${{ runner.temp }}/mise-tools
          MISE_DISABLE_TOOLS: rust
        with:
          version: 2026.10.1
          add_shims_to_path: false
          install_args: node pnpm bun
          cache_key: "{{default}}-${{ hashFiles('package.json') }}"

      - name: Cache pnpm dependencies
        uses: actions/setup-node@v7
        with:
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            examples/pnpm-lock.yaml

      - name: Install Rust toolchain
        uses: jdx/mise-action@v5
        env:
          MISE_DATA_DIR: ${{ runner.temp }}/mise-rust
        with:
          version: 2026.10.1
          add_shims_to_path: false
          install_args: rust
          cache: false

      # Rust on aarch64 Linux links with GNU ld by default; mold is much faster.
      - uses: rui314/setup-mold@10ca16bf91dc22e05ebdc935cad9c75ea248f621 # main
        with:
          mold-version: 2.42.1

      - uses: mozilla-actions/sccache-action@v0.0.11
        continue-on-error: true
        with:
          version: v0.16.0

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "35.x"
          repo-token: ${{ github.token }}

      - name: Install CloudFormation linter
        run: pipx install cfn-lint

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.3
          terraform_wrapper: false

      - uses: azure/setup-helm@v5

      - name: Install kubeconform
        run: |
          case "$(uname -m)" in
            x86_64) KUBECONFORM_ARCH=amd64 ;;
            aarch64|arm64) KUBECONFORM_ARCH=arm64 ;;
            *) echo "Unsupported kubeconform architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          curl -L "https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-${KUBECONFORM_ARCH}.tar.gz" \
            | tar xz kubeconform
          sudo mv kubeconform /usr/local/bin/kubeconform

      - name: Install zig (needed by cargo-zigbuild for example builds)
        run: pip3 install ziglang

      - name: Configure git credentials for cargo
        run: git config --global url."https://x-access-token:${{ secrets.REPO_ACCESS_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm format-and-lint

      - name: TypeScript typecheck
        env:
          NODE_OPTIONS: "--max-old-space-size=12288"
        run: pnpm test:ts

      # One cargo invocation, so the addon and the CLIs share their dependency builds.
      # `napi build --platform` would only add a generated index.js/index.d.ts, which this
      # crate does not use (see its .gitignore): packages/bindings loads the .node file.
      - name: Build bindings dev addon, CLIs and gateway
        env:
          BUILD_CLIS: ${{ steps.changes.outcome != 'success' || steps.changes.outputs.examples == 'true' || github.event_name == 'workflow_dispatch' }}
        run: |
          packages=(-p alien-bindings-node)
          if [[ "$BUILD_CLIS" == "true" ]]; then
            packages+=(-p alien-cli -p alien-deploy-cli -p alien-operator -p alien-ai-gateway)
          fi
          cargo build "${packages[@]}"
          cp target/debug/libalien_bindings_node.so \
            crates/alien-bindings-node/alien-bindings-node.linux-arm64-gnu.node

      - name: Build package-layout dependencies
        run: pnpm --filter @alienplatform/sdk... build

      - name: Validate package layout
        run: pnpm validate:package-layout

      - name: TypeScript unit tests
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
        run: |
          pnpm --filter @alienplatform/core --filter @alienplatform/permissions --filter @alienplatform/bindings --filter @alienplatform/commands --filter @alienplatform/ai-gateway test

      - name: Build TypeScript packages
        if: steps.changes.outcome != 'success' || steps.changes.outputs.examples == 'true' || github.event_name == 'workflow_dispatch'
        env:
          NODE_OPTIONS: "--max-old-space-size=12288"
        run: pnpm build && pnpm -C packages/package-layout check

      - name: Rust and TypeScript command integration
        if: steps.changes.outcome != 'success' || steps.changes.outputs.examples == 'true' || github.event_name == 'workflow_dispatch'
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        # Drives the TypeScript command sender/receiver against the Rust command
        # server (test-command-server bin, test-utils feature). Cargo is already
        # set up and warm from the Rust fast-tests step above; the suite fails
        # loudly if the server can't build/start (no silent skip).
        run: pnpm -C packages/commands test:integration

      - name: Install operation compiler generation tools
        run: |
          MISE_DATA_DIR="$RUNNER_TEMP/mise-rust" mise -E release-prepare install rust
          VERSION=$(node -e 'const fs = require("node:fs"); console.log(fs.readFileSync("Cargo.lock", "utf8").match(/name = "wasm-bindgen"\nversion = "([^"]+)"/)[1])')
          MISE_DATA_DIR="$RUNNER_TEMP/mise-rust" mise -E release-prepare exec -- cargo install --locked --version "$VERSION" wasm-bindgen-cli

      - name: Regenerate local TypeScript APIs
        run: pnpm generate

      - name: Check generated files are committed
        # Kubb may change insignificant whitespace between environments. Keep
        # the gate focused on generated behavior and schema content.
        run: git diff --ignore-all-space --exit-code -- packages/core packages/sdk packages/permissions/generated

  rust-check:
    name: Rust check
    needs: [pr-conventions, changes]
    # When a pull request tests only its affected packages, this keeps every package compiling.
    if: needs.changes.outputs.rust == 'true' && needs.changes.outputs.rust_mode == 'affected'
    runs-on: depot-ubuntu-24.04-arm-8
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_BUILD_JOBS: "6"
    steps:
      - uses: actions/checkout@v7

      - name: Install development tools
        uses: jdx/mise-action@v5
        env:
          MISE_DATA_DIR: ${{ runner.temp }}/mise-tools
          MISE_DISABLE_TOOLS: rust
        with:
          version: 2026.10.1
          add_shims_to_path: false
          install_args: node pnpm bun
          cache_key: "{{default}}-${{ hashFiles('package.json') }}"

      - name: Cache pnpm dependencies
        uses: actions/setup-node@v7
        with:
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            examples/pnpm-lock.yaml

      - name: Install Rust toolchain
        uses: jdx/mise-action@v5
        env:
          MISE_DATA_DIR: ${{ runner.temp }}/mise-rust
        with:
          version: 2026.10.1
          add_shims_to_path: false
          install_args: rust
          cache: false

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "35.x"
          repo-token: ${{ github.token }}

      - name: Configure git credentials for cargo
        run: git config --global url."https://x-access-token:${{ secrets.REPO_ACCESS_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build TypeScript dependencies for Rust tests
        run: pnpm exec turbo run build --filter=@alienplatform/sdk --filter=@alienplatform/commands

      - name: Check every package and target
        run: cargo check --workspace --all-targets --features alien-manager/openapi,alien-bindings/platform-sdk --locked

  worker-integration:
    name: Worker integration
    needs: [pr-conventions, changes]
    # The tested packages, alien-test-app, the addon and the gateway depend on most workspace
    # crates, so any Rust change runs this job; worker_integration adds the JS inputs.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.rust == 'true' ||
      needs.changes.outputs.worker_integration == 'true'
    runs-on: depot-ubuntu-24.04-arm-8
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_BUILD_JOBS: "6"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7

      - name: Install development tools
        uses: jdx/mise-action@v5
        env:
          MISE_DATA_DIR: ${{ runner.temp }}/mise-tools
          MISE_DISABLE_TOOLS: rust
        with:
          version: 2026.10.1
          add_shims_to_path: false
          install_args: node pnpm bun
          cache_key: "{{default}}-${{ hashFiles('package.json') }}"

      - name: Cache pnpm dependencies
        uses: actions/setup-node@v7
        with:
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            examples/pnpm-lock.yaml

      - name: Install Rust toolchain
        uses: jdx/mise-action@v5
        env:
          MISE_DATA_DIR: ${{ runner.temp }}/mise-rust
        with:
          version: 2026.10.1
          add_shims_to_path: false
          install_args: rust
          cache: false

      - uses: taiki-e/install-action@nextest

      # Rust on aarch64 Linux links with GNU ld by default; mold is much faster.
      - uses: rui314/setup-mold@10ca16bf91dc22e05ebdc935cad9c75ea248f621 # main
        with:
          mold-version: 2.42.1

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "35.x"
          repo-token: ${{ github.token }}

      - name: Configure git credentials for cargo
        run: git config --global url."https://x-access-token:${{ secrets.REPO_ACCESS_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build TypeScript dependencies for Rust tests
        run: pnpm exec turbo run build --filter=@alienplatform/sdk --filter=@alienplatform/commands

      # alien build stages the bindings addon and AI gateway it finds here. Without them it
      # builds both in release mode inside the first test, which takes minutes. The
      # container_app tests run alien-test-app; without ALIEN_TEST_APP_BIN each test process
      # would build it again.
      - name: Build the bindings addon, AI gateway and test app
        run: |
          cargo build --locked -p alien-bindings-node --lib -p alien-ai-gateway --bin alien-ai-gateway \
            -p alien-test-app --bin alien-test-app
          cp target/debug/libalien_bindings_node.so \
            crates/alien-bindings-node/alien-bindings-node.linux-arm64-gnu.node
          echo "ALIEN_TEST_APP_BIN=$PWD/target/debug/alien-test-app" >> "$GITHUB_ENV"

      - name: Worker integration tests
        run: |
          cargo nextest run --locked -p alien-local -p alien-worker-runtime \
            --test worker_integration --test container_app

  all-tests-passed:
    name: All tests passed
    if: >-
      always() &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.fork != true) &&
      (github.event_name != 'push' ||
      startsWith(github.event.head_commit.message, 'chore: release '))
    needs: [pr-conventions, changes, rust, rust-check, typescript, worker-integration]
    runs-on: ubuntu-latest
    steps:
      - name: Verify every test area
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            [[ "$result" == "success" || "$result" == "skipped" ]] || exit 1
          done
