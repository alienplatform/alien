name: Sandbox paired reproduction
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paired:
    runs-on: depot-ubuntu-24.04-arm-8
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "6"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        env:
          MISE_DATA_DIR: ${{ runner.temp }}/mise-rust
        with:
          version: 2026.10.1
          add_shims_to_path: false
          install_args: rust
          cache: false
      - name: Host diagnostics
        run: |
          uname -a
          cat /etc/os-release
          printf 'ImageOS=%s ImageVersion=%s\n' "${ImageOS:-not-provided}" "${ImageVersion:-not-provided}"
          for key in kernel.unprivileged_userns_clone kernel.apparmor_restrict_unprivileged_userns user.max_user_namespaces; do
            sysctl "$key" || true
          done
          docker info --format '{{json .KernelVersion}} {{json .OperatingSystem}} {{json .SecurityOptions}}'
      - name: Compare base and rollout change on the same worker
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin 892d1c0f8001a2b3d1f5a45dc31952076e4a1f83 aee922a22e5bb38c383ff9429858015ee3849869
          export CARGO_TARGET_DIR="$RUNNER_TEMP/agent-target"
          for revision in base head; do
            case "$revision" in
              base) commit=892d1c0f8001a2b3d1f5a45dc31952076e4a1f83 ;;
              head) commit=aee922a22e5bb38c383ff9429858015ee3849869 ;;
            esac
            checkout="$RUNNER_TEMP/agent-$revision"
            git worktree add --detach "$checkout" "$commit"
            (
              cd "$checkout"
              cargo test --locked -p alien-sandbox-agent --lib --no-run --message-format=json > "$RUNNER_TEMP/$revision-build.jsonl"
            )
            binary=$(python3 -c 'import json,sys; print(next(item["executable"] for line in open(sys.argv[1]) if line.startswith("{") and (item := json.loads(line)).get("executable") and item.get("target", {}).get("kind") == ["lib"]))' "$RUNNER_TEMP/$revision-build.jsonl")
            if "$checkout/scripts/test-sandbox-agent-security.sh" "$binary" > "$RUNNER_TEMP/$revision-security.log" 2>&1; then
              status=0
            else
              status=$?
            fi
            cat "$RUNNER_TEMP/$revision-security.log"
            printf '%s\n' "$status" > "$RUNNER_TEMP/$revision-status"
            printf '%s (%s): exit %s\n' "$revision" "$commit" "$status" >> "$GITHUB_STEP_SUMMARY"
          done
          test "$(cat "$RUNNER_TEMP/base-status")" = 0
          test "$(cat "$RUNNER_TEMP/head-status")" = 0
