name: Sandbox runner setup verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paired:
    strategy:
      fail-fast: false
      matrix:
        repetition: [1, 2, 3]
    runs-on: depot-ubuntu-24.04-arm-8
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "6"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        env:
          MISE_DATA_DIR: ${{ runner.temp }}/mise-rust
        with:
          version: 2026.10.1
          add_shims_to_path: false
          install_args: rust
          cache: false
      - name: Host diagnostics
        run: |
          uname -a
          cat /etc/os-release
          printf 'ImageOS=%s ImageVersion=%s\n' "${ImageOS:-not-provided}" "${ImageVersion:-not-provided}"
          for key in kernel.unprivileged_userns_clone kernel.apparmor_restrict_unprivileged_userns user.max_user_namespaces; do
            sysctl "$key" || true
          done
          docker info --format '{{json .KernelVersion}} {{json .OperatingSystem}} {{json .SecurityOptions}}'
      - name: Verify runner setup and security suite
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin alon/alien-2058-enable-ci-user-namespaces
          git checkout --detach FETCH_HEAD
          python3 - <<'PYTHON'
          from pathlib import Path
          text = Path('.github/workflows/ci-fast.yml').read_text()
          step = text.split('      - name: Enable user namespaces for sandbox security tests\n', 1)[1].split('      - name:', 1)[0]
          script = step.split('        run: |\n', 1)[1]
          Path('/tmp/runner-setup.sh').write_text('\n'.join(line[10:] for line in script.splitlines()))
          PYTHON
          bash -e /tmp/runner-setup.sh
          cargo test --locked -p alien-sandbox-agent --lib --no-run --message-format=json > "$RUNNER_TEMP/build.jsonl"
          binary=$(python3 -c 'import json,sys; print(next(item["executable"] for line in open(sys.argv[1]) if line.startswith("{") and (item := json.loads(line)).get("executable") and item.get("target", {}).get("kind") == ["lib"]))' "$RUNNER_TEMP/build.jsonl")
          sudo ./scripts/test-sandbox-agent-security.sh "$binary"
