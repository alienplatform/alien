name: Tests

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Fall back to local compilation when the shared sccache backend returns a
  # transient error (e.g. webdav 403) instead of failing the whole build.
  SCCACHE_IGNORE_SERVER_IO_ERROR: "1"

jobs:
  pr-conventions:
    name: PR conventions
    if: >-
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.fork != true) &&
      (github.event_name != 'push' ||
      startsWith(github.event.head_commit.message, 'chore: release '))
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title and branch
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BRANCH: ${{ github.head_ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          if ! grep -qE '^(feat|fix|refactor|chore|docs|test|ci|perf|build|revert)(\([^)]+\))?!?: .+' <<< "$TITLE"; then
            echo "::error::PR title must follow Conventional Commits: <type>: <description>"
            echo "  Example: feat: add Azure container deployment support"
            exit 1
          fi
          if [[ "$PR_AUTHOR" != "dependabot[bot]" && "$PR_AUTHOR" != "renovate[bot]" ]] &&
             ! grep -qE '^[a-z0-9][a-z0-9._-]*/alien-[0-9]+-[a-z0-9]+(-[a-z0-9]+)*$' <<< "$BRANCH"; then
            echo "::error::Branch must include its Linear issue, for example: alon/alien-123-azure-containers"
            exit 1
          fi

  changes:
    name: Detect test areas
    needs: pr-conventions
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      typescript: ${{ steps.filter.outputs.typescript }}
    steps:
      - uses: actions/checkout@v5

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            rust:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/**'
              - 'crates/**'
              - 'packages/**'
              - 'examples/**'
              - '.github/actions/setup-rust/**'
            typescript:
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'packages/**'
              - 'client-sdks/**'
              - 'examples/**'
              - 'crates/alien-cli/**'
              - 'crates/alien-deploy-cli/**'
              - 'crates/alien-operator/**'
              - 'crates/alien-bindings-node/**'
              - 'crates/alien-bindings/**'
              - 'crates/alien-build/**'

  rust:
    name: Rust crates
    needs: [pr-conventions, changes]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.rust == 'true'
    runs-on: depot-ubuntu-24.04-arm-16
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      # Bound the build/test memory peak: this job's recurring failure mode
      # is the runner agent being starved for memory mid Rust-tests (GitHub
      # reports "runner lost communication" with no logs). Full-width
      # parallelism (16 rustc jobs, then 16 concurrent test binaries — many
      # of which spawn servers and embedded databases) is what spikes it.
      CARGO_BUILD_JOBS: "12"
      NEXTEST_TEST_THREADS: "12"

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 10.11.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            examples/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy

      - uses: mozilla-actions/sccache-action@v0.0.10
        continue-on-error: true
        with:
          version: v0.16.0

      - uses: taiki-e/install-action@nextest

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "35.x"
          repo-token: ${{ github.token }}

      - name: Install CloudFormation linter
        run: pipx install cfn-lint

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.3
          terraform_wrapper: false

      - uses: azure/setup-helm@v5

      - name: Install kubeconform
        run: |
          case "$(uname -m)" in
            x86_64) KUBECONFORM_ARCH=amd64 ;;
            aarch64|arm64) KUBECONFORM_ARCH=arm64 ;;
            *) echo "Unsupported kubeconform architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          curl -L "https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-${KUBECONFORM_ARCH}.tar.gz" \
            | tar xz kubeconform
          sudo mv kubeconform /usr/local/bin/kubeconform

      - name: Install zig (needed by cargo-zigbuild for example builds)
        run: pip3 install ziglang

      - name: Configure git credentials for cargo
        run: git config --global url."https://x-access-token:${{ secrets.REPO_ACCESS_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build TypeScript dependencies for Rust tests
        run: pnpm exec turbo run build --filter=@alienplatform/sdk --filter=@alienplatform/commands

      - name: Rust fast tests (non-cloud)
        env:
          AXIOM_OTLP_ENDPOINT: https://api.axiom.co/v1/logs
          AXIOM_TOKEN: ${{ secrets.AXIOM_CI_API_KEY }}
          AXIOM_DATASET: dev
        run: |
          # Never use `--exclude` here. It drops a package from *compilation*, not just
          # from the test run, so the package rots silently until something else builds
          # it. Skip tests with `--filter-expr` instead: the package still compiles, so
          # a break in it fails this job. `alien-test-server` (the default app for the
          # manually dispatched e2e-cloud workflow, and so not built anywhere else) sat
          # broken behind `--exclude` exactly this way from #169 until ALIEN-335 found it.
          #
          # `alien-test-server` has no Rust unit tests; it is filtered out rather than
          # merely uncovered so that tests added to it later don't start running here by
          # accident — it is exercised by the e2e-cloud workflow against real clouds.
          #
          # One clause per line, joined with spaces into a single nextest filterset, so
          # that a missing or mistyped clause is visible when reading the diff.
          FILTER_CLAUSES=(
            'not package(alien-test-server)'

            # Cloud client and bindings crates: their `tests/` targets only — the unit
            # tests under `src/` still run here. cloud-tests.yml runs these targets
            # with real cloud credentials.
            'and not (package(alien-aws-clients) and kind(test))'
            'and not (package(alien-gcp-clients) and kind(test))'
            'and not (package(alien-azure-clients) and kind(test))'
            'and not (package(alien-bindings) and kind(test))'

            # alien-build integration suites: they build real images, so they need
            # Docker and network access to pull base images.
            'and not binary_id(alien-build::build_integration_tests)'
            'and not binary_id(alien-build::image_shape_tests)'
            'and not binary_id(alien-build::rust_integration_tests)'
            'and not binary_id(alien-build::typescript_integration_tests)'

            # alien-worker-runtime platform transport suites (Lambda, Cloud Run).
            'and not binary_id(alien-worker-runtime::cloudrun)'
            'and not binary_id(alien-worker-runtime::lambda)'

            # alien-test registry suites: e2e-cloud.yml runs them against real clouds.
            'and not binary_id(alien-test::distribution)'
            'and not binary_id(alien-test::pull)'
            'and not binary_id(alien-test::push)'

            # Manager registry proxy against a real cloud registry: cloud-tests.yml.
            'and not binary_id(alien-manager::registry_proxy_cloud_test)'

            # AI gateway suites that hit real model endpoints: they need .env.test creds.
            'and not binary_id(alien-ai-gateway::live_bedrock)'
            'and not binary_id(alien-ai-gateway::live_foundry_claude)'
            'and not binary_id(alien-ai-gateway::live_vertex_claude)'
          )
          cargo nextest run --workspace --filter-expr "${FILTER_CLAUSES[*]}"

      # The steps below cover code behind non-default cargo features, which the
      # workspace run above compiles with default features only.
      - name: Manager OpenAPI security contract
        run: |
          cargo test -p alien-manager --features openapi --lib api::tests::openapi_declares_http_bearer_security_without_dropping_schemas

      - name: Remote bindings tests (non-cloud)
        # `platform-sdk` is not a default feature, so `remote::` is cfg'd out of
        # the workspace run. The cloud client crates' unit tests already run
        # there via the `kind(test)`-only filters.
        run: |
          cargo test -p alien-bindings --features platform-sdk --lib remote::

  typescript:
    name: TypeScript packages and CLIs
    needs: [pr-conventions, changes]
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.typescript == 'true'
    runs-on: depot-ubuntu-24.04-arm-16
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_BUILD_JOBS: "6"
    steps:
      - uses: actions/checkout@v5

      - uses: dorny/paths-filter@v4
        id: changes
        continue-on-error: true
        with:
          filters: |
            examples:
              - 'examples/**'
              - 'packages/**'
              - 'crates/alien-cli/**'
              - 'crates/alien-deploy-cli/**'
              - 'crates/alien-operator/**'
              - 'crates/alien-bindings-node/**'
              - 'crates/alien-bindings/**'
              - 'crates/alien-build/**'

      - uses: pnpm/action-setup@v6
        with:
          version: 10.11.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            examples/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy

      - uses: mozilla-actions/sccache-action@v0.0.10
        continue-on-error: true
        with:
          version: v0.16.0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "35.x"
          repo-token: ${{ github.token }}

      - name: Install CloudFormation linter
        run: pipx install cfn-lint

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.3
          terraform_wrapper: false

      - uses: azure/setup-helm@v5

      - name: Install kubeconform
        run: |
          case "$(uname -m)" in
            x86_64) KUBECONFORM_ARCH=amd64 ;;
            aarch64|arm64) KUBECONFORM_ARCH=arm64 ;;
            *) echo "Unsupported kubeconform architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          curl -L "https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-${KUBECONFORM_ARCH}.tar.gz" \
            | tar xz kubeconform
          sudo mv kubeconform /usr/local/bin/kubeconform

      - name: Install zig (needed by cargo-zigbuild for example builds)
        run: pip3 install ziglang

      - name: Configure git credentials for cargo
        run: git config --global url."https://x-access-token:${{ secrets.REPO_ACCESS_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm format-and-lint

      - name: TypeScript typecheck
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
        run: pnpm test:ts

      - name: Build bindings dev addon
        working-directory: crates/alien-bindings-node
        run: ../../packages/package-layout/node_modules/.bin/napi build --platform

      - name: Build package-layout dependencies
        run: pnpm --filter @alienplatform/sdk... build

      - name: Validate package layout
        run: pnpm validate:package-layout

      - name: TypeScript unit tests
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
        run: |
          pnpm --filter @alienplatform/core --filter @alienplatform/bindings --filter @alienplatform/commands --filter @alienplatform/ai-gateway test

      - name: Build all CLIs
        if: steps.changes.outcome != 'success' || steps.changes.outputs.examples == 'true' || github.event_name == 'workflow_dispatch'
        run: cargo build -p alien-cli -p alien-deploy-cli -p alien-operator

      - name: Build TypeScript packages
        if: steps.changes.outcome != 'success' || steps.changes.outputs.examples == 'true' || github.event_name == 'workflow_dispatch'
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: pnpm build && pnpm -C packages/package-layout check

      - name: Rust and TypeScript command integration
        if: steps.changes.outcome != 'success' || steps.changes.outputs.examples == 'true' || github.event_name == 'workflow_dispatch'
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        # Drives the TypeScript command sender/receiver against the Rust command
        # server (test-command-server bin, test-utils feature). Cargo is already
        # set up and warm from the Rust fast-tests step above; the suite fails
        # loudly if the server can't build/start (no silent skip).
        run: pnpm -C packages/commands test:integration

      - name: Regenerate local TypeScript APIs
        run: pnpm generate

      - name: Check generated files are committed
        # Kubb may change insignificant whitespace between environments. Keep
        # the gate focused on generated behavior and schema content.
        run: git diff --ignore-all-space --exit-code -- packages/core packages/sdk

  all-tests-passed:
    name: All tests passed
    if: >-
      always() &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.fork != true) &&
      (github.event_name != 'push' ||
      startsWith(github.event.head_commit.message, 'chore: release '))
    needs: [pr-conventions, changes, rust, typescript]
    runs-on: ubuntu-latest
    steps:
      - name: Verify every test area
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            [[ "$result" == "success" || "$result" == "skipped" ]] || exit 1
          done
