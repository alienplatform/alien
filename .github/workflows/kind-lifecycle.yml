name: Kind lifecycle

# The Kind compute-pool and Remote Operator lifecycle tests take ~35 min, so they run nightly
# (and only when main changed since the last green run) instead of on every PR push or merge.
# Start this workflow manually on a branch to run them before merging. A failure on main opens
# an issue. A PR that changes this file runs it, so the workflow itself is tested before merge.
# Release qualification calls it too.
on:
  workflow_call:
    inputs:
      ref:
        description: Commit to test (default the triggering commit)
        type: string
        default: ""
  pull_request:
    paths:
      - '.github/workflows/kind-lifecycle.yml'
  workflow_dispatch:

permissions:
  contents: read

# One group per commit and run: overlapping nightly, qualification and gate calls must not cancel
# each other's pending run.
concurrency:
  group: kind-lifecycle-${{ github.workflow }}-${{ inputs.ref || github.sha }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  # Skips the scheduled run when main has not changed since this workflow last passed on it.
  gate:
    name: Main changed since the last green run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      changed: ${{ steps.gate.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false
      - id: gate
        uses: ./.github/actions/changed-since-last-success

  kind-lifecycle:
    name: Kind lifecycle
    needs: gate
    if: needs.gate.outputs.changed == 'true'
    # The tests wait on clusters and rollouts; the smaller runner doubles the compile time, not
    # the price, and nobody waits on a nightly run.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Install Rust toolchain
        uses: jdx/mise-action@v5
        env:
          MISE_DATA_DIR: ${{ runner.temp }}/mise-rust
        with:
          version: 2026.10.1
          add_shims_to_path: false
          install_args: rust
          cache: false

      # Rust on aarch64 Linux links with GNU ld by default; mold is much faster.
      - uses: rui314/setup-mold@10ca16bf91dc22e05ebdc935cad9c75ea248f621 # main
        with:
          mold-version: 2.42.1

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "35.x"
          repo-token: ${{ github.token }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.3
          terraform_wrapper: false

      - uses: azure/setup-helm@v5

      - name: Configure git credentials for cargo
        run: git config --global url."https://x-access-token:${{ secrets.REPO_ACCESS_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Build the Kind test binaries
        run: |
          cargo test --locked -p alien-operator --test dynamic_containers_kind --no-run
          cargo test --locked -p alien-helm --test product_remote_operator_lifecycle --no-run
          cargo test --locked -p alien-helm --test sandbox_rbac_kind --no-run
          cargo test --locked -p alien-helm --test workload_restart_kind --no-run
          cargo test --locked -p alien-helm --lib --no-run
          cargo build --locked -p alien-operator
          cargo test --locked -p alien-infra --features all-platforms --lib kubernetes_broker_kind --no-run
          cargo test --locked -p alien-manager --lib kind_ --no-run
          cargo test --locked -p alien-infra --features all-platforms --test kubernetes_service_account_refresh_kind --no-run

      - name: Start disposable Kubernetes cluster
        uses: helm/kind-action@v1.14.0
        with:
          cluster_name: alien-product-lifecycle

      - name: Kubernetes compute pool dynamic container lifecycle
        env:
          ALIEN_DYNAMIC_KIND_CONTEXT: kind-alien-product-lifecycle
          ALIEN_DYNAMIC_KIND_NAMESPACE: alien-dynamic-compute-ci
        run: |
          export KUBECONFIG="$RUNNER_TEMP/dynamic-compute.kubeconfig"
          kind get kubeconfig --name alien-product-lifecycle > "$KUBECONFIG"
          kubectl create namespace "$ALIEN_DYNAMIC_KIND_NAMESPACE"
          trap 'kubectl delete namespace "$ALIEN_DYNAMIC_KIND_NAMESPACE" --ignore-not-found; rm -f "$KUBECONFIG"' EXIT
          image=docker.io/library/memcached@sha256:9e4de012dc607573052061c0bcb38abc775e1dd59b24e7ac38d1892842094aaf
          docker pull "$image"
          docker tag "$image" docker.io/library/memcached:alien-kind-test
          kind load docker-image docker.io/library/memcached:alien-kind-test --name alien-product-lifecycle
          cargo test --locked -p alien-operator --test dynamic_containers_kind -- \
            --ignored --nocapture --test-threads=1

      - name: Restricted pods, one image mirror and every example stack
        run: |
          npm install --prefix "$RUNNER_TEMP/bun" bun
          ALIEN_BUN="$RUNNER_TEMP/bun/node_modules/.bin/bun" scripts/kind-restricted-pods.sh

      - name: Sandbox chart RBAC on a real API server
        env:
          ALIEN_SANDBOX_RBAC_KIND_CONTEXT: kind-alien-product-lifecycle
        run: |
          # The installs name the `gvisor` runtime class, and the chart's network policy probe
          # (a pre-install hook) runs its pods in it. Kind has no gVisor, so the class maps to
          # runc here: this test checks the chart's RBAC, and the probe already passed on this
          # cluster in the default runtime above.
          trap 'kubectl --context "$ALIEN_SANDBOX_RBAC_KIND_CONTEXT" delete runtimeclass gvisor --ignore-not-found' EXIT
          kubectl --context "$ALIEN_SANDBOX_RBAC_KIND_CONTEXT" apply -f - <<'EOF'
          apiVersion: node.k8s.io/v1
          kind: RuntimeClass
          metadata:
            name: gvisor
          handler: runc
          EOF
          if ! cargo test --locked -p alien-helm --test sandbox_rbac_kind -- \
            --ignored --nocapture --test-threads=1; then
            # The test deletes its namespaces on the way out without waiting; show the probe
            # jobs' pods and logs before they go.
            for namespace in alien-sandbox-rbac-a alien-sandbox-rbac-b alien-sandbox-rbac-c; do
              kubectl --context "$ALIEN_SANDBOX_RBAC_KIND_CONTEXT" -n "$namespace" get jobs,pods,events || true
              kubectl --context "$ALIEN_SANDBOX_RBAC_KIND_CONTEXT" -n "$namespace" logs -l job-name --all-containers --prefix --tail=200 || true
            done
            exit 1
          fi

      - name: Workload restart policy on a real API server
        env:
          ALIEN_WORKLOAD_RESTART_KIND_CONTEXT: kind-alien-product-lifecycle
          ALIEN_WORKLOAD_RESTART_OPERATOR_IMAGE: alien-operator:kind-test
          ALIEN_WORKLOAD_RESTART_FAILING_IMAGE: alien-operator:kind-failing
        run: |
          # The chart's verification Job runs `alien-operator verify-workload-patch-policy`. Build
          # an image of this checkout's binary, and one whose entry point fails (a cluster that
          # does not enforce the policy).
          image_dir="$(mktemp -d)"
          strip --strip-debug -o "$image_dir/alien-operator" target/debug/alien-operator
          printf 'FROM ubuntu:24.04\nCOPY alien-operator /usr/local/bin/alien-operator\nUSER 1000\nENTRYPOINT ["/usr/local/bin/alien-operator"]\n' > "$image_dir/Dockerfile"
          printf 'FROM ubuntu:24.04\nUSER 1000\nENTRYPOINT ["/bin/false"]\n' > "$image_dir/Dockerfile.failing"
          docker build -t alien-operator:kind-test "$image_dir"
          docker build -f "$image_dir/Dockerfile.failing" -t alien-operator:kind-failing "$image_dir"
          kind load docker-image alien-operator:kind-test alien-operator:kind-failing --name alien-product-lifecycle
          cargo test --locked -p alien-helm --test workload_restart_kind -- \
            --ignored --nocapture --test-threads=1 \
            the_cluster_admits a_cluster_wide a_namespaced the_grant_never a_failed_probe
          cargo test --locked -p alien-helm --lib -- \
            --ignored --nocapture --test-threads=1 \
            product_chart_operator_updates

      - name: Kubernetes sandbox sessions on a real API server
        env:
          ALIEN_BROKER_KIND_CONTEXT: kind-alien-broker
          ALIEN_BROKER_KIND_NAMESPACE: alien-broker-kind-ci
          ALIEN_AGENT_BINARY: ${{ github.workspace }}/target/debug/alien-sandbox-agent
        run: |
          # A sandbox agent starts only once its NetworkPolicy drops the cluster API. On a one-node
          # cluster the API server runs on the pod's own node, where the policy does not reach that
          # traffic; on a real cluster it is another host. So these tests get two nodes: the
          # control plane is tainted, and the sandbox pods run on the worker.
          export KUBECONFIG="$RUNNER_TEMP/broker.kubeconfig"
          trap 'kind delete cluster --name alien-broker; rm -f "$KUBECONFIG"' EXIT
          kind create cluster --name alien-broker --wait 120s --config - <<'EOF'
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          nodes:
            - role: control-plane
            - role: worker
          EOF
          kubectl create namespace "$ALIEN_BROKER_KIND_NAMESPACE"
          # The broker functions are driven directly, so the class only has to schedule a pod.
          kubectl apply -f - <<'EOF'
          apiVersion: node.k8s.io/v1
          kind: RuntimeClass
          metadata:
            name: alien-kind-runc
          handler: runc
          EOF
          docker pull alpine:3.20
          kind load docker-image alpine:3.20 --name alien-broker
          # The preview check runs the real agent in a pod.
          cargo build --locked -p alien-sandbox-agent
          cargo test --locked -p alien-infra --features all-platforms --lib kubernetes_broker_kind -- \
            --ignored --nocapture --test-threads=1

      - name: Helm rollback and first-install recovery reported to the manager
        run: |
          cargo test --locked -p alien-manager --lib kind_ -- \
            --ignored --nocapture --test-threads=1

      - name: A Helm-owned ServiceAccount that disappears fails the health check at once
        env:
          KIND_CONTEXT: kind-alien-product-lifecycle
        run: |
          cargo test --locked -p alien-infra --features all-platforms \
            --test kubernetes_service_account_refresh_kind -- --ignored --nocapture

      - name: Product Remote Operator Helm and Terraform lifecycle
        env:
          ALIEN_RUN_PRODUCT_LIFECYCLE_E2E: "1"
        run: |
          cargo test --locked -p alien-helm --test product_remote_operator_lifecycle -- \
            --ignored --nocapture --test-threads=1

  report-failure:
    name: Report a failure on main
    needs: kind-lifecycle
    if: failure() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          title="Kind lifecycle tests are failing on main"
          body="Run: $RUN_URL (commit $SHA)"
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [[ -n "$number" ]]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --label bug --body "$body"
          fi
