name: Kind lifecycle

# The Kind compute-pool and Remote Operator lifecycle tests take ~35 min, so they
# run after merge instead of on every PR push. Start this workflow manually on a
# branch to run them before merging. A failure on main opens an issue. A PR that
# changes this file runs it, so the workflow itself is tested before merge.
on:
  pull_request:
    paths:
      - '.github/workflows/kind-lifecycle.yml'
  push:
    branches: [main]
    paths:
      - 'crates/alien-core/**'
      - 'crates/alien-helm/**'
      - 'crates/alien-infra/**'
      - 'crates/alien-operator/**'
      - 'crates/alien-terraform/**'
      - '.github/workflows/kind-lifecycle.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kind-lifecycle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  kind-lifecycle:
    name: Kind lifecycle
    runs-on: depot-ubuntu-24.04-arm-8
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: jdx/mise-action@v5
        env:
          MISE_DATA_DIR: ${{ runner.temp }}/mise-rust
        with:
          version: 2026.10.1
          add_shims_to_path: false
          install_args: rust
          cache: false

      # Rust on aarch64 Linux links with GNU ld by default; mold is much faster.
      - uses: rui314/setup-mold@10ca16bf91dc22e05ebdc935cad9c75ea248f621 # main
        with:
          mold-version: 2.42.1

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "35.x"
          repo-token: ${{ github.token }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.3
          terraform_wrapper: false

      - uses: azure/setup-helm@v5

      - name: Configure git credentials for cargo
        run: git config --global url."https://x-access-token:${{ secrets.REPO_ACCESS_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Build the Kind test binaries
        run: |
          cargo test --locked -p alien-operator --test dynamic_containers_kind --no-run
          cargo test --locked -p alien-helm --test product_remote_operator_lifecycle --no-run
          cargo test --locked -p alien-helm --test sandbox_allow_egress_kind --no-run
          cargo test --locked -p alien-helm --test sandbox_rbac_kind --no-run
          cargo test --locked -p alien-infra --features all-platforms --lib kubernetes_broker_kind --no-run

      # A second disposable cluster, deleted before the main one starts. Kind's kindnet enforces
      # NetworkPolicy, so this cluster replaces it with a CNI that only wires pods: the node
      # image's own ptp and host-local plugins, with no policy controller (like EKS VPC CNI with
      # network policy turned off).
      - name: Sandbox allow egress is refused where NetworkPolicy is not enforced
        env:
          ALIEN_RUN_ALLOW_EGRESS_KIND_E2E: "1"
        run: |
          kind="$RUNNER_TEMP/kind-v0.32.0"
          curl -fsSLo "$kind" https://github.com/kubernetes-sigs/kind/releases/download/v0.32.0/kind-linux-arm64
          echo "b92cd615e97585de8ddade28ed5cd7feb4248d717c233eea5b03c37298900f5d  $kind" | sha256sum -c -
          chmod +x "$kind"
          cluster=alien-allow-egress-unenforced
          export KUBECONFIG="$RUNNER_TEMP/$cluster.kubeconfig"
          trap '"$kind" delete cluster --name "$cluster"; rm -f "$KUBECONFIG"' EXIT
          cat > "$RUNNER_TEMP/$cluster.yaml" <<'EOF'
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          networking:
            disableDefaultCNI: true
            podSubnet: 10.244.0.0/16
          EOF
          cat > "$RUNNER_TEMP/10-ptp.conflist" <<'EOF'
          {
            "cniVersion": "1.0.0",
            "name": "ptp",
            "plugins": [
              {
                "type": "ptp",
                "ipMasq": true,
                "ipam": {
                  "type": "host-local",
                  "ranges": [[{ "subnet": "10.244.0.0/24" }]],
                  "routes": [{ "dst": "0.0.0.0/0" }]
                }
              },
              { "type": "portmap", "capabilities": { "portMappings": true } }
            ]
          }
          EOF
          "$kind" create cluster --name "$cluster" --config "$RUNNER_TEMP/$cluster.yaml"
          docker cp "$RUNNER_TEMP/10-ptp.conflist" "$cluster-control-plane:/etc/cni/net.d/10-ptp.conflist"
          kubectl wait --for=condition=Ready node --all --timeout=180s
          kubectl --namespace kube-system rollout status deployment/coredns --timeout=180s
          cargo test --locked -p alien-helm --test sandbox_allow_egress_kind -- \
            --ignored --nocapture --test-threads=1 --exact \
            allow_egress_install_is_refused_where_network_policy_is_not_enforced

      - name: Start disposable Kubernetes cluster
        uses: helm/kind-action@v1.14.0
        with:
          cluster_name: alien-product-lifecycle

      - name: Sandbox allow egress proceeds where NetworkPolicy is enforced
        env:
          ALIEN_RUN_ALLOW_EGRESS_KIND_E2E: "1"
        run: |
          cargo test --locked -p alien-helm --test sandbox_allow_egress_kind -- \
            --ignored --nocapture --test-threads=1 --exact \
            allow_egress_install_proceeds_where_network_policy_is_enforced

      - name: Kubernetes compute pool dynamic container lifecycle
        env:
          ALIEN_DYNAMIC_KIND_CONTEXT: kind-alien-product-lifecycle
          ALIEN_DYNAMIC_KIND_NAMESPACE: alien-dynamic-compute-ci
        run: |
          export KUBECONFIG="$RUNNER_TEMP/dynamic-compute.kubeconfig"
          kind get kubeconfig --name alien-product-lifecycle > "$KUBECONFIG"
          kubectl create namespace "$ALIEN_DYNAMIC_KIND_NAMESPACE"
          trap 'kubectl delete namespace "$ALIEN_DYNAMIC_KIND_NAMESPACE" --ignore-not-found; rm -f "$KUBECONFIG"' EXIT
          image=docker.io/library/memcached@sha256:9e4de012dc607573052061c0bcb38abc775e1dd59b24e7ac38d1892842094aaf
          docker pull "$image"
          docker tag "$image" docker.io/library/memcached:alien-kind-test
          kind load docker-image docker.io/library/memcached:alien-kind-test --name alien-product-lifecycle
          cargo test --locked -p alien-operator --test dynamic_containers_kind -- \
            --ignored --nocapture --test-threads=1

      - name: Sandbox chart RBAC on a real API server
        env:
          ALIEN_SANDBOX_RBAC_KIND_CONTEXT: kind-alien-product-lifecycle
        run: |
          cargo test --locked -p alien-helm --test sandbox_rbac_kind -- \
            --ignored --nocapture --test-threads=1

      - name: Kubernetes sandbox sessions on a real API server
        env:
          ALIEN_BROKER_KIND_CONTEXT: kind-alien-product-lifecycle
          ALIEN_BROKER_KIND_NAMESPACE: alien-broker-kind-ci
          ALIEN_AGENT_BINARY: ${{ github.workspace }}/target/debug/alien-sandbox-agent
        run: |
          kubectl create namespace "$ALIEN_BROKER_KIND_NAMESPACE"
          trap 'kubectl delete namespace "$ALIEN_BROKER_KIND_NAMESPACE" --ignore-not-found; kubectl delete runtimeclass alien-kind-runc --ignore-not-found' EXIT
          # The broker functions are driven directly, so the class only has to schedule a pod.
          kubectl apply -f - <<'EOF'
          apiVersion: node.k8s.io/v1
          kind: RuntimeClass
          metadata:
            name: alien-kind-runc
          handler: runc
          EOF
          docker pull alpine:3.20
          kind load docker-image alpine:3.20 --name alien-product-lifecycle
          # The preview check runs the real agent in a pod.
          cargo build --locked -p alien-sandbox-agent
          cargo test --locked -p alien-infra --features all-platforms --lib kubernetes_broker_kind -- \
            --ignored --nocapture --test-threads=1

      - name: Product Remote Operator Helm and Terraform lifecycle
        env:
          ALIEN_RUN_PRODUCT_LIFECYCLE_E2E: "1"
        run: |
          cargo test --locked -p alien-helm --test product_remote_operator_lifecycle -- \
            --ignored --nocapture --test-threads=1

  report-failure:
    name: Report a failure on main
    needs: kind-lifecycle
    if: failure() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          title="Kind lifecycle tests are failing on main"
          body="Run: $RUN_URL (commit $SHA)"
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [[ -n "$number" ]]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --label bug --body "$body"
          fi
