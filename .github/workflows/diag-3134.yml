# Temporary diagnostic for ALIEN-3134; not for merge.
name: Diagnose alien dev wait

on:
  pull_request:

permissions:
  contents: read

env:
  SCCACHE_IGNORE_SERVER_IO_ERROR: "1"

jobs:
  dev-wait:
    name: dev wait (${{ matrix.leg }})
    strategy:
      fail-fast: false
      matrix:
        leg: [alone]
    runs-on: depot-ubuntu-24.04-arm-8
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      CARGO_BUILD_JOBS: "6"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7

      - name: Install development tools
        id: mise
        uses: jdx/mise-action@v5
        env:
          MISE_DATA_DIR: ${{ runner.temp }}/mise-tools
          MISE_DISABLE_TOOLS: rust
        with:
          version: 2026.10.1
          add_shims_to_path: false
          install_args: node pnpm bun
          cache_key: "{{default}}-${{ hashFiles('package.json') }}"

      - name: Cache pnpm dependencies
        uses: actions/setup-node@v7
        with:
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            examples/pnpm-lock.yaml

      - name: Install Rust toolchain
        uses: jdx/mise-action@v5
        env:
          MISE_DATA_DIR: ${{ runner.temp }}/mise-rust
        with:
          version: 2026.10.1
          add_shims_to_path: false
          install_args: rust
          cache: false

      - name: Install Rust targets
        # alien-hooks-runtime's tests build their hooks module for wasm32-wasip1.
        run: rustup target add wasm32-wasip1

      - uses: mozilla-actions/sccache-action@v0.0.11
        continue-on-error: true
        with:
          version: v0.16.0

      - uses: taiki-e/install-action@nextest

      # Rust on aarch64 Linux links with GNU ld by default; mold is much faster.
      - uses: rui314/setup-mold@10ca16bf91dc22e05ebdc935cad9c75ea248f621 # main
        with:
          mold-version: 2.42.1

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "35.x"
          repo-token: ${{ github.token }}

      - name: Install CloudFormation linter
        run: pipx install cfn-lint==1.59.0

      # The extension tests render Terraform, which runs only `terraform fmt`: no provider mirror
      # and no Terraform 1.9, which only the generator tests in `Rust crates` use.
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.3
          terraform_wrapper: false

      - uses: azure/setup-helm@v5

      - name: Install kubeconform
        run: |
          case "$(uname -m)" in
            x86_64) KUBECONFORM_ARCH=amd64 ;;
            aarch64|arm64) KUBECONFORM_ARCH=arm64 ;;
            *) echo "Unsupported kubeconform architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          curl -L "https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-${KUBECONFORM_ARCH}.tar.gz" \
            | tar xz kubeconform
          sudo mv kubeconform /usr/local/bin/kubeconform

      # Builds of Linux musl Rust resources run `zig` directly, so it has to be on
      # PATH, which `pip3 install ziglang` does not do.
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Configure git credentials for cargo
        run: git config --global url."https://x-access-token:${{ secrets.REPO_ACCESS_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build TypeScript dependencies for Rust tests
        run: pnpm exec turbo run build --filter=@alienplatform/sdk --filter=@alienplatform/commands

      - name: Tools on PATH before the tests
        run: ls ~/.cargo/bin; which cargo-zigbuild aarch64-linux-musl-gcc zig || true; nproc

      - name: CLI extension tests (diagnostic)
        env:
          ALIEN_LOG: alien_cli=info,alien_build=info,alien_manager=info,alien_infra=info
          ALIEN_LOG_FILE: ${{ runner.temp }}/alien.log
        run: |
          if [ "${{ matrix.leg }}" = alone ]; then
            cargo nextest run --locked -p alien-cli --test extensions --no-fail-fast -E 'test(dev_runs_the_zone_with_the_extensions_local_controller_as_a_process)'
          else
            cargo nextest run --locked -p alien-cli --test extensions --no-fail-fast --partition count:3/3
          fi

      - name: Alien log
        if: always()
        run: grep -v '^\s*$' "$RUNNER_TEMP/alien.log" | cut -c1-400 || true
