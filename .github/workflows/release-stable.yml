name: Publish stable release

on:
  workflow_dispatch:
    inputs:
      qualification_run_id:
        description: Resume from a prior stable run with successful qualification jobs
        type: string
        required: false
        default: ""

concurrency:
  group: publish-stable-release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  resolve:
    runs-on: depot-ubuntu-24.04-arm
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      version: ${{ steps.release.outputs.version }}
      qualification_run_id: ${{ steps.release.outputs.qualification_run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve unreleased version commit
        id: release
        env:
          GH_TOKEN: ${{ secrets.REPO_ACCESS_TOKEN }}
          RESUME_RUN_ID: ${{ inputs.qualification_run_id }}
        run: |
          VERSION=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if git rev-parse --verify --quiet "refs/tags/v${VERSION}" >/dev/null; then
            echo "::error::v${VERSION} is already published"
            exit 1
          fi

          if [ -n "$RESUME_RUN_ID" ]; then
            if ! [[ "$RESUME_RUN_ID" =~ ^[0-9]+$ ]]; then
              echo "::error::Qualification run ID must be numeric"
              exit 1
            fi
            prior_run=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${RESUME_RUN_ID}")
            if ! jq -e '
              .path == ".github/workflows/release-stable.yml" and
              .event == "workflow_dispatch" and
              .head_branch == "main" and
              .status == "completed"
            ' <<< "$prior_run" >/dev/null; then
              echo "::error::Resume requires a completed stable release run on main"
              exit 1
            fi
            RELEASE_COMMIT=$(jq -r '.head_sha' <<< "$prior_run")
            if ! git merge-base --is-ancestor "$RELEASE_COMMIT" HEAD; then
              echo "::error::Qualified commit is not an ancestor of main"
              exit 1
            fi
            qualified_version=$(git show "${RELEASE_COMMIT}:Cargo.toml" |
              sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p')
            if [ "$qualified_version" != "$VERSION" ]; then
              echo "::error::Qualified commit has version ${qualified_version}, expected ${VERSION}"
              exit 1
            fi
            qualified_jobs=$(gh api --paginate --slurp \
              "/repos/${GITHUB_REPOSITORY}/actions/runs/${RESUME_RUN_ID}/jobs?per_page=100" |
              jq '[.[] | .jobs[] | select(.name | startswith("qualify /"))]')
            if ! jq -e '
              (length > 0) and
              (any(.[]; .name == "qualify / prepare" and .conclusion == "success")) and
              (any(.[]; .name == "qualify / qualify-github-release" and .conclusion == "success")) and
              (all(.[]; .conclusion == "success" or .conclusion == "skipped"))
            ' <<< "$qualified_jobs" >/dev/null; then
              echo "::error::Prior qualification jobs did not all pass"
              exit 1
            fi
            echo "Resuming v${VERSION} from qualified run ${RESUME_RUN_ID} at ${RELEASE_COMMIT}"
            echo "qualification_run_id=$RESUME_RUN_ID" >> "$GITHUB_OUTPUT"
          else
            # Publish the reviewed tip and the artifacts qualified by this run.
            RELEASE_COMMIT=$(git rev-parse HEAD)
            echo "qualification_run_id=$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
          fi

          echo "Publishing v${VERSION} from ${RELEASE_COMMIT}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$RELEASE_COMMIT" >> "$GITHUB_OUTPUT"

  qualify:
    needs: resolve
    if: ${{ inputs.qualification_run_id == '' }}
    uses: ./.github/workflows/release.yml
    with:
      mode: stable
      stable_action: qualification
      source_ref: ${{ needs.resolve.outputs.commit }}
    secrets: inherit

  # PyPI trusted publishing requires the protected job in this top-level workflow.
  publish-python:
    needs: [resolve, qualify]
    if: ${{ always() && needs.resolve.result == 'success' && (needs.qualify.result == 'success' || inputs.qualification_run_id != '') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/alienplatform
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download qualified Python wheels
        uses: actions/download-artifact@v8
        with:
          run-id: ${{ needs.resolve.outputs.qualification_run_id }}
          github-token: ${{ secrets.REPO_ACCESS_TOKEN }}
          pattern: qualified-python-*
          path: dist
          merge-multiple: true

      - name: Check qualified wheels against PyPI
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          python - <<'PY'
          import glob
          import hashlib
          import json
          import os
          import urllib.error
          import urllib.request

          wheels = sorted(glob.glob("dist/*.whl"))
          if len(wheels) != 4:
              raise SystemExit(f"expected four qualified wheels, found {wheels}")
          expected = {
              os.path.basename(path): hashlib.sha256(open(path, "rb").read()).hexdigest()
              for path in wheels
          }
          url = f"https://pypi.org/pypi/alienplatform/{os.environ['VERSION']}/json"
          try:
              with urllib.request.urlopen(url) as response:
                  published = json.load(response)
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              published = {"urls": []}
          existing = {
              item["filename"]: item["digests"]["sha256"]
              for item in published["urls"]
              if item["filename"] in expected
          }
          mismatched = {
              name: (expected[name], digest)
              for name, digest in existing.items()
              if expected[name] != digest
          }
          if mismatched:
              raise SystemExit(f"PyPI already contains different wheel contents: {mismatched}")
          print(f"qualified wheels: {sorted(expected)}")
          print(f"already published with matching hashes: {sorted(existing)}")
          PY

      # Resuming a partially completed upload is safe because the preceding
      # checksum check rejects an existing filename with different contents.
      - name: Publish qualified Python wheels
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          packages-dir: dist
          skip-existing: true

      - name: Verify published wheel hashes
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          for attempt in $(seq 1 30); do
            if python - <<'PY'
          import glob
          import hashlib
          import json
          import os
          import urllib.request

          expected = {
              os.path.basename(path): hashlib.sha256(open(path, "rb").read()).hexdigest()
              for path in glob.glob("dist/*.whl")
          }
          with urllib.request.urlopen(
              f"https://pypi.org/pypi/alienplatform/{os.environ['VERSION']}/json"
          ) as response:
              published = json.load(response)
          actual = {item["filename"]: item["digests"]["sha256"] for item in published["urls"]}
          if any(actual.get(name) != digest for name, digest in expected.items()):
              raise SystemExit(1)
          print(f"verified {len(expected)} wheels on PyPI")
          PY
            then
              exit 0
            fi
            echo "Waiting for PyPI metadata propagation (${attempt}/30)..."
            sleep 10
          done
          echo "::error::Published Python wheels did not appear with their qualified hashes"
          exit 1

  publish:
    needs: [resolve, qualify, publish-python]
    if: ${{ always() && needs.resolve.result == 'success' && needs.publish-python.result == 'success' && (needs.qualify.result == 'success' || inputs.qualification_run_id != '') }}
    uses: ./.github/workflows/release.yml
    with:
      mode: stable
      stable_action: publish
      source_ref: ${{ needs.resolve.outputs.commit }}
      qualification_run_id: ${{ needs.resolve.outputs.qualification_run_id }}
    secrets: inherit
