name: Publish stable release

on:
  workflow_dispatch:
    inputs:
      qualification_run_id:
        description: >-
          Resume from a prior stable run with successful qualification jobs, or, when that run
          reused the version pull request's qualification, from that Release qualification run
          (the prior run's summary names it)
        type: string
        required: false
        default: ""

concurrency:
  group: publish-stable-release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  id-token: write
  # The called release workflow records build provenance (actions/attest-build-provenance).
  attestations: write
  # The full test suites that qualification calls (full-suite.yml) declare these.
  actions: read
  pull-requests: read
  issues: write
  checks: write

jobs:
  resolve:
    runs-on: ubuntu-24.04-arm
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      version: ${{ steps.release.outputs.version }}
      qualification_run_id: ${{ steps.release.outputs.qualification_run_id }}
      reuse: ${{ steps.release.outputs.reuse }}
      qualified_commit: ${{ steps.release.outputs.qualified_commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve unreleased version commit
        id: release
        env:
          GH_TOKEN: ${{ secrets.REPO_ACCESS_TOKEN }}
          RESUME_RUN_ID: ${{ inputs.qualification_run_id }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Stable publishing must run from main"
            exit 1
          fi
          VERSION=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if git rev-parse --verify --quiet "refs/tags/v${VERSION}" >/dev/null; then
            echo "::error::v${VERSION} is already published"
            exit 1
          fi

          # The qualification run must have passed every qualification job (the release builds
          # and the full test suites), and its artifacts must still be downloadable.
          verify_qualification_run() {
            local run_id="$1" qualified_commit="$2" qualified_version qualified_jobs available_artifacts required
            qualified_version=$(git show "${qualified_commit}:Cargo.toml" |
              sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p')
            if [ "$qualified_version" != "$VERSION" ]; then
              echo "::error::Qualified commit has version ${qualified_version}, expected ${VERSION}"
              return 1
            fi
            qualified_jobs=$(gh api --paginate --slurp \
              "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" |
              jq '[.[] | .jobs[] | select(.name | startswith("qualify /"))]')
            if ! jq -e '
              (length > 0) and
              (any(.[]; .name == "qualify / prepare" and .conclusion == "success")) and
              (any(.[]; .name == "qualify / qualify-images" and .conclusion == "success")) and
              (any(.[]; .name == "qualify / full-suite / Full suite passed" and .conclusion == "success")) and
              (all(.[]; .conclusion == "success" or .conclusion == "skipped"))
            ' <<< "$qualified_jobs" >/dev/null; then
              echo "::error::Prior qualification jobs did not all pass"
              return 1
            fi
            available_artifacts=$(gh api --paginate --slurp \
              "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100" |
              jq '[.[] | .artifacts[] | select(.expired == false) | .name]')
            for required in \
              addon-darwin-arm64 addon-darwin-x64 \
              addon-linux-arm64-gnu addon-linux-x64-gnu \
              ai-gateway-bin-darwin-arm64 ai-gateway-bin-darwin-x64 \
              ai-gateway-bin-linux-arm64 ai-gateway-bin-linux-x64 \
              binaries-aarch64-apple-darwin binaries-aarch64-unknown-linux-musl \
              binaries-x86_64-pc-windows-msvc binaries-x86_64-unknown-linux-musl \
              qualified-ai-gateway qualified-bindings \
              qualified-client-sdks qualified-crates \
              qualified-image-digests qualified-npm \
              qualified-python-linux-aarch64 qualified-python-linux-x86_64 \
              qualified-python-macos-aarch64 qualified-python-macos-x86_64; do
              if ! jq -e --arg name "$required" 'index($name) != null' \
                <<< "$available_artifacts" >/dev/null; then
                echo "::error::Required qualification artifact ${required} is missing or expired"
                return 1
              fi
            done
          }

          REUSE=false
          if [ -n "$RESUME_RUN_ID" ]; then
            if ! [[ "$RESUME_RUN_ID" =~ ^[0-9]+$ ]]; then
              echo "::error::Qualification run ID must be numeric"
              exit 1
            fi
            prior_run=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${RESUME_RUN_ID}")
            if jq -e '
              .path == ".github/workflows/release-stable.yml" and
              .event == "workflow_dispatch" and
              .head_branch == "main" and
              .status == "completed"
            ' <<< "$prior_run" >/dev/null; then
              # A stable run that qualified the commit itself holds the artifacts.
              RELEASE_COMMIT=$(jq -r '.head_sha' <<< "$prior_run")
              QUALIFIED_COMMIT="$RELEASE_COMMIT"
              if ! gh api --paginate --slurp \
                "/repos/${GITHUB_REPOSITORY}/actions/runs/${RESUME_RUN_ID}/jobs?per_page=100" |
                jq -e '[.[] | .jobs[] | select(.name | startswith("qualify /"))] | length > 0' >/dev/null; then
                echo "::error::Stable run ${RESUME_RUN_ID} reused the version pull request's qualification and holds no qualification artifacts; resume with that Release qualification run's id, which its summary names"
                exit 1
              fi
            elif jq -e '
              .path == ".github/workflows/release-qualification.yml" and
              .event == "pull_request" and
              .status == "completed" and
              .conclusion == "success"
            ' <<< "$prior_run" >/dev/null; then
              # The version pull request's qualification, which a stable run reused. It
              # qualified the pull request's head; the release commit is the commit that pull
              # request merged as, and it must have exactly the qualified files.
              QUALIFIED_COMMIT=$(jq -r '.head_sha' <<< "$prior_run")
              RELEASE_COMMIT=$(gh api "/repos/${GITHUB_REPOSITORY}/commits/${QUALIFIED_COMMIT}/pulls" \
                --jq '[.[] | select(.merged_at != null and .base.ref == "main")][0].merge_commit_sha // ""')
              if [ -z "$RELEASE_COMMIT" ]; then
                echo "::error::Qualified commit ${QUALIFIED_COMMIT} belongs to no pull request merged into main"
                exit 1
              fi
              if ! git fetch --no-tags --quiet origin "$QUALIFIED_COMMIT" ||
                 ! git diff --quiet "$QUALIFIED_COMMIT" "$RELEASE_COMMIT"; then
                echo "::error::Release commit ${RELEASE_COMMIT} does not have exactly the files qualified at ${QUALIFIED_COMMIT}"
                exit 1
              fi
            else
              echo "::error::Resume requires a completed stable release run on main, or the successful Release qualification run it reused"
              exit 1
            fi
            if ! git merge-base --is-ancestor "$RELEASE_COMMIT" HEAD; then
              echo "::error::Release commit is not an ancestor of main"
              exit 1
            fi
            verify_qualification_run "$RESUME_RUN_ID" "$QUALIFIED_COMMIT" || exit 1
            echo "Resuming v${VERSION} from qualified run ${RESUME_RUN_ID} (qualified ${QUALIFIED_COMMIT}) at ${RELEASE_COMMIT}"
            echo "qualification_run_id=$RESUME_RUN_ID" >> "$GITHUB_OUTPUT"
            echo "qualified_commit=$QUALIFIED_COMMIT" >> "$GITHUB_OUTPUT"
            REUSE=true
          else
            # By default, reuse the qualification run of the version pull request that
            # produced this commit. It qualified the pull request's head commit, so it counts
            # only when that commit's files are exactly the files on main now.
            RELEASE_COMMIT=$(git rev-parse HEAD)
            pr_head=$(gh api "/repos/${GITHUB_REPOSITORY}/commits/${RELEASE_COMMIT}/pulls" \
              --jq '[.[] | select(.merged_at != null and .base.ref == "main")][0].head.sha // ""')
            pr_run_id=""
            if [ -n "$pr_head" ]; then
              pr_run_id=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/release-qualification.yml/runs?head_sha=${pr_head}&event=pull_request&status=success&per_page=1" \
                --jq '.workflow_runs[0].id // ""')
            fi
            if [ -n "$pr_run_id" ] &&
               git fetch --no-tags --quiet origin "$pr_head" &&
               git diff --quiet "$pr_head" "$RELEASE_COMMIT" &&
               verify_qualification_run "$pr_run_id" "$pr_head"; then
              echo "Reusing the version pull request's qualification run ${pr_run_id} (qualified ${pr_head}, identical to ${RELEASE_COMMIT})"
              echo "Qualification reused from Release qualification run ${pr_run_id} (${pr_head}). To resume after a failed publish, run this workflow with qualification_run_id=${pr_run_id}." >> "$GITHUB_STEP_SUMMARY"
              echo "qualification_run_id=$pr_run_id" >> "$GITHUB_OUTPUT"
              # The reused artifacts record the pull request's head commit, not main's.
              echo "qualified_commit=$pr_head" >> "$GITHUB_OUTPUT"
              REUSE=true
            else
              # Publish the reviewed tip and the artifacts qualified by this run.
              echo "No reusable qualification run for ${RELEASE_COMMIT}; qualifying in this run"
              echo "Qualified in this run. To resume after a failed publish, run this workflow with qualification_run_id=${GITHUB_RUN_ID}." >> "$GITHUB_STEP_SUMMARY"
              echo "qualification_run_id=$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
            fi
          fi
          echo "reuse=$REUSE" >> "$GITHUB_OUTPUT"

          echo "Publishing v${VERSION} from ${RELEASE_COMMIT}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$RELEASE_COMMIT" >> "$GITHUB_OUTPUT"

  qualify:
    needs: resolve
    if: ${{ needs.resolve.outputs.reuse != 'true' }}
    uses: ./.github/workflows/release.yml
    with:
      mode: stable
      stable_action: qualification
      source_ref: ${{ needs.resolve.outputs.commit }}
    secrets: inherit

  # PyPI trusted publishing requires the protected job in this top-level workflow.
  publish-python:
    needs: [resolve, qualify]
    if: ${{ always() && needs.resolve.result == 'success' && (needs.qualify.result == 'success' || needs.resolve.outputs.reuse == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/alienplatform
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download qualified Python wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          run-id: ${{ needs.resolve.outputs.qualification_run_id }}
          github-token: ${{ secrets.REPO_ACCESS_TOKEN }}
          pattern: qualified-python-*
          path: dist
          merge-multiple: true

      - name: Check qualified wheels against PyPI
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          python - <<'PY'
          import glob
          import hashlib
          import json
          import os
          import urllib.error
          import urllib.request

          wheels = sorted(glob.glob("dist/*.whl"))
          if len(wheels) != 4:
              raise SystemExit(f"expected four qualified wheels, found {wheels}")
          expected = {
              os.path.basename(path): hashlib.sha256(open(path, "rb").read()).hexdigest()
              for path in wheels
          }
          url = f"https://pypi.org/pypi/alienplatform/{os.environ['VERSION']}/json"
          try:
              with urllib.request.urlopen(url) as response:
                  published = json.load(response)
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              published = {"urls": []}
          existing = {
              item["filename"]: item["digests"]["sha256"]
              for item in published["urls"]
              if item["filename"] in expected
          }
          mismatched = {
              name: (expected[name], digest)
              for name, digest in existing.items()
              if expected[name] != digest
          }
          if mismatched:
              raise SystemExit(f"PyPI already contains different wheel contents: {mismatched}")
          print(f"qualified wheels: {sorted(expected)}")
          print(f"already published with matching hashes: {sorted(existing)}")
          PY

      # Resuming a partially completed upload is safe because the preceding
      # checksum check rejects an existing filename with different contents.
      - name: Publish qualified Python wheels
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          packages-dir: dist
          skip-existing: true

      - name: Verify published wheel hashes
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          for attempt in $(seq 1 30); do
            if python - <<'PY'
          import glob
          import hashlib
          import json
          import os
          import urllib.request

          expected = {
              os.path.basename(path): hashlib.sha256(open(path, "rb").read()).hexdigest()
              for path in glob.glob("dist/*.whl")
          }
          with urllib.request.urlopen(
              f"https://pypi.org/pypi/alienplatform/{os.environ['VERSION']}/json"
          ) as response:
              published = json.load(response)
          actual = {item["filename"]: item["digests"]["sha256"] for item in published["urls"]}
          if any(actual.get(name) != digest for name, digest in expected.items()):
              raise SystemExit(1)
          print(f"verified {len(expected)} wheels on PyPI")
          PY
            then
              exit 0
            fi
            echo "Waiting for PyPI metadata propagation (${attempt}/30)..."
            sleep 10
          done
          echo "::error::Published Python wheels did not appear with their qualified hashes"
          exit 1

  publish:
    needs: [resolve, qualify, publish-python]
    if: ${{ always() && needs.resolve.result == 'success' && needs.publish-python.result == 'success' && (needs.qualify.result == 'success' || needs.resolve.outputs.reuse == 'true') }}
    uses: ./.github/workflows/release.yml
    with:
      mode: stable
      stable_action: publish
      source_ref: ${{ needs.resolve.outputs.commit }}
      qualification_run_id: ${{ needs.resolve.outputs.qualification_run_id }}
      qualified_commit: ${{ needs.resolve.outputs.qualified_commit }}
    secrets: inherit
