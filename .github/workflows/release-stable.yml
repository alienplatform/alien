name: Publish stable release

on:
  workflow_dispatch:

concurrency:
  group: publish-stable-release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  resolve:
    runs-on: depot-ubuntu-24.04-arm
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve unreleased version commit
        id: release
        run: |
          VERSION=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if git rev-parse --verify --quiet "refs/tags/v${VERSION}" >/dev/null; then
            echo "::error::v${VERSION} is already published"
            exit 1
          fi

          # Publish the reviewed tip, not the commit that first bumped the version.
          # Release-only fixes may land after preparation and must be included in
          # the exact commit qualified and published by the reusable workflow.
          RELEASE_COMMIT=$(git rev-parse HEAD)

          echo "Publishing v${VERSION} from ${RELEASE_COMMIT}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$RELEASE_COMMIT" >> "$GITHUB_OUTPUT"

  qualify:
    needs: resolve
    uses: ./.github/workflows/release.yml
    with:
      mode: stable
      stable_action: qualification
      source_ref: ${{ needs.resolve.outputs.commit }}
    secrets: inherit

  publish:
    needs: [resolve, qualify]
    uses: ./.github/workflows/release.yml
    with:
      mode: stable
      stable_action: publish
      source_ref: ${{ needs.resolve.outputs.commit }}
      qualification_run_id: ${{ github.run_id }}
    secrets: inherit
