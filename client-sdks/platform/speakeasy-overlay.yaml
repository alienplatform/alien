overlay: 1.0.0
info:
  title: Platform TypeScript SDK ergonomics
  version: 1.0.0
actions:
  - target: "$['paths']['/v1/deployment-groups/{id}/tokens']['post']"
    update:
      x-speakeasy-name-override: createToken
  - target: "$['paths']['/v1/resources/{area}/{resourceId}/deployments']['get']"
    update:
      description: List deployments where the selected resource is installed.
  - target: "$"
    update:
      x-speakeasy-globals:
        parameters:
          - name: workspace
            in: query
            description: Workspace name. Platform API keys already select a workspace; other authentication methods can configure it once on the SDK client.
            required: false
            schema:
              type: string
              minLength: 4
              maxLength: 100
              pattern: "^(?!ws[-_])[a-z0-9](-?[a-z0-9])*$"
            example: my-workspace
            x-speakeasy-globals-hidden: true
  # A binding to an extension-defined type is told apart from the built-in bindings only by
  # the pattern on its `type`, which the generated zod schemas do not check. Kept in the union,
  # it matches every built-in binding first, drops the binding's fields from request bodies
  # and accepts bindings the API refuses. The SDK sends built-in bindings only.
  - target: "$['components']['schemas']['ExternalBinding']['anyOf'][?(@.properties.type.pattern)]"
    remove: true
