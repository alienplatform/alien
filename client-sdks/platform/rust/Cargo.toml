[package]
name = "alien-platform-api"
version.workspace = true
authors = ["OpenAPI Generator team and contributors"]
description = "Auto-generated Rust SDK for the Alien Platform API"
license-file.workspace = true
edition = "2021"
include = ["build.rs", "build/**/*", "src/**/*", "openapi.json"]

# docs.rs documents the complete published SDK.
[package.metadata.docs.rs]
features = ["full-api"]

[features]
default = ["rustls"]
# Generate every Platform API operation. Without it the client covers only the operations
# Alien itself calls (build/openapi_filter.rs). Off by default because `cargo build` or
# `cargo test` at the workspace root selects this crate, and its defaults would then put the
# full client in every build.
full-api = []
native-tls = ["reqwest/native-tls"]
rustls = ["reqwest/rustls-tls-webpki-roots"]

[dependencies]
alien-error = { workspace = true }
futures = "0.3"
progenitor-client = { version = "0.11.0" }
reqwest = { version = "0.12", features = ["json", "stream"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regress = "0.11"
chrono = { version = "0.4", features = ["serde"] }

[build-dependencies]
prettyplease = "0.2.22"
progenitor = { version = "0.11.0" }
serde_json = "1.0"
syn = "2.0"

[dev-dependencies]
http = { workspace = true }
tokio = { workspace = true }
