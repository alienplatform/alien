configVersion: 2.0.0
generation:
  devContainers:
    enabled: true
    schemaPath: .speakeasy/out.openapi.yaml
  sdkClassName: AlienManager
  maintainOpenAPIOrder: true
  usageSnippets:
    optionalPropertyRendering: withExample
    sdkInitStyle: constructor
  useClassNamesForArrayFields: true
  fixes:
    nameResolutionDec2023: true
    nameResolutionFeb2025: true
    parameterOrderingFeb2024: true
    requestResponseComponentNamesFeb2024: true
    securityFeb2025: true
    sharedErrorComponentsApr2025: true
    nameOverrideFeb2026: false
    sharedNestedComponentsJan2026: false
  auth:
    oAuth2ClientCredentialsEnabled: false
    oAuth2PasswordEnabled: false
    hoistGlobalSecurity: true
  inferSSEOverload: true
  sdkHooksConfigAccess: true
  schemas:
    allOfMergeStrategy: shallowMerge
  requestBodyFieldName: ""
  persistentEdits: {}
  tests:
    generateTests: false
    generateNewTests: true
    skipResponseBodyAssertions: false
  versioningStrategy: manual
typescript:
  version: 3.3.29
  acceptHeaderEnum: true
  additionalDependencies:
    dependencies: {}
    devDependencies:
      globals: ^17.0.0
      typescript: ~5.9.0
    peerDependencies: {}
  additionalPackageJSON:
    exports:
      ".":
        source: "./src/index.ts"
        types: "./esm/index.d.ts"
        default: "./esm/index.js"
      "./package.json": "./package.json"
      "./types":
        source: "./src/types/index.ts"
        types: "./esm/types/index.d.ts"
        default: "./esm/types/index.js"
      "./models/errors":
        source: "./src/models/errors/index.ts"
        types: "./esm/models/errors/index.d.ts"
        default: "./esm/models/errors/index.js"
      "./models":
        source: "./src/compat/models.ts"
        types: "./esm/compat/models.d.ts"
        default: "./esm/compat/models.js"
      "./models/operations":
        source: "./src/models/operations/index.ts"
        types: "./esm/models/operations/index.d.ts"
        default: "./esm/models/operations/index.js"
      "./*.js":
        source: "./src/*.ts"
        types: "./esm/*.d.ts"
        default: "./esm/*.js"
      "./*":
        source: "./src/*.ts"
        types: "./esm/*.d.ts"
        default: "./esm/*.js"
      "./models/stacksettings":
        source: "./src/compat/stacksettings.ts"
        types: "./esm/compat/stacksettings.d.ts"
        default: "./esm/compat/stacksettings.js"
      "./models/stacksettings.js":
        source: "./src/compat/stacksettings.ts"
        types: "./esm/compat/stacksettings.d.ts"
        default: "./esm/compat/stacksettings.js"
    homepage: https://alien.dev
    license: FSL-1.1-Apache-2.0
    repository:
      directory: client-sdks/manager/typescript
      type: git
      url: https://github.com/alienplatform/alien.git
  additionalScripts: {}
  alwaysIncludeInboundAndOutbound: false
  apiPromiseHelpers: false
  author: Alien Software, Inc. <hi@alien.dev>
  baseErrorName: AlienManagerError
  clientServerStatusCodesAsErrors: true
  constFieldsAlwaysOptional: false
  defaultErrorName: AlienManagerDefaultError
  enableCustomCodeRegions: false
  enableMCPServer: false
  enableReactQuery: false
  enumFormat: union
  envVarPrefix: ALIEN_MANAGER
  eventStreamClassName: EventStream
  exportZodModelNamespace: false
  fixEnumNameSanitization: false
  flatAdditionalProperties: false
  flattenGlobalSecurity: true
  flatteningOrder: parameters-first
  formStringArrayEncodeMode: encoded-string
  forwardCompatibleEnumsByDefault: false
  forwardCompatibleUnionsByDefault: "false"
  generateExamples: true
  imports:
    option: openapi
    paths:
      callbacks: models/callbacks
      errors: models/errors
      operations: models/operations
      shared: models
      webhooks: models/webhooks
  inferUnionDiscriminators: true
  inputModelSuffix: input
  jsonpath: rfc9535
  laxMode: strict
  legacyFileNaming: true
  maxMethodParams: 0
  methodArguments: infer-optional-args
  modelPropertyCasing: camel
  moduleFormat: esm
  multipartArrayFormat: legacy
  outputModelSuffix: output
  packageName: '@alienplatform/manager-api'
  preApplyUnionDiscriminators: true
  preserveModelFieldNames: false
  privateIdentifierPrefix: '#'
  requestExtras: false
  responseFormat: flat
  sseFlatResponse: true
  templateVersion: v2
  unionStrategy: left-to-right
  usageSDKInitImports: []
  useIndexModules: true
  useOxlint: false
  useTsgo: false
  zodVersion: v4
