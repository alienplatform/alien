{{- /*
Migration from the chart that generated these values at render time. Remove one release
after migration is reported.

On upgrade only, read the encryption key, the log collector token and the in-cluster
Postgres passwords an earlier chart installed, and carry them unchanged into a Secret the
Operator reads at start. The Operator copies them into the Secret it owns and never
overwrites a value it already has. Nothing here is generated: a value that is not found is
left out, and the Operator refuses to start on existing state without its key.

The earlier chart kept the values in its own Secret, or in the Secrets named by
management.existingSecret / runtime.encryption.existingSecret (GitOps installs keep those
values in Git). Those fields are read here and nowhere else.
*/ -}}
{{- if and .Release.IsUpgrade (not (dig "enabled" false (default dict .Values.remoteOperator))) -}}
{{- $found := dict -}}
{{- $own := lookup "v1" "Secret" .Release.Namespace (include "deployment.fullname" .) -}}
{{- $owned := lookup "v1" "Secret" .Release.Namespace (include "deployment.operatorSecretName" .) -}}
{{- /* Where an earlier chart kept the key: a Secret named in the values, else its own Secret. */ -}}
{{- $encryptionName := dig "encryption" "existingSecret" "name" "" .Values.runtime -}}
{{- $encryptionKey := default "encryption-key" (dig "encryption" "existingSecret" "key" "" .Values.runtime) -}}
{{- $legacy := $own -}}
{{- if $encryptionName -}}
  {{- $legacy = lookup "v1" "Secret" .Release.Namespace $encryptionName -}}
{{- else -}}
  {{- $encryptionKey = "encryption-key" -}}
{{- end -}}
{{- /* What the Operator already keeps in its own Secret is not carried again. */ -}}
{{- $ownedData := default dict (and $owned $owned.data) -}}
{{- $installed := "" -}}
{{- if hasKey $ownedData "encryption-key" -}}
  {{- $installed = index $owned.data "encryption-key" | b64dec -}}
{{- else if and $legacy (hasKey (default dict $legacy.data) $encryptionKey) -}}
  {{- $installed = index $legacy.data $encryptionKey | b64dec -}}
{{- end -}}
{{- if and $installed (not (regexMatch "^[a-fA-F0-9]{64}$" $installed)) -}}
  {{- fail "The installed runtime encryption key is invalid. Restore the original key before upgrading." -}}
{{- end -}}
{{- /* An earlier chart also took the key from the values. Keep it only if it is the installed one. */ -}}
{{- $requested := dig "encryption" "key" "" .Values.runtime -}}
{{- if and $requested (not (regexMatch "^[a-fA-F0-9]{64}$" $requested)) -}}
  {{- fail "runtime.encryption.key must be exactly 64 hex characters. The Operator keeps its own key now; remove the value after this upgrade." -}}
{{- end -}}
{{- if and $installed $requested (ne $installed $requested) -}}
  {{- fail "Changing the runtime encryption key would make the installed state unreadable. Keep the installed key." -}}
{{- end -}}
{{- if and (or $installed $requested) (not (hasKey $ownedData "encryption-key")) -}}
  {{- $_ := set $found "encryption-key" (default $requested $installed | b64enc) -}}
{{- end -}}
{{- if and (include "deployment.nodeCollector" .) (not (hasKey $ownedData "collector-token")) -}}
  {{- if .Values.logCollector.token -}}
    {{- $_ := set $found "collector-token" (.Values.logCollector.token | b64enc) -}}
  {{- else if and $own (hasKey (default dict $own.data) "collector-token") -}}
    {{- $_ := set $found "collector-token" (index $own.data "collector-token") -}}
  {{- end -}}
{{- end -}}
{{- range $database := include "deployment.ownedPostgres" . | fromJsonArray -}}
  {{- $key := printf "postgres-%s-password" $database.id -}}
  {{- $installedDatabase := lookup "v1" "Secret" $.Release.Namespace $database.name -}}
  {{- if and $installedDatabase (hasKey (default dict $installedDatabase.data) "password") (not (hasKey $ownedData $key)) -}}
    {{- $_ := set $found $key (index $installedDatabase.data "password") -}}
  {{- end -}}
{{- end -}}
{{- if $found }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "deployment.migrationSecretName" . }}
  labels:
    {{- include "deployment.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range $key, $value := $found }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
{{- end }}
