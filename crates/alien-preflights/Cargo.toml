[package]
name = "alien-preflights"
version.workspace = true
edition = "2021"
license-file.workspace = true
[dependencies]
alien-core = { workspace = true }
alien-error = { workspace = true }
alien-permissions = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync", "macros", "rt", "time"] }
tracing = { workspace = true }
indexmap = { workspace = true }
alien-aws-clients = { workspace = true, optional = true }
alien-gcp-clients = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
utoipa = { workspace = true, optional = true }

[features]
default = []
runtime-checks = ["dep:alien-aws-clients", "dep:alien-gcp-clients", "dep:reqwest"]
openapi = ["utoipa", "alien-core/openapi"]

[dev-dependencies]
httpmock = { workspace = true }
alien-gcp-clients = { workspace = true, features = ["test-utils"] }
alien-aws-clients = { workspace = true, features = ["test-utils"] }
tokio-test = "0.4"
