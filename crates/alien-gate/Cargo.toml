[package]
name = "alien-gate"
version.workspace = true
edition = "2021"
description = "Writes serverless workloads only as their signed release describes them"
license-file.workspace = true

[[bin]]
name = "alien-gate"
path = "src/main.rs"

[dependencies]
alien-aws-clients = { workspace = true }
alien-client-core = { workspace = true }
alien-core = { workspace = true }
alien-error = { workspace = true }
alien-signing = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true, features = ["http1", "json", "tokio"] }
base64 = { workspace = true }
chrono = { workspace = true }
ed25519-compact = { workspace = true }
rand = { workspace = true }
lambda_runtime = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "test-util"] }
