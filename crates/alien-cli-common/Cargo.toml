[package]
name = "alien-cli-common"
version.workspace = true
edition = "2021"
license-file.workspace = true
publish = false

[features]
default = []
deployment = ["dep:alien-deployment"]

[dependencies]
alien-core = { workspace = true, features = ["bundle-signature"] }
alien-error = { workspace = true }
alien-preflights = { workspace = true }
alien-deployment = { workspace = true, optional = true }
clap = { workspace = true, features = ["derive"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
termcolor = "1"
hex = { workspace = true }
oci-client = { workspace = true, features = ["rustls-tls"] }
sha2 = { workspace = true }
tar = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util"] }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "fs"] }

