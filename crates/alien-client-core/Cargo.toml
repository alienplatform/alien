[package]
name = "alien-client-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
license-file.workspace = true

[lib]
crate-type = ["rlib"]

[features]
# Retries without waiting between attempts. CI turns it on for its mocked test run
# (ci-fast.yml, ci-fork.yml); live cloud tests and shipped binaries keep the real back-off.
no-retry-delay = []

[dependencies]
alien-error = { workspace = true }

serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["sync", "macros", "io-util", "rt", "time", "fs"] }
reqwest = { workspace = true, features = ["json", "rustls-tls-webpki-roots"] }
backon = { workspace = true }
serde_path_to_error = "0.1.17"
async-trait = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
quick-xml = { version = "0.41.0", features = ["serialize", "overlapped-lists"] }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
tempfile = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies.tracing-subscriber]
workspace = true
