[package]
name = "alien-permissions"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
license-file.workspace = true

[features]
default = ["infrastructure"]
infrastructure = ["dep:alien-core", "dep:regex", "dep:json5", "dep:tracing", "dep:sha2"]
wasm = ["dep:wasm-bindgen"]

[dependencies]
alien-core = { workspace = true, optional = true }
alien-permission-types = { workspace = true }
alien-error = { workspace = true }
wasm-bindgen = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
indexmap = { workspace = true, features = ["serde"] }
tracing = { workspace = true, optional = true }
regex = { workspace = true, optional = true }
json5 = { version = "0.4", optional = true }
sha2 = { workspace = true, optional = true }

[build-dependencies]
json5 = "0.4"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
alien-permission-types = { workspace = true }
indexmap = { workspace = true, features = ["serde"] }

[dev-dependencies]
insta = { workspace = true, features = ["yaml", "json"] }
rstest = { workspace = true }
tokio = { workspace = true, features = ["sync", "macros", "rt"] }
anyhow = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls-tls-webpki-roots"] }
json5 = "0.4"
