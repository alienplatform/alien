name = "acme-ports"
platforms = ["aws"]

# One internal port.
[container.single]
image = "ghcr.io/acme/single:1.0.0"
cpu = 1
memory = "1Gi"
ports = [8080]

# Several internal ports, written in order.
[container.multiple]
image = "ghcr.io/acme/multiple:1.0.0"
cpu = 1
memory = "1Gi"
ports = [9000, 9001, 9002]

# A tunnel port that is already listed stays listed once.
[container.tunnel-listed]
image = "ghcr.io/acme/tunnel:1.0.0"
cpu = 1
memory = "1Gi"
ports = [7000, 8080]
tunnel = 7000

# A tunnel port that is not listed is added after the listed ones.
[container.tunnel-added]
image = "ghcr.io/acme/tunnel:1.0.0"
cpu = 1
memory = "1Gi"
ports = [8080]
tunnel = { port = 7001 }
