name = "acme-ports"
platforms = ["aws"]

# One internal port.
[container.single]
image = "ghcr.io/acme/single:1.0.0"
cpu = 1
memory = "1Gi"
ports = [8080]

# Several internal ports, written in order.
[container.multiple]
image = "ghcr.io/acme/multiple:1.0.0"
cpu = 1
memory = "1Gi"
ports = [9000, 9001, 9002]
