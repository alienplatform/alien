name = "acme-health"
platforms = ["aws"]

# An empty table keeps every default: GET /health, 1s timeout, 3 failures.
[container.defaults]
image = "ghcr.io/acme/defaults:1.0.0"
cpu = 1
memory = "1Gi"
health-check = {}

# Only the path.
[container.path-only]
image = "ghcr.io/acme/path-only:1.0.0"
cpu = 1
memory = "1Gi"
health-check = { path = "/ready" }

# Every setting; the timeout is a duration.
[container.everything]
image = "ghcr.io/acme/everything:1.0.0"
cpu = 1
memory = "1Gi"
ports = [8080, 9090]
health-check = { path = "/livez", port = 9090, method = "POST", timeout = "4s", failure-threshold = 10 }
