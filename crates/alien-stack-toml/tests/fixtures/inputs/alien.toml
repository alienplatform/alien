name = "inputs-demo"
platforms = ["machines", "aws"]

[input.runnerRegion]
kind = "string"
label = "Runner region"
description = "Region key this deployment's workers consume."
min-length = 1
pattern = "^[a-z0-9-]+$"
env = { name = "RUNNER_REGION", targets = ["worker"] }

[input.storeBackend]
kind = "enum"
label = "Store backend"
description = "Backend that stores registry state."
values = ["sqlite", "cas"]
default = "sqlite"
env = "STORE_BACKEND"

[input.cacheSizeGb]
kind = "integer"
label = "Cache size"
description = "Largest local cache, in GiB."
default = 100
min = 1
max = 4096
env = ["CACHE_SIZE_GB", { name = "LEGACY_CACHE_GB", targets = ["work*"] }]

[input.sampleRate]
kind = "number"
required = false
label = "Trace sample rate"
min = 0
max = 1.0
default = 0.25

[input.dryRun]
kind = "boolean"
provided-by = ["developer", "deployer"]
label = "Dry run"
description = "Observe decisions without applying them."
default = false
env = { name = "DRY_RUN", targets = ["worker"] }

[input.prewarmImages]
kind = "string-list"
required = false
label = "Prewarm images"
default = ["ghcr.io/acme/runner:latest"]
max-items = 8
platforms = ["machines"]
env = "PREWARM_IMAGES"

[input.activationToken]
kind = "secret"
provided-by = "deployer"
label = "Activation token"
description = "Short-lived token used to enroll this runtime."
min-length = 32
env = "ACTIVATION_TOKEN"

[input.managedBucket]
kind = "boolean"
provided-by = "deployer"
platforms = ["aws"]
default = true
label = "Create a data bucket"
description = "Create an Alien-managed bucket for this deployment's data."

[storage.data]
enabled-when = "managedBucket"

[daemon.worker]
image = "ghcr.io/acme/worker:2.0.0"

[daemon.worker.secrets]
API_TOKEN = {}
