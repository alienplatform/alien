[package]
name = "alien-deploy-cli"
version.workspace = true
edition = "2021"
license-file.workspace = true
publish = false
description = "Alien Deploy CLI — deploy and manage applications in remote environments"

[lib]
name = "alien_deploy_cli"
path = "src/lib.rs"

[[bin]]
name = "alien-deploy"
path = "src/main.rs"

[dependencies]
# Alien crates
alien-core = { workspace = true }
alien-preflights = { workspace = true }
alien-cli-common = { workspace = true }
alien-error = { workspace = true }
alien-deployment = { workspace = true }
alien-helm = { workspace = true }
alien-infra = { workspace = true, features = ["aws", "gcp", "azure", "test", "local"] }
alien-local = { workspace = true }
alien-operator = { path = "../alien-operator" }
alien-manager-api = { path = "../../client-sdks/manager/rust" }

# Async & HTTP
tokio = { workspace = true, features = ["sync", "macros", "io-util", "rt-multi-thread", "time", "net", "fs", "signal"] }
reqwest = { workspace = true, default-features = false, features = ["json", "rustls-tls-webpki-roots"] }

# AWS SDK for `register --import cloudformation`.
# Use `default-https-client` (hyper 1 + rustls 0.23). The `rustls` feature
# selects the legacy hyper 0.14 client, which pulls rustls 0.21 and
# rustls-webpki 0.101, and is also part of aws-sdk-* default features.
aws-config = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio", "behavior-version-latest"] }
aws-sdk-cloudformation = { version = "1", default-features = false, features = ["default-https-client"] }

# Serialization
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
toml = { workspace = true }

# CLI & Logging
clap = { workspace = true, features = ["derive", "env"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

# Utilities
bon = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
uuid = { workspace = true, features = ["v4"] }
url = { workspace = true }
hostname = { workspace = true }
urlencoding = { workspace = true }
dirs = "6"
service-manager = "0.10"
which = "7"
getrandom = "0.2"
tempfile = { workspace = true }
flate2 = { workspace = true }
hex = { workspace = true }
oci-client = { workspace = true }
sha2 = { workspace = true }
tar = { workspace = true }
base64 = { workspace = true }
fs2 = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
httpmock = { workspace = true }
