[package]
name = "alien-sandbox-agent"
version.workspace = true
edition.workspace = true
license-file.workspace = true

[dependencies]
subtle = { workspace = true }
httparse = "1.10"
alien-core = { workspace = true, features = ["sandbox-capability", "sandbox-process"] }
alien-error = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
ed25519-compact = { workspace = true }
axum = { workspace = true, features = ["tokio", "http1", "json", "query"] }
uuid = { workspace = true, features = ["v4"] }

[[bin]]
name = "alien-sandbox-agent"
path = "src/main.rs"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
nlink = { version = "0.32", features = ["sockdiag"] }

[dev-dependencies]
tempfile = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
libc = "0.2"
