[package]
name = "alien-release-trust"
version.workspace = true
edition = "2021"
description = "Signed statements, signer lists and anchors for deployments that run only what the developer signed"
license-file.workspace = true

[dependencies]
alien-error = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
p256 = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
getrandom = { workspace = true }
