[package]
name = "alien-infra"
version.workspace = true
edition.workspace = true
authors.workspace = true
description.workspace = true
license-file.workspace = true

[features]
default = []  # Minimal default, let consumers choose
all-platforms = ["aws", "gcp", "azure", "kubernetes", "local", "test"]  # Convenience feature for all providers
aws = ["dep:alien-bindings", "alien-bindings/aws", "dep:zip", "dep:ed25519-compact", "dep:alien-aws-clients", "dep:aws-credential-types", "dep:alien-preflights", "alien-preflights/runtime-checks", "dep:urlencoding", "alien-client-config/aws"]
gcp = ["dep:alien-preflights", "dep:alien-gcp-clients", "alien-client-config/gcp"]
azure = ["dep:alien-bindings", "alien-bindings/azure", "dep:ed25519-compact", "dep:alien-azure-clients", "alien-client-config/azure"]
kubernetes = ["dep:alien-k8s-clients", "dep:alien-bindings", "alien-bindings/kubernetes", "dep:axum", "dep:dirs", "dep:ed25519-compact", "alien-core/sandbox-capability", "alien-client-config/kubernetes"]
local = ["dep:ed25519-compact", "dep:alien-local", "dep:alien-bindings"]  # Local platform support
test = []  # Test platform support - fast mock implementations without real cloud APIs
openapi = ["dep:utoipa", "alien-core/openapi"]
test-utils = [
    "dep:wat",
    "alien-core/test-utils",
    "alien-aws-clients/test-utils",
    "alien-gcp-clients/test-utils", 
    "alien-azure-clients/test-utils",
    "alien-client-config/test-utils",
    "dep:alien-preflights",
    "dep:mockall"
]

[lib]
crate-type = ["rlib"]

# A controller process that speaks the step protocol, for alien-infra's own tests.
[[bin]]
name = "step-protocol-test-controller"
path = "src/bin/step_protocol_test_controller.rs"
required-features = ["test-utils"]
test = false
doc = false

[dependencies]
alien-core = { workspace = true }
alien-signing = { workspace = true }
alien-error = { workspace = true }
alien-client-core = { workspace = true }
alien-client-config = { workspace = true }
alien-aws-clients = { workspace = true, optional = true }
alien-gcp-clients = { workspace = true, optional = true }
alien-azure-clients = { workspace = true, optional = true }
alien-k8s-clients = { workspace = true, optional = true }
alien-helm = { workspace = true }
alien-cloudformation = { workspace = true }
alien-terraform = { workspace = true }
alien-local = { workspace = true, optional = true }
alien-bindings = { workspace = true, optional = true }
alien-macros = { workspace = true }
alien-permissions = { workspace = true }

bon = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
petgraph = { workspace = true }
tracing = { workspace = true }
utoipa = { workspace = true, optional = true }
tokio = { workspace = true, features = ["sync", "macros", "io-util", "process", "rt", "rt-multi-thread", "time", "fs"] }
async-trait = { workspace = true }
indexmap = { workspace = true, features = ["serde"] }
reqwest = { workspace = true, features = ["json", "rustls-tls-webpki-roots"] }
futures = { workspace = true }
futures-util = { workspace = true }
heck = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
serde_yaml = { workspace = true }
uuid = { workspace = true, features = ["v4", "v5", "serde"] }
k8s-openapi = { version = "0.25.0", features = ["v1_33"] }
alien-preflights = { workspace = true, optional = true }
mockall = { workspace = true, optional = true }
urlencoding = { workspace = true, optional = true }
pem = { workspace = true }
p12 = "0.6"
base64 = { workspace = true }
# The host of a controller module signs the module's AWS requests with the step's credentials,
# and rebuilds a response it read up to its size limit.
aws-credential-types = { workspace = true, optional = true }
http = { workspace = true }

# Kubeconfig dependencies
axum = { workspace = true, optional = true }
zip = { workspace = true, optional = true }
ed25519-compact = { workspace = true, optional = true }
dirs = { workspace = true, optional = true }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

# Extension hooks run in wasmtime, which does not build for wasm32.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
alien-hooks-runtime = { workspace = true }
zip = { workspace = true }
wat = { workspace = true, optional = true }
hcl-rs = { workspace = true }
# `public_host` resolves a host before it connects.
tokio = { workspace = true, features = ["net"] }

# Controller processes: their own process group, and stdout kept for replies.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
getrandom = { workspace = true, features = ["wasm_js"] }
console_error_panic_hook = { workspace = true }

[dev-dependencies]
# The tests cover every platform's controllers, so they need every platform feature even when
# `cargo test -p alien-infra` builds this crate alone (no other workspace crate turning them on).
alien-infra = { path = ".", features = ["all-platforms", "test-utils", "test"] }
alien-client-core = { workspace = true, features = ["test-utils"] }
alien-bindings = { workspace = true, features = ["aws", "gcp"] }
alien-preflights = { workspace = true }
alien-terraform = { workspace = true }
hcl-rs = { workspace = true }
alien-aws-clients = { workspace = true }
alien-gcp-clients = { workspace = true }
alien-azure-clients = { workspace = true }
alien-k8s-clients = { workspace = true, features = ["test-utils"] }
alien-verifier = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls-tls-webpki-roots"] }
serde_json = { workspace = true, features = ["preserve_order"] }
tempfile = { workspace = true }
insta = { workspace = true, features = ["yaml", "json"] }
workspace_root = { workspace = true }
dotenvy = { workspace = true }
anyhow = { workspace = true }
test-context = { workspace = true }
regex = { workspace = true }
httpmock = { version = "0.7" }
rstest = { workspace = true }
axum = { workspace = true, features = ["http1", "json", "tokio"] }
tokio = { workspace = true, features = ["net"] }
mockall = { workspace = true }
tracing-subscriber = { workspace = true }

[[example]]
name = "protected_worker_update"
required-features = ["all-platforms"]
