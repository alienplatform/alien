[package]
name = "alien-egress-gateway"
version.workspace = true
edition.workspace = true
license-file.workspace = true

[features]
default = []
aws = ["alien-bindings/aws"]
cloud = ["alien-bindings/aws", "alien-bindings/gcp", "alien-bindings/azure", "alien-bindings/kubernetes"]
local = ["alien-bindings/local"]

[dependencies]
axum = { workspace = true, features = ["tokio", "http1", "json"] }
alien-error = { workspace = true }
alien-bindings = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
ed25519-compact = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["json", "env-filter"] }
url = { workspace = true }
httparse = "1.10"
ipnet = { version = "2.12", features = ["serde"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "0.14", features = ["pem", "x509-parser"] }
webpki-roots = "1"
http = { workspace = true }
hyper = { workspace = true, features = ["http1", "client", "server"] }
hyper-util = { workspace = true, features = ["tokio"] }
http-body-util = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
