[package]
name = "alien-operations-sdk"
version.workspace = true
edition = "2021"
license-file.workspace = true
description = "Public SDK for authoring Alien operations plugins: manifest schema, invocation protocol, and the Plugin trait."

[dependencies]
alien-core = { workspace = true }
alien-error = { workspace = true }
alien-permissions = { workspace = true }
async-trait = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-util", "rt"] }

# Turns on TLS for the presigned requests alien-core makes for plugins. Builds for wasm32 make no
# HTTP requests, so they don't compile reqwest's wasm32 backend (wasm-bindgen, js-sys, web-sys).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { workspace = true, features = ["rustls-tls-webpki-roots"] }
# A plugin process reads its invocation from stdin and may be handed local files. A wasm32
# build, such as an extension's hooks module that reaches this crate through alien-helm, does
# neither, and tokio builds `io-std` and `fs` for WASI only under `--cfg tokio_unstable`.
alien-core = { workspace = true, features = ["local"] }
tokio = { workspace = true, features = ["io-std"] }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
