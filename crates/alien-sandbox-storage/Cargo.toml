[package]
name = "alien-sandbox-storage"
version.workspace = true
edition = "2021"
description = "Cloud-neutral layout, commit, restore and garbage collection for sandbox persistent storage"
license-file.workspace = true

[dependencies]
alien-error = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
hex = { workspace = true }
reqwest = { workspace = true, optional = true, features = ["rustls-tls-webpki-roots"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tar = { workspace = true }
url = { workspace = true, optional = true }
uuid = { workspace = true, features = ["v4"] }
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[features]
default = []
# The agent's Azure transport: a key's directory reached with a directory SAS.
azure-blob = ["dep:reqwest", "dep:url"]

[dev-dependencies]
alien-azure-clients = { workspace = true }
reqwest = { workspace = true, features = ["rustls-tls-webpki-roots"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
serde_json = { workspace = true }

[[test]]
name = "azure_blob_live"
required-features = ["azure-blob"]
