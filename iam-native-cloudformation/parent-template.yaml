    Value: 1
    Description: Setup fingerprint algorithm version.
  DeploymentManagementConfig:
    Value:
      Fn::ToJsonString:
        platform: aws
        managingRoleArn:
          Ref: ManagingRoleArn
    Description: Deployment registration management configuration JSON.
  DeploymentStackSettings:
    Value:
      Fn::ToJsonString:
        deploymentModel: push
        endpointAccess:
          Ref: EndpointAccess
        updates:
          Ref: UpdatesMode
        telemetry:
          Ref: TelemetryMode
        heartbeats:
          Ref: HeartbeatsMode
        network:
          Fn::If:
          - NetworkModeCreate
          - type: create
            cidr:
              Fn::If:
              - HasVpcCidr
              - Ref: VpcCidr
              - Ref: AWS::NoValue
            availability_zones:
              Ref: AvailabilityZones
          - Fn::If:
            - NetworkModeUseExisting
            - type: byo-vpc-aws
              vpc_id:
                Ref: VpcId
              public_subnet_ids:
                Fn::If:
                - HasPublicSubnetIds
                - Ref: PublicSubnetIds
                - []
              private_subnet_ids:
                Fn::If:
                - HasPrivateSubnetIds
                - Ref: PrivateSubnetIds
                - []
              security_group_ids:
                Fn::If:
                - HasSecurityGroupIds
                - Ref: SecurityGroupIds
                - []
            - type: use-default
    Description: Deployment registration settings JSON.
  DeploymentResources:
    Value:
      Fn::ToJsonString:
      - id: execution-sa
        type: service-account
        importData:
          roleName:
            Ref: ExecutionSaRole
          roleArn:
            Fn::GetAtt:
            - ExecutionSaRole
            - Arn
          stackPermissionsApplied: true
      - id: default-network
        type: network
        importData:
          publicSubnetIds: []
          privateSubnetIds: []
          availabilityZones: []
          isByoVpc: true
      - id: management
        type: remote-stack-management
        importData:
          roleName:
            Ref: ManagementRole
          roleArn:
            Fn::GetAtt:
            - ManagementRole
            - Arn
          managementPermissionsApplied: true
    Description: Deployment registration resources JSON.
