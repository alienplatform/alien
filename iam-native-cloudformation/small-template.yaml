AWSTemplateFormatVersion: 2010-09-09
Description: Application setup stack for q5-policy-control
Transform:
- AWS::LanguageExtensions
Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
    - Label:
        default: Registration
      Parameters:
      - ManagingRoleArn
      - ManagingAccountId
    - Label:
        default: Network
      Parameters:
      - NetworkMode
      - VpcCidr
      - AvailabilityZones
      - VpcId
      - PublicSubnetIds
      - PrivateSubnetIds
      - SecurityGroupIds
    - Label:
        default: Operations
      Parameters:
      - UpdatesMode
      - TelemetryMode
      - HeartbeatsMode
    ParameterLabels:
      AvailabilityZones:
        default: Availability zones
      HeartbeatsMode:
        default: Heartbeats
      ManagingAccountId:
        default: Image account ID
      ManagingRoleArn:
        default: Management role ARN
      NetworkMode:
        default: Network
      PrivateSubnetIds:
        default: Private subnet IDs
      PublicSubnetIds:
        default: Public subnet IDs
      SecurityGroupIds:
        default: Security group IDs
      TelemetryMode:
        default: Telemetry
      UpdatesMode:
        default: Updates
      VpcCidr:
        default: VPC CIDR
      VpcId:
        default: VPC ID
Parameters:
  ManagingRoleArn:
    Type: String
    Description: ARN of the management identity allowed to assume setup-created roles.
    Default: ''
  ManagingAccountId:
    Type: String
    Description: AWS account ID for the management account that hosts application container images.
    Default: ''
  NetworkMode:
    Type: String
    Description: Choose create-new for a managed VPC, use-existing for your VPC, or use-default for the account default VPC.
    Default: use-default
    AllowedValues:
    - create-new
    - use-existing
    - use-default
  VpcCidr:
    Type: String
    Description: Only used with create-new. CIDR for the new VPC; leave unset for the generated default.
    Default: ''
  AvailabilityZones:
    Type: Number
    Description: Only used with create-new. Number of availability zones for the new VPC.
    Default: 2
    AllowedValues:
    - 1
    - 2
    - 3
  VpcId:
    Type: String
    Description: Only used with use-existing. Existing VPC ID.
    Default: ''
  PublicSubnetIds:
    Type: CommaDelimitedList
    Description: Only used with use-existing. Existing public subnet IDs.
    Default: ''
  PrivateSubnetIds:
    Type: CommaDelimitedList
    Description: Only used with use-existing. Existing private subnet IDs.
    Default: ''
  SecurityGroupIds:
    Type: CommaDelimitedList
    Description: Only used with use-existing. Existing security group IDs.
    Default: ''
  EndpointAccess:
    Type: String
    Description: Who can reach this deployment's endpoints. Private access requires AWS managed containers and cannot change after setup.
    Default: internet
    AllowedValues:
    - internet
    - private
  UpdatesMode:
    Type: String
    Description: How updates are applied after setup registration.
    Default: auto
    AllowedValues:
    - auto
    - approval-required
  TelemetryMode:
    Type: String
    Description: Telemetry collection behavior.
    Default: "off"
    AllowedValues:
    - "off"
  HeartbeatsMode:
    Type: String
    Description: Heartbeat health-check behavior.
    Default: "off"
    AllowedValues:
    - "off"
    - "on"
Conditions:
  HasPublicSubnetIds:
    Fn::Not:
    - Fn::Equals:
      - Fn::Join:
        - ''
        - Ref: PublicSubnetIds
      - ''
  HasPrivateSubnetIds:
    Fn::Not:
    - Fn::Equals:
      - Fn::Join:
        - ''
        - Ref: PrivateSubnetIds
      - ''
  HasSecurityGroupIds:
    Fn::Not:
    - Fn::Equals:
      - Fn::Join:
        - ''
        - Ref: SecurityGroupIds
      - ''
  NetworkModeCreate:
    Fn::Equals:
    - Ref: NetworkMode
    - create-new
  NetworkModeUseExisting:
    Fn::Equals:
    - Ref: NetworkMode
    - use-existing
  HasVpcCidr:
    Fn::Not:
    - Fn::Equals:
      - Ref: VpcCidr
      - ''
Resources:
  ExecutionSaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        Fn::Sub: ${AWS::StackName}-execution-sa
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
        - Effect: Allow
          Principal:
            Service:
            - codebuild.amazonaws.com
            - ec2.amazonaws.com
            - lambda.amazonaws.com
          Action: sts:AssumeRole
      Policies:
      - PolicyName: deployment-permissions
        PolicyDocument:
          Version: 2012-10-17
          Statement:
          - Action:
            - s3:GetObject
            Effect: Allow
            Resource:
            - Fn::Sub: arn:${AWS::Partition}:s3:::q5-policy-control/objects/object-0000
            - Fn::Sub: arn:${AWS::Partition}:s3:::q5-policy-control/objects/object-0001
            - Fn::Sub: arn:${AWS::Partition}:s3:::q5-policy-control/objects/object-0002
            - Fn::Sub: arn:${AWS::Partition}:s3:::q5-policy-control/objects/object-0003
            - Fn::Sub: arn:${AWS::Partition}:s3:::q5-policy-control/objects/object-0004
            - Fn::Sub: arn:${AWS::Partition}:s3:::q5-policy-control/objects/object-0005
            - Fn::Sub: arn:${AWS::Partition}:s3:::q5-policy-control/objects/object-0006
            - Fn::Sub: arn:${AWS::Partition}:s3:::q5-policy-control/objects/object-0007
            - Fn::Sub: arn:${AWS::Partition}:s3:::q5-policy-control/objects/object-0008
            - Fn::Sub: arn:${AWS::Partition}:s3:::q5-policy-control/objects/object-0009
            Sid: Q5PolicyRead
      Tags:
      - Key: managed-by
        Value: setup
      - Key: deployment
        Value:
          Ref: AWS::StackName
      - Key: resource
        Value: execution-sa
      - Key: resource-type
        Value: service-account
  ManagementRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        Fn::Sub: ${AWS::StackName}-management
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
        - Sid: AllowManagingRole
          Effect: Allow
          Principal:
            AWS:
              Ref: ManagingRoleArn
          Action: sts:AssumeRole
          Condition:
            StringEquals:
              aws:PrincipalArn:
                Ref: ManagingRoleArn
      Tags:
      - Key: managed-by
        Value: setup
      - Key: deployment
        Value:
          Ref: AWS::StackName
      - Key: resource
        Value: management
      - Key: resource-type
        Value: management
  ManagementRoleManagementPolicy1:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Application management permissions
      PolicyDocument:
        Version: 2012-10-17
        Statement:
        - Action:
          - iam:AttachRolePolicy
          - iam:DeleteRole
          - iam:DeleteRolePermissionsBoundary
          - iam:DeleteRolePolicy
          - iam:DetachRolePolicy
          - iam:PutRolePermissionsBoundary
          - iam:PutRolePolicy
          - iam:TagRole
          - iam:UntagRole
          - iam:UpdateAssumeRolePolicy
          - iam:UpdateRole
          Effect: Deny
          Resource:
          - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AWS::StackName}-management
          Sid: DenyManagementRoleChanges
        - Sid: ReadOwnManagementRole
          Effect: Allow
          Action: iam:GetRole
          Resource:
            Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${AWS::StackName}-management
      Roles:
      - Ref: ManagementRole
    DependsOn:
    - ManagementRole
Outputs:
  DeploymentSourceKind:
    Value: cloudformation
    Description: Setup source kind.
  DeploymentResourcePrefix:
    Value:
      Ref: AWS::StackName
    Description: Stable physical resource prefix.
  DeploymentPlatform:
    Value: aws
    Description: Target platform.
  DeploymentRegion:
    Value:
      Ref: AWS::Region
    Description: AWS region.
  DeploymentSetupTarget:
    Value: aws
    Description: Setup target.
  DeploymentSetupFingerprint:
    Value: render-preview
    Description: Setup compatibility fingerprint.
  DeploymentSetupImportFormatVersion:
    Value: 1
    Description: Setup registration payload format version.
  DeploymentSetupFingerprintVersion:
    Value: 1
    Description: Setup fingerprint algorithm version.
  DeploymentManagementConfig:
    Value:
      Fn::ToJsonString:
        platform: aws
        managingRoleArn:
          Ref: ManagingRoleArn
    Description: Deployment registration management configuration JSON.
  DeploymentStackSettings:
    Value:
      Fn::ToJsonString:
        deploymentModel: push
        endpointAccess:
          Ref: EndpointAccess
        updates:
          Ref: UpdatesMode
        telemetry:
          Ref: TelemetryMode
        heartbeats:
          Ref: HeartbeatsMode
        network:
          Fn::If:
          - NetworkModeCreate
          - type: create
            cidr:
              Fn::If:
              - HasVpcCidr
              - Ref: VpcCidr
              - Ref: AWS::NoValue
            availability_zones:
              Ref: AvailabilityZones
          - Fn::If:
            - NetworkModeUseExisting
            - type: byo-vpc-aws
              vpc_id:
                Ref: VpcId
              public_subnet_ids:
                Fn::If:
                - HasPublicSubnetIds
                - Ref: PublicSubnetIds
                - []
              private_subnet_ids:
                Fn::If:
                - HasPrivateSubnetIds
                - Ref: PrivateSubnetIds
                - []
              security_group_ids:
                Fn::If:
                - HasSecurityGroupIds
                - Ref: SecurityGroupIds
                - []
            - type: use-default
    Description: Deployment registration settings JSON.
  DeploymentResources:
    Value:
      Fn::ToJsonString:
      - id: execution-sa
        type: service-account
        importData:
          roleName:
            Ref: ExecutionSaRole
          roleArn:
            Fn::GetAtt:
            - ExecutionSaRole
            - Arn
          stackPermissionsApplied: true
      - id: default-network
        type: network
        importData:
          publicSubnetIds: []
          privateSubnetIds: []
          availabilityZones: []
          isByoVpc: true
      - id: management
        type: remote-stack-management
        importData:
          roleName:
            Ref: ManagementRole
          roleArn:
            Fn::GetAtt:
            - ManagementRole
            - Arn
          managementPermissionsApplied: true
    Description: Deployment registration resources JSON.
