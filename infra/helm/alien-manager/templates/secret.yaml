{{- if not .Values.adminToken.existingSecret.name }}
{{- $name := include "alien-manager.fullname" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "alien-manager.labels" . | nindent 4 }}
  annotations:
    # Keep the admin token if the release is uninstalled.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if and $existing (index $existing.data "admin-token") }}
  admin-token: {{ index $existing.data "admin-token" }}
  {{- else }}
  admin-token: {{ printf "ax_admin_%s" (randAlphaNum 32 | lower) | b64enc }}
  {{- end }}
{{- end }}
