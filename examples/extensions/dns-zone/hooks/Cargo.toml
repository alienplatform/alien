[package]
name = "acme-hooks"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
# `cdylib` is the WebAssembly module Alien loads; `rlib` runs the same hooks in `cargo test`.
crate-type = ["cdylib", "rlib"]

[dependencies]
alien-extension-sdk = { workspace = true }
acme-types = { workspace = true }
serde = { version = "1", features = ["derive"] }
