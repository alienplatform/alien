[package]
name = "acme-controller"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
acme-types = { workspace = true }
alien-extension-sdk = { workspace = true, features = ["controller"] }
# The AWS controller calls Route53, which Alien has no client for. Alien sends each request for
# the controller module, so the client needs no HTTP stack and no runtime.
aws-sdk-route53 = { version = "=1.121.0", default-features = false }
# `#[controller]` derives serde's traits, whose expansion names the `serde` crate.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The AWS controller's tests send a native Route53 client's requests to a server they run.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
aws-sdk-route53 = { version = "=1.121.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
tokio = { version = "1", features = ["macros", "rt", "net", "io-util"] }
