[workspace]
members = ["hooks"]
resolver = "2"

# Tells `alien extensions build` which crate is the hooks crate.
[workspace.metadata.alien-extension]
hooks = "hooks"

[workspace.dependencies]
# `alien init` points this at the Alien repository's tag for the CLI's release. In the
# repository, the example builds against the SDK beside it.
alien-extension-sdk = { path = "../../../crates/alien-extension-sdk" }
