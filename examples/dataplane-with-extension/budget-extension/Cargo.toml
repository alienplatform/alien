[workspace]
members = ["types", "hooks"]
resolver = "2"

# Tells `alien extensions build` which crate is which. There is no `controller` entry: the
# budget alert has no controller.
[workspace.metadata.alien-extension]
hooks = "hooks"
types = "types"

[workspace.dependencies]
# In the repository, the extension builds against the SDK beside it. Outside it, use
# { git = "https://github.com/alienplatform/alien", tag = "v<the alien CLI's version>" }.
alien-extension-sdk = { path = "../../../crates/alien-extension-sdk" }
budget-types = { path = "types" }
