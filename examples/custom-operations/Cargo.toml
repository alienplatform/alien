[package]
name = "custom-ops"
version = "0.1.0"
edition = "2021"
publish = false
description = "Typed diagnostics and export throttling for an HTTP application."

[[bin]]
name = "custom-ops"
path = "src/main.rs"

[[bin]]
name = "generate-metadata"
path = "src/bin/generate-metadata.rs"

[dependencies]
alien-operations-sdk = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls-tls-webpki-roots"] }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
axum = { workspace = true, features = ["tokio", "http1", "json"] }
tokio = { workspace = true, features = ["net"] }
